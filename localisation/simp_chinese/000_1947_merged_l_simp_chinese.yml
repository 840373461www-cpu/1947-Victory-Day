 DEN_Werner_Best_TNO:0 "维尔纳·贝斯特"
 POLITICS_WERNER_BEST_DESC:0 "维尔纳·贝斯特是一位坚定的德意志民族主义者，曾加入数个极右党派，因此他在1930年急切地加入纳粹党也就令人不足为奇了。此后，他成为党卫军的一员，利用自己的法律和行政能力为新生的盖世太保组织做出了贡献，并在慕尼黑协调了长刀之夜的行动。1940年，政敌迫使他放弃了在盖世太保中的职位，他转而到法兰西的军事占领政府任职，并在1942年被任命为德国驻丹麦全权代表。维尔纳处在一个尴尬的位置上，因为丹麦仍然获准保留君主制度、内阁以及半民主的议会。德国占领当局做出了许多妥协，他们甚至建议贝斯特不要将丹麦的犹太人运往集中营，以维持与丹麦政府的良好关系。1943年一次恢复普选的尝试以及一系列罢工行动使贝斯特将丹麦带入了德国的军事占领之下，议会遭到解散，但丹麦国王、内阁和大部分官僚机构都完整保留了下来。奇怪的是，贝斯特也没能阻止丹麦绝大多数的犹太人逃亡瑞典，数十年来坊间一直有传言称他是犹太人的同情者。\n\n战争结束后，丹麦仍然处于这种尴尬的不稳定状态。名义上她仍然是个独立国家，但受到德国的密切监管，德国人也一直在威胁恢复军事戒严。贝斯特仍旧在任，他曾短暂地尝试推行广泛的日耳曼化计划。50年代的经济崩溃导致资金枯竭，让计划不得不暂停，但贝斯特仍然希望他的梦想——让丹麦成为大日耳曼国的一部分——有朝一日能够实现。"
 NOR_Josef_Terboven_TNO:0 "约瑟夫·特博文"
 POLITICS_JOSEF_TERBOVEN_DESC: "挪威专员约瑟夫·特博文已在日耳曼尼亚的视线之外过了二十年的幸运生活。挪威是德国战略防御体系中的重要组成部分，但作为和平条件赋予当地人的自治权利在特博文看来却是颇为恼人的，他觉得挪威人虽是雅利安人，但却懒惰又无能，这种看法源自工业上的诸多问题、日耳曼化进程停滞不前，以及长久以来无法粉碎挪威的军事抵抗组织(Milorg)。\n\n挪威在德国的治下迎来了崭新的繁荣，但背后却潜藏着国民联盟的本土法西斯主义者和德国占领军的冲突。50年代的经济崩溃后，冯·法尔肯霍斯特不情愿地放弃了驻挪军队。而国民联盟的目标则是在德国内部保留挪威文化的独立性，这在特博文看来是无法接受的；更甚的是，理想化的德意志农耕生活方式与挪威政客推动城市化的诉求也引发了逐渐升温，但并非无可挽回的冲突。\n\n对特博文来说，潜藏更深的问题是欧洲仅剩的几个残存国家之一——瑞典王国的存在。许多人认为，瑞典人早在几十年前就应该识大体地把他们的议会民主制度丢进历史的垃圾堆。有说法称，瑞典人窝藏了挪威的异见人士，向忠诚的挪威公民散布有关德国的恶意宣传和阴险的谎言，在此之上，瑞典人还资助了抵抗组织的恐怖分子，让他们得以逃脱毁灭的命运。\n\n不过，在特博文看来，这些问题都不是不能解决的。但前提是德国能够维持稳定，从而让他能够在与国民联盟的谈判中将德国搬出来当作筹码，逼他们同意进行更进一步的日耳曼化行动。特博文统治下的挪威是德意志的忠实臣属。至少现在是这样。"
 GGN_hans_frank:0 "汉斯·弗兰克"
 POLITICS_HANS_FRANK_DESC:0 "律师、士兵、纳粹忠臣——现在，或许还是一名国王。汉斯·弗兰克将一生奉献给了民族社会主义党，曾与他的领袖一起发动了失败的啤酒馆暴动。二战期间，第三帝国以摧枯拉朽之势击溃了波兰，弗兰克随即被任命为管理此地的总督。他与党卫军通力合作，折断了波兰人民的脊梁，对学者、神职人员以及任何可能对德国新秩序构成威胁的波兰人进行了大肆屠杀。在弗兰克和党卫军的统治下，无数平民百姓的鲜血被炼化为燃料，点燃了名为死亡的焚炉。\n\n进入1942年后，希特勒不再像之前那般青睐弗兰克，总督发现自己在领地内正逐渐陷入孤立。西俄战争期间党卫军的背叛点燃了元首的怒火，导致希姆莱分子被彻底逐出波兰。这下，弗兰克真正成了孤家寡人，集中营内的“劣等种族”已被屠杀殆尽，他只能充当向日耳曼尼亚运送奴隶的批发商。前方等待着他的没有荣耀，也没有新的胜利能让他东山再起。除非，弗兰克能为自己创造赢得荣耀的机会。\n\n当日耳曼尼亚暗流涌动，希特勒的精神状态每况愈下之时，弗兰克对波兰的掌控却在不断增强。总督整天畅想着如何建造更多的摩天大楼、纪念碑和美术博物馆，梦想着将华沙改造为雅利安文化的天堂。人们私下嘲讽他为“斯塔利斯劳国王”，但这讥讽之言背后却暗藏着真相——汉斯·弗兰克也许真的能成为国王。"
 UKR_erich_koch:0 "埃里希·科赫"
 POLITICS_ERICH_KOCH_DESC: "这就是留给埃里希·科赫的，他应得的境遇。\n\n埃里希·科赫执掌大权时，就像个登上王座的恶匪。科赫所施行的政策，即使以纳粹的标准来看都算是残暴至极。他对殖民地的施政方略就是不停榨取资源，无尽地压迫着当地人口，唯一目的就是让乌克兰人民屈服。在科赫的监管之下，德国通过施行饥饿计划掠夺原先属于乌克兰人民的琥珀色田野，而他制定出的劳动配额也为当地人戴上了奴隶的枷锁。在科赫看来，正是他一手打造出日耳曼国理想中的生存空间：希特勒皇冠上的一枚血钻。\n\n当然，有压迫的地方就会有反抗。西俄罗斯战争爆发后，科赫已经无法处理乌克兰专员辖区的诸多问题。大量行政人员不停地向他索要物资，希望进一步靠粮仓为德国病态的经济输血。而在他的暴政下，越来越多的当地人开始争取自由，希望摆脱他一身造就的深渊。这一次，科赫再也没法靠暴力镇压来解决问题了，专员辖区的秩序彻底失控。\n\n即使恐怖分子横行、辖区难以继续盈利，这位专员依旧没打算改变现状。科赫或许自有解决办法，但却没有精力去改变乌克兰的命运。为了榨取更多的利润，科赫宁可将这片殖民地碾为齑粉。而现在，他正注视着乌克兰的尘土随风飘散。"
 OST_Hinrich_Lohse:0 "欣里希·洛泽"
 POLITICS_HINRICH_LOHSE_DESC:0 "如果有人稍微去看一看德国所有的专员辖区，他发现不了这个令人印象深刻的景象。德国的大部分专员辖区都处于崩溃的边缘，或者是对德国不忠，又或者仅仅是无利润的地狱。然而，在这些争吵不休的傀儡中，有一个脱颖而出，成为德国真正的瑰宝。德国东方专员辖区基本上是一个平静、有利润、多少部分日耳曼化的地方，这一切都是因为一个人：欣里希·洛泽。洛泽是一战老兵，纳粹党的早期支持者，还是石勒苏益格-荷尔斯泰因省的高级专员，他被指派成为专员丝毫不令人意外。从那以后，他对东方专员辖区的管理比较松散，把大部分必要的工作委派给他最忠诚、最能干的下属。这种策略已经取得了很多成果，因为东方领是日耳曼化程度最高、利润最高、最稳定的专员辖区之一。只要以作为花瓶的洛泽来控制这些人，这个系统就能运行下去。\n\n然而，人寿终有期，过去的几年洛泽越来越远离公众的视线。当他努力延续着团结的存在时，在他手下的人都明白，随着洛泽松散的手段越来越无力，那些曾经忠心耿耿的下属们现在开始越来越饥渴，开始觊觎着洛泽的位置。\n\n德雷克斯勒、施塔勒克和迈尔-兰德鲁特之间相互争吵，科夫纳的进攻越来越大胆，维图什卡和耶克尔恩在暗处监视与谋划，系统中产生了明显的裂缝。东方领的人民只能希望，要么洛泽康复，要么选出一位折中的候选人接替他的职位，以免里加街头发生混乱和流血事件。"
