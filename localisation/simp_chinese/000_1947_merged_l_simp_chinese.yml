 theocracy_party_long: "神权政党"
 marxism_leninism: "马列主义"
 communism_subtype_desc: "作为欧亚赤色大陆的执剑者，马列主义信奉先锋队领导下的无产阶级专政与公有制下的计划生产。随着苏联红军饮马塞纳河、横扫东亚，该主义已不再是颠覆性的边缘思潮，而是横跨两洋的庞大帝国秩序。它誓言以社会化工业与革命纪律，彻底埋葬摇摇欲坠的资本主义旧世界。"
 radical_socialist_subtype: "激进社会主义"
 radical_socialist_subtype_desc: "激进社会主义汇聚了非苏联官方路线的各路泛左翼革命力量。无论是工团主义的直接行动、底层工农的无政府自治，还是亚非拉以阶级解放为武器的反帝反殖民族运动，它们皆以激进的破壁姿态冲击现存秩序。它主张砸碎跨国资本与买办军阀的枷锁，拒绝按部就班的议会妥协，将全民族与劳动大众的彻底解放寄托于暴风雨般的直接斗争。"
 radical_socialist_desc: "革命派"
 reformist_socialist_subtype: "温和社会主义"
 reformist_socialist_subtype_desc: "温和社会主义主张告别流血革命与阶级斗争，在代议法治与宪政框架内通往社会主义。无论是议会讲坛上的改良推进、还是混合所有制下的市场调控，它力图兼顾社会正义与个体自由。它视自身为激进狂热与寡头剥削之间的理性桥梁，试图用选票、法律与公共福利，温和重塑一个兼具平等与尊严的世俗的社会主义社会。"
 reformist_socialist_desc: "改良派"
 social_democrat_subtype: "社会民主主义"
 social_democrat_subtype_desc: "社会民主主义恪守改良主义道路，立足于宪政民主与资本主义框架之内。它不寻求消灭私有制，而是依托独立工会、累进税制与“从摇篮到坟墓”的福利网络驯化资本。在冷战战备与民意诉求的双重挤压下，它坚持劳资共治与社会妥协，试图在自由市场的高效产出与无产大众的体面尊严之间，维系人道主义的脆弱平衡。"
 social_democrat_desc: "改良派"
 social_liberal_subtype: "社会自由主义"
 social_liberal_subtype_desc: "社会自由主义继承启蒙理性与普通法尊严，主张在自由市场之上构筑正义的制度护栏。它强调公民权利、司法平权与言论自由的不可侵犯，主张国家应以有限的二次分配保障机会均等。面对内外极端浪潮，它死守程序法治与人权底线，坚信唯有维护个体尊严与开放社会，共和国才能在风暴中保全其文明灵魂。"
 social_liberal_desc: "自由派"
 market_liberal_subtype: "市场自由主义"
 market_liberal_subtype_desc: "市场自由主义将私有产权、市场流通与自发秩序视为文明的核心支柱。它坚决反对国家的战时过度管制与高税收福利，主张推行自由贸易、硬通货以及小政府下的自愈机制。它坚信无形之手的效率远胜于国家的指令，并警戒任何以“国家安全”或“社会平等”为名的扩权行为，视自由企业为阻击国家利维坦的基石。"
 market_liberal_desc: "自由派"
 social_conservative_subtype: "社会保守主义"
 social_conservative_subtype_desc: "社会保守主义将传统伦理、宗教礼俗与家庭本位视为社会的定海神针。它既警惕激进左翼的街头抗争与文化解构，也对跨国资本的放任扩张保持保留。它主张在宪政框架内维护社会纪律与地方自治，将有限市场、传统权威与秩序维稳融为一体，坚信唯有立足于历史沉淀的道德基石，方能抵御冷战动荡对社会机体的撕裂。"
 social_conservative_desc: "保守派"
 national_populist_subtype: "国家民粹主义"
 national_populist_subtype_desc: "脱胎于带领美国走出大萧条、对美国政治作出极大影响的“王鱼”休伊·朗的“财富分配”的构想，国家民粹主义是大萧条废墟与美式平民情结的结晶。它主张“每个人都是国王”，通过行政铁腕征税、超级基建与兜底福利换取工农忠诚；对外则高筑抵御赤潮的堡垒。它既是底层平民对抗寡头的神圣利剑，也是碾碎宪政程序、加冕世俗利维坦的民粹思潮。"
 national_populist_desc: "民粹派"
 military_republicanism_subtype: "军工共和主义"
 military_republicanism_subtype_desc: "发端于加州航天走廊与五角大楼的参谋密室，军工共和主义坚信“科技代差即自由之盾”。它奉行独特的“二元市场体制”：民间消费领域恪守市场竞争与低税收活力，战略国防工业则由五角大楼以国家指令全面统筹。它既依靠供给侧减税铸造活力繁荣的自由市场为要塞造血，又以国家级军工法团构筑绝对安全屏障，在自由资本与总体战备之间维持着冷酷的天平。它摒弃常规血肉消耗，寄望于核威慑、超音速空天与工业产能，要将整个美利坚打造成一座高科技、重资本的自动化终极要塞。"
 military_republicanism_desc: "鹰派"
 authoritarian_democrat_subtype: "威权民主主义"
 authoritarian_democrat_subtype_desc: "威权民主主义保留了普选与议会的外壳，实质却由强人门阀与安全官僚紧密掌控。它利用行政特权操控选区、压制异端，将代议制改造为合法化统治的工具。面对内外危机，它声称非常时期必须让位于绝对秩序，在维持受控宪政与资本活力的同时，以强硬手腕维系国家的铁腕运转。"
 authoritarian_democrat_desc: "威权派"
 paternal_autocrat_subtype: "家长制独裁主义"
 paternal_autocrat_subtype_desc: "家长制独裁主义彻底摒弃了代议民主的繁文缛节，将国家视作一个亟需铁腕“严父”庇护的大家庭。政权依托职业军警、旧内务官僚网络与特许寡头维持运转，将自上而下的秩序、忠诚与服从奉为最高教条。它视一切独立政治运动为不成熟的骚乱，以赤裸裸的行政专断裁决社会纠纷，将全体臣民的命运完全托付于强人领袖的个人意志。"
 paternal_autocrat_desc: "独裁派"
 monarchism_subtype: "君主主义"
 monarchism_subtype_desc: "君主主义视王权与古典宗法为文明秩序的终极锚桩。面对赤色风暴的洗劫与现代共和国的背叛，它恪守神授王权、血统法统与君臣誓约。它既痛斥布尔什维克的弑君暴行，亦鄙夷大众民主的平庸动荡，誓以古老法度和王权敕令，在冷战风暴中守护最后的王座。"
 monarchism_desc: "保皇派"
 theocracy_subtype: "神权主义"
 theocracy_subtype_desc: "神权主义坚信世俗主权必须臣服于至高神谕。在核阴云与无神论赤潮压境的末世氛围中，它将冷战重构为光明与黑暗的终极圣战。无论是圣经带的末日生存公社，还是古老教派的政教合一政权，它都主张以严酷的宗教戒律统制社会与思想，视坚定信仰为抵御外界毁灭的唯一真灵方舟。"
 theocracy_desc: "教权派"
 corporatism_subtype: "法团主义"
 corporatism_subtype_desc: "法团主义主张彻底消灭阶级斗争与无序的资本竞争，将国家重塑为一个如人体般分工协调的“有机整体”。它取缔独立工会与自由雇佣，强制将劳工、资方与农业整合进由国家监管的垂直行业公会之中。政权以行政仲裁强推劳资合作，推行指令性生产配额与物价平抑，视社会为整齐划一的战备工坊，以国家利益至上统驭全部经济机能。"
 corporatism_desc: "法团派"
 third_positionism_subtype: "第三位置主义"
 third_positionism_subtype_desc: "第三位置主义横跨极左与极右的传统界限，同时仇视无神论布尔什维克与跨国金融资本主义。它主张超验的国家主义、激进的反帝立场与激烈的反物质主义，崇尚纯粹的阶级内聚、民族神圣性与武装殉道。从极端皇道派军官、黑衫突击队到激进的第三世界狂热民族战士，它试图在红白两大阵营的冰冷铁幕之外，以鲜血、暴力与前现代的浪漫狂热开辟出一条“第三条绝路”。"
 third_positionism_desc: "极右派"
 fascism_subtype: "法西斯主义"
 fascism_subtype_desc: "法西斯主义将民族国家的至高权威与对外全面进攻奉为信条。它彻底否定自由宪政与阶级政治，要求将全社会转化为高度集权的总体战机器。在对狂热领袖的绝对服从下，它推行严酷的准战时管制与意识形态净化，将公民权利彻底熔铸为国家的生存纪律，坚信唯有依靠铁血、暴力与先发制人的军事扩张，方能在冷战的丛林法则中夺取终极胜利。"
 national_socialism_subtype: "民族社会主义"
 national_socialism_subtype_desc: "民族社会主义将极端的种族优生学与血统纯洁论推向了政治神学的狂热顶峰。它彻底践踏人类普世文明与法理秩序，将历史简单粗暴地阐释为种族生存空间的残酷零和搏杀。伴随着第三帝国在柏林战火中的毁灭，这一意识形态在战后被列为全人类的绝对公敌。其残余势力退缩于阴暗的跨国地下网络与武装死硬派之中，依旧做着种族清洗与末日复仇的狂妄迷梦。"
 national_socialism_desc: "纳粹派"
