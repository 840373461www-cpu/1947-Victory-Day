 marxism_leninism_subtype_desc: "作为欧亚赤色大陆的执剑者，马列主义信奉先锋队领导下的无产阶级专政与公有制下的计划生产。随着苏联红军饮马塞纳河、横扫东亚，该主义已不再是颠覆性的边缘思潮，而是横跨两洋的庞大帝国秩序。它誓言以社会化工业与革命纪律，彻底埋葬摇摇欲坠的资本主义旧世界。"
