 AZH_Subhas_Chandra_Bose:0 "苏巴斯·钱德拉·鲍斯"
 POLITICS_SUBHAS_CHANDRA_BOSE_DESC: "看起来，命运似乎安排苏巴斯·钱德拉·鲍斯出生于一个忠诚于英国统治的家庭，成为那些无数“本地人”中的一员，而没有他们，英国人无法控制整个次大陆。然而，在即将成功进入享有盛誉的印度公务员队伍之际，他毅然放弃了一切，为了一个更伟大的目标——他深受苦难的祖国印度而奋斗。\n\n作为国大党内几位年轻、充满活力且左倾的声音之一，他呼吁采取更快和更激进的行动。尽管被选为加尔各答的治理者并担任国大党的最高职位，鲍斯很快发现自己与党内行动缓慢、循规蹈矩的领导层产生了矛盾。当战争爆发时，英国人担心他会破坏英属印度的统治，将他软禁在家中——但他却像电影场景一样成功逃脱，披着伪装直抵阿富汗。在德国的帮助下，他前往苏联。发现欧洲列强不愿提供帮助后，他最终转向日本寻求援助，组织了一支由印度战俘组成的军队，并宣称将向德里进军。几乎在同一时间，英属印度的统治崩溃了。\n\n在被邀请组建联合政府时，鲍斯欣然接受。但却因阿富汗战争的失败而受到指责，并几乎再次被监禁。不过此时，孟加拉及东部地区已忠于全印前进同盟，而非国大党，他再次成功逃脱。现在，他在等待，决心无论是通过和平还是战争，再次向德里进军。决定整个印度命运的时刻即将来临，而他将是引领这一进程的人。"
 CHI_gao_zongwu_TNO:0 "高宗武"
 POLITICS_GAO_ZONGWU_DESC:0 "所有人生命中都有那个瞬间——站在十字路口，命运的齿轮开始转动，你只能选择一个方向，不回头地走下去，你每个能做出的选择，结果或许都会南辕北辙。于高宗武而言，广州那个雨夜便是命运齿轮转动之时。他当时正逐字逐句地推敲汪精卫所起草的中日条约，字里行间的细节之处让他不由得心头一怵。阴郁的情感交织在一起，在他脑海中横冲直撞；那是对导师与领袖的无限忠诚，亦是不甘中华民族蒙冤受辱的冲天怒火。他秉持的理想汇聚成滚滚洪流，将他染上形形色色的气质性情。他思考着，脑海如一口煮开了的大锅，肮脏的邪念在锅中翻滚，沸腾的浮沫涌了出来，变为对内心的质问：他，到底是什么人？\n\n高宗武咳嗽了一声。他面前有着无数种可能，但他的慢性肺结核还是占了上风，将他从纷纷扰扰的国际舞台上拉了回来，回到一个普通人的生活。高宗武想着，要是他选择继续当教授，永不过问时政，那该有多轻松啊。可或许，自他进入九州帝国大学求学那时起，便注定要与如潮水起伏般变幻的中日关系同呼吸、共命运。高宗武不顾自己的病体，接受汪精卫的邀请，加入他的外交使团。高宗武对自己的工作十分得心应手——毕竟，他说得一口流利的日语；一名与他打过交道的同僚说过，他的日语天赋比绝大多数土生土长的日本人还要强，这不过是奉承之词，但高宗武的个人魅力毋庸置疑。\n\n高宗武游走于两个不同民族的楚河汉界之间，他内心深处，仍深爱着他的祖国。他敬仰孙中山，坚信汪精卫会继承总理遗志，将国父的理想发扬光大。汪精卫没能活到这一切实现的那天，周佛海和陈公博也接连下台；现在，轮到他坐上总统宝座。高宗武时常想起广州那夜——世界会怎样天翻地覆！\n\n他明白，历史已成定局。唯一能做的唯有紧握当下，弥补过错。"
 GUX_xia_wei:0 "夏威"
 POLITICS_XIA_WEI_DESC:0 "夏威为人无比忠诚，一向如此。\n\n自儿时起，他便与白崇禧和黄绍竑相识结交，并对他们竭诚以待。在二十世纪早期，他们三人同经考验，共渡难关，先是作为同学互相帮助，后是作为同志共同奋斗。他对新广西及其代表的一切忠贞不二，全身心投入其斗争当中，积极参与了对蒋的作战与对共的剿杀。然而，他的忠诚还要献给一样事物，他对其的忠诚不可动摇、至死不渝——那便是中国本身。毕竟，难道有人能说，在抗日战争风雷激荡之时，他没有为她投身国军，为她抗击日寇，为她浴血奋战吗？\n\n只是，单凭赤胆忠心，并不能使中国免于军靴之践踏。也是天不遂人愿，在桂军准备好前，在第11、19、20、29、31和38集团军得以发动最后一次胜利攻势，以此将日本陆军赶出国境前，时日已然无多。大局已定之时，夏威发现自己成为了广西高层中仅剩的最后一人。此刻，他感到绝望至极。日本军队正一天天逼近，他因此不得不走上谈判桌。在那，他面临着最终抉择：是抵抗到底、直至毁灭，还是代表“自由”广西省，对唯一合法的中华民国政府宣誓效忠？对此，他只得以做作之面孔，报以一声苦笑。他们想要他的忠诚？那就如他们所愿。\n\n此后，他便将自身的签名交给了他们，但他绝没有将真心也交付过去。他永不会如此。他绝不会向提线木偶献上忠诚，也不会把它交给背后捅刀的赤色分子。他将自身托付于一个梦想，奉献于一份对自由的永恒渴望。这梦想、这渴望永不会熄灭，直到有一天，他将广西家乡统领于强有力的铁拳之下。无比沉重的税负和几近恐怖的兵役压垮了人民？那不要紧。整个广西除战争机器外什么都不是了？也不要紧。真正要紧的是让中国彻底摆脱外国主子，让她再也不奴颜婢膝，再也不屈居人下。夏威为人无比忠诚。他献身事业，彻彻底底：为追求其实现，任何牺牲都不算过分。\n\n因为，舍此无物可委身。"
 GUZ_Lu_Han:0 "卢汉"
 POLITICS_LU_HAN_DESC_2:0 "稍微对云南局势有些了解的人都会知道卢汉将军，云南这个偏远小邦的统治者，上任的时候面对的是局势多么复杂的烂摊子。\n\n卢汉是彝族人，于1895年出生在昭通。在早些年，他就与自己的亲表哥龙云一同学习军事。和平的岁月一晃而过，当日本帝国主义入侵时，卢汉通过与日本人的一场场战争精进自己的战略水平，机智而狡猾地与日本军队对抗，保卫他的乡土远离压迫。但这还是远远不够。让卢汉深感痛苦与悔恨的是，他最终被日军击溃，而日本人迫使龙云退位，让卢汉成为了云南的新省长。自此之后，他只能设法在日本人的压迫下辗转腾挪，尽自己所能保卫云南的人民。\n\n当异议者谴责卢汉血腥镇压西南地区的土匪与叛军时，他自己的心也在滴血。卢汉的良心每日都在遭受煎熬，但他别无选择。他不得不镇压那些爱国者与饥民蜕变成的土匪，即使他的良心每日深夜的啸叫都让他辗转难眠。\n\n为了他自己的平安，为了他乡土的平安，为了全云南人民的福祉，他只能秉持自己的观念，一条路走到黑。反帝实在是虚无缥缈的屁话。受国之垢，是谓社稷主，只要能生存下去，那些流言蜚语与胯下之辱又算什么呢？"
 YUN_long_yun_old:0 "龙云"
 POLITICS_LONG_YUN_DESC:0 "宋时名将岳飞，背上有一刺青，上书“精忠报国”。他为宋帝尽忠，却被以“莫须有”而赐死，数百年之后的辛亥革命，他已成为反对外部帝国主义的标杆。如辛亥后的诸多青年一般，龙云同样将岳飞视作榜样，尽忠职守，而在那时，就代表着抗击强横的侵略者，勇毅奋进、不懈斗争，保家卫国。\n\n成为云南省政府主席前，岳飞的经历驱使他加入唐继尧军中，从低级士兵，到统领一军，直至发动一场政变，将贪婪腐败心中只有权势的唐继尧推翻，从他手中夺取云南。当日本入侵时，贯穿云南的滇缅公路是国民党的生命线，而龙云也召集部队，赶赴前线，为中国而战。\n\n在这场抗日战争中，无数中国青年就是抱着这股朴素的爱国情怀而奋战，无论是共产党人或是国民党人，都无关紧要：挥洒的汗血汇成纽带，成为民族共同反抗日本侵略者的记忆。成千上万的中国人民抛头颅洒热血，机枪与炮弹残酷收割生命，龙云将这一切看在眼里、埋在心里，即使如此，中国也不曾投降。蒋介石退守重庆，稳固阵地，即使他在保卫重庆一战中壮烈牺牲，革命军仍转进各地，未曾灭亡；中国，也不曾投降。\n\n南京政权认定自己是全中国的合法统治者，这大错特错。岳飞之死或许标志着中国陷入异族统治的黑暗朝代，但龙云与国军仍会高举抗争火炬，朝着黄金黎明赶赴而去。"
 GUZ_He_Yingqin:0 "何应钦"
 POLITICS_HE_YINGQIN_DESC:0 "每日每夜，命途多舛的何应钦对贵州的控制都看似摇摇欲坠。他的军队已经被滇系实际控制，而经济也岌岌可危。\n\n本来，众人都以为，作为蒋介石的左膀右臂，精明强干的何应钦会在中国的统治上扮演重要角色。当然，包括何应钦在内的大多数人都没能料想到，第二次中日战争是如此的凶残恐怖，以至于一大批国民党元老都命丧黄泉，而汪精卫得以起势。何应钦在战争的最后几天投敌，这使他的政治声誉险些烟消云散，直到现在一直站在风口浪尖。\n\n现在，何应钦这位由中国任命的贵州省长，正在平衡少数民族和汉族的关系，并试图稳步使国家自由化。同时，滇系的威胁也令他夜不能寐。"
 XIN_zhang_zhizhong:0 "张治中"
 POLITICS_ZHANG_ZHIZHONG_DESC:0 "张治中于1890年出生于安徽省，与许多同龄人一样，他在青年时代就被卷入了军阀混战之中。但与同辈们不同，张治中的战斗直至今日都未迎来终局。张治中就读于保定军校，毕业后加入了国民党之下的国民革命军。在北伐战争中，张治中奋勇作战、屡建奇功；在抗日战争期间，张治中毅然放下了政治分歧，与四万万同胞一同对抗日寇的入侵。\n\n战争开始后，日军的进攻高效而残酷，中国军队拼死血战，却依旧不敌占据绝对优势的日本军队。张治中率领其部队死守湖南，与日军厮杀数月之久。但是，一次错误的抉择却让将士们的牺牲毁于一旦：张治中不知从何处得知了日军即将总攻长沙的消息，他命令部队在日军进攻前烧光这座城市，不给敌人留下一点可以利用的物资。但事实上，这完全是张治中的误判，他的命令则酿成了一场闻名世界的惨剧：文夕大火。这场大火夺走了无数无辜百姓的生命，保卫湖南的部队也遭受了严重损失，湖南最终失守。但是，张治中并未放弃抵抗，他带领部队到达新疆，并宣布在这里继续抵抗入侵者。\n\n新疆是一片气候严酷的不毛之地，流落至此的张治中对此感触颇深。张治中的部队并不是第一支来到新疆的部队，他们虽然实力最强，但是在这里并不受欢迎。要想维持对新疆的统治，张治中必须维持好国民党、共产党与当地少数民族之间微妙的平衡。日复一日，年复一年，张治中十分耐心的经营着这片边陲之地。这位老将军唯一的希望，就是让祖国大地摆脱枷锁，再次迎来自由与复兴。"
 XIK_liu_wenhui:0 "刘文辉"
 POLITICS_LIU_WENHUI_DESC:0 "刘文辉生于1895年，是一个彻头彻尾的军人。他于1916年毕业于保定军校，自保定回川后，投入刘存厚川军麾下，1926年加入国民党后，在国军内迅速崛起，被提拔为国民革命军第24军军长，1929年被任命为四川省政府主席。省内军阀林立，令四川省十分不稳。通过远交近攻、阴谋暗害，以及武力威慑，刘文辉成功稳定其在四川省的绝对地位。然而，在1934年，他却被他的侄子刘湘赶出四川，逃往西康担任建省委员会委员长。刘湘与蒋介石关系就如四川本身与蒋的关系一般摇摇欲坠，他甚至多次拒绝蒋介石的命令。\n\n抗战期间，刘文辉稳扎稳打，没有让部队轻易冒进，日本人攻至四川时，刘文辉虽是四川最后的大军阀，但却选择召集部队，撤退至西康，在小城西昌扎营。刘文辉拒绝向日本投降，日本人也认为这个山区小省无足轻重，没必要耗费兵力攻打。\n\n日本攻克四川数十年后的今日，刘文辉作为中华大地仅存的独立军阀之一孤立无援。四川就在西康边上，或许受到中央政权的直接控制，但四川已再次陷入动荡，各式各样的势力都在争夺四川的控制权。刘文辉想要见到一个自由的中国，但手下却极力阻止。他们认定与日本作战，无异于自杀。或许只有奇迹，才能让刘文辉得以重新拿起武器……"
 QIN_ma_jiyuan:0 "马继援"
 POLITICS_MA_JIYUAN_DESC:0 "西北大地是一片洒满了鲜血的土地，曾经有一代人在这片土地上献出了自己的生命，他们之中有的人得以入土为安，其他人只能暴尸荒野。这些人的遗孤则满腔忧愤，手中握着破破烂烂的武器，继续生活在黄土高坡上。有一位年轻人的父亲被入侵西北的日本军队杀害，而他的儿子将杀父之仇铭记于心，继续治理着这片土地，并且发誓要为父报仇。他就是马步芳的儿子，马继援。\n\n马步芳战死之后，马家军的指挥权落在了雄心勃勃的马继援手中。然而，马继援只能眼睁睁地看着辻政信在西北横行霸道，他手下那些嗜血的强盗们烧杀抢掠无恶不作，犯下了太多令人发指的罪行。南边的西藏在边境上屡次试探，而虚弱的马家军无力做出反抗。马家军的敌人们也许以为马继援早已忘记他们犯下的罪行，但他们错了，马继援一直将这些暴行牢记心间，只待复仇的时机。\n\n华夏大地上正酝酿着一场风暴，暴雨前夜的安宁随时都会被打破。马家军正厉兵秣马、枕戈待旦，马继援要让那些欺马家、蹂躏故土的强盗血债血偿。虽然马家军已遭受严重的损失，但他们还没有被打倒。马继援对此十分清楚，很快，他要让全中国都知道，马家军已东山再起。"
 GNG_suzuki_teiichi:0 "铃木贞一"
 POLITICS_SUZUKI_TEIICHI_DESC: "前企划院总裁铃木贞一曾为功勋显赫的陆军将领，也曾密切参与战时经济建设和东亚新秩序的战后规划。自1943年以来，他便成为备受尊敬的贵族院议员。为利用他在中国活动的经验、军队人脉及经济建设的专长，井野首相任命他为广东行政长官，希望能让广东企业投入东京的怀抱。\n\n四大企业早已习惯了无人管束的营商环境，铃木初来乍到，却事事亲力亲为、大权独揽，这让巨头们很不高兴。不过，借助东京疏于监管产生的腐败风气，与井野首相授意下来自安田银行的支持，铃木暂时控制着眼前的局面。\n\n铃木眼前的这片土地深受贪欲的蒙蔽，所有人都将责任抛诸脑后，对他们的所作所为可能招致的后果不管不顾。虽说他对生活在这片土地上的华人没有太大感情，但他也敏锐地意识到，如果东京无法按照满洲国的级别为广东打造安全机关，铁拳镇压绝不是长远之计。为了帝国的将来，铃木必须为日本的统治打下根基，建立一个全新而强大的广东，将企业巨头的缰绳牢牢抓在自己手中。"
 GNG_nagano_shigeto: "永野茂门"
 POLITICS_SHIGETO_NAGANO_DESC: "十余年的时光浪费在了这片荒诞的土地上，那些嗜金如命的叛徒却只知随意拨弄日本青壮男儿的命运。十年啊！这十年换来了什么？这十年让天皇陛下的忠诚将士退化成了人形的小白鼠！\n\n对此，永野茂门直言：“忍无可忍！”\n\n东京授权当地帝国陆军指挥官全权处理手头问题。这是份迟到多年的命令，但总比不来好。如今永野茂门将镇压广东暴乱，结束混乱局势，恢复稳定秩序——四十年前他就曾在中国处理过同样的事务。广东不仅犯下过种种荒诞无稽的罪行，其存在本身就是个错误，它唯一的命运只有毁灭，而永野愿意做它的行刑者。\n\n足以毁灭广东根基的力量，凝聚在了永野一人身上。他一想到自己终于得以结束这场统御珠江三角洲的企业实验，心中便一阵狂喜。广东此前经历过的所谓战争，如今看来不过是儿戏罢了——\n\n§s因为永野茂门誓要让这怪诞的国度天翻地覆。§!"
 TIB_Tenzin_Gyatso: "丹增嘉措"
 POLITICS_TENZIN_GYATSO_DESC: "二十世纪这几次大动荡，将这万物的秩序颠覆，一次又一次，西藏民族却不曾变更动摇，仍屹立于那里。十四世达赖喇嘛，仍在这个坚忍不拔的国家中稳居首位。他也被称作丹增嘉措，是整个西藏的精神与政治领袖。虽缺乏直接的政治权力，但他对西藏及整个藏传佛教的影响力十分明显。\n\n同其他达赖喇嘛一般，丹增嘉措被认为是第十三任达赖喇嘛的转世，是神菩萨的化身。丹增嘉措于1935年7月9日生于藏华边界的红崖村，在四岁时他被西藏的喇嘛发现，通过他们的测试方式，确定了他下一任达赖喇嘛的身份。\n\n从那时起，他便成为西藏精神与政治的领袖，虽他上位时，西藏真正的权势掌握在其手下的喇嘛手中。这样一个公开的神权制度令外人好奇，也有人批判西藏及其内部的统治制度，但这制度却在清朝灭亡后的半个世纪中保持令西藏保持独立自主。"
 GAN_tsuji_masanobu:0 "辻政信"
 POLITICS_MASANOBU_TSUJI_DESC:0 "若是在金泽、长野，还有大阪这类地方，拉个高中生来问辻政信是谁，那得到的回答定是各种神乎其神、天花乱坠的事迹。北起北海道，南至九州岛以南，辻将军是全日本家喻户晓的战争英雄、伟大的泛亚细亚主义战士，正是他运筹帷幄之中、决胜千里之外，从万恶的英帝国主义手中解放马来亚。\n\n另一方面，从菲律宾的达沃到中国西北的兰州，在饱受压迫的人民眼中，真正的辻政信与那些赞美所述相差甚远。他是心狠手辣的刽子手、滥杀无辜的屠夫，更是日本亚细亚殖民帝国主义的狂热分子。诚然，辻政信一手策划入侵马来亚的作战，只用一个月就大获全胜，但这一战果却是以狂欢般的血腥屠戮为铺垫——从亚罗士打到哥打丁宜，马来亚的大街小巷被日军血洗一遍又一遍。\n\n这一切远未结束。单屠杀马来亚白人已无法满足辻政信的欲望，自那时起，他参与了一系列大屠杀，以及针对性种族灭绝，尤其是针对马来亚以及新加坡华人的“肃清”与骇人的巴丹死亡行军，战俘要么活活累死，要么就是像苍蝇一样被随意碾死。\n\n在日本呆了一段时间以后，这个老不死的畜生又从他的狗笼里被放了出来，现在，他又要对无辜民众痛下杀手。参谋本部任命他指挥新组建的西北方面军，前往中国平定不安分的西北地区。辻政信当然乐意之至，他已经迫不及待，要再上演一场血腥的屠杀盛宴。只有一头嗜杀、冷血、人性泯灭的畜生，才能消灭中国抗日运动的最后堡垒。没有人比辻政信更能胜任这个角色。"
 AFG_Mohammed_Zahir_Shah_TNO: "穆罕默德·查希尔沙阿"
 POLITICS_MOHAMMED_ZAHIR_SHAH_DESC: "穆罕默德·查希尔沙阿生于1914年，自1933年践祚以来，已统治了三个十年。前二十年，他将几位叔叔任命为相——首先是萨达尔·穆罕默德·哈希姆汗，他专揽朝政有十七年，一直到世界大战结束；接着是哈希姆汗的弟弟萨达尔·穆罕默德·马哈茂德汗，他实施了缓慢的自由化进步政策，允许政党成立，但阿富汗的经济遭受重创，马哈茂德汗的水利项目也没能成功；最后是1953年上任的达乌德汗，查希尔沙阿的堂哥，他依靠外国援助，执行了大规模的发展与现代化计划。\n\n但查希尔沙阿的故事并不局限于阿富汗国内。共产主义俄罗斯的崩溃，让德国人和日本人顶替了俄罗斯的地位、成为了阿富汗的首要支持者，阿富汗40%的预算都由他们资助。这笔钱比起土地税和农业税那7%的税收，不可不谓巨大无比。\n\n他们的支持，加上查希尔沙阿趁国外发生各种事件、精心准备的各种入侵行动和外交表演，令阿富汗成为了地区强权。阿富汗入侵塔吉克人的领地，占领沙赫达拉河以南的土地；支持突厥斯坦军团的侵略；庇护穆斯林联盟和真纳，在防止他们被德里伤害的同时，又削弱了初出茅庐的巴基斯坦军队。真纳的死让阿富汗谋得了两个保护领、入海口，以及向着普什图尼斯坦之梦的更进一步。最妙的一步，是承认加尔各答为印度合法政府，一方面令东京感到愉快，另一方面让德里感到震怒。\n\n有堂哥当他的左膀右臂，对塔吉克领地的控制也得到了巩固，查希尔沙阿觉得他简直是站在世界之巅。但他的统治并非一帆风顺：政治运动蓬勃发展；德里、中亚和新疆正准备向阿富汗复仇；阿富汗的赞助人也逐渐陷入混乱。更糟糕的是，国王意识到他的首相堂哥野心勃勃，并不只想安心服侍他。不过，国王关心的事情更加宏大。他要让这一个十年成为又一个成功的十年，让他和阿富汗更上一层楼。"
 KLT_Mir_Ahmad_Yar_Khan: "米尔·艾哈迈德·亚尔汗"
 POLITICS_MIR_AHMAD_YAR_KHAN_DESC: "对一位俾路支大汗而言，卡拉特可汗——米尔·艾哈迈德·亚尔汗·艾哈迈德扎伊——的人生旷日持久而波澜不惊。1902年，他呱呱坠地，那时英帝国统治着从卡拉特到克钦的整片印度次大陆，米尔·艾哈迈德也在这种环境下长大成人。在二十年代，他成了英国情报部门的忠实特工，报告称俄国人与马克思主义在他的贫穷臣民间的影响力与日俱增。三十年代，他当上了卡拉特可汗，英国人则以高级勋章——印度帝国勋章——表彰他的忠诚。\n\n大英帝国对印度的统治轰然倒塌，万物随之急转直下。当时，穆罕默德·阿里·真纳——他前不久还是大汗的法律顾问——竭力要求米尔·艾哈迈德·亚尔汗支持他的想法，在印度河流域建立一个独立的伊斯兰国家。尽管他那些更有主见的弟兄们纷纷反对，他仍然热心地支持了这一计划；在西部紧急状态之初，他还抱着谨慎的乐观态度，目睹了建立巴基斯坦国家的混乱尝试。\n\n唉，这一运动终归是一盘散沙，在东方的敌对政权面前不堪一击；为免全盘皆输，真纳采取了紧急措施，赢得了阿富汗的支持与干涉。那时候，已过去多少个春秋，现如今，卡拉特汗终于充分认识到了自己的处境，\n\n可汗很清楚，他的政府靠阿富汗人支撑着。假如阿富汗人的支持明天就消失了，那他的一切马上就得跟着完蛋。他也很清楚，他那些分离主义弟兄们不可信任；这帮人与他们“自由俾路支斯坦”的黄粱大梦只会以毁灭告终。在此之上，他更清楚，尽管他的朋友“伟大领袖”真纳已经与世长辞，但他的巴基斯坦运动仍顽强的生存着，且即使可汗不打算直接加入巴基斯坦，他们仍热切欢迎可汗的支持。\n\n但在那之前，可汗将等待时机。时机尚未成熟，巴基斯坦人根本没能提供足够的支持。但他还有时间可等。如果说米尔·艾哈迈德·亚尔汗有什么说得上来的特长，那就是等待与观望。一旦印度人哪天被自己的愚蠢绊倒，可汗势必将抓住这一时机。"
 MFP_Nawabzada_Shahabuddin_Khan: "纳瓦卜扎达·谢哈布丁汗"
 POLITICS_NAWABZADA_SHAHABUDDIN_KHAN_DESC: "贾多尔的汗、第尔的纳瓦卜，纳瓦卜扎达·谢哈布丁汗，纳瓦卜·沙阿·贾汉·汗的次子，是个无情且尽忠职守的人。\n\n考虑到他的第二份工作是被阿富汗任命为边境诸省的军事总督，以上的评价简直是恰如其分——这个职位是阿富汗王国为了镇压边境巴基斯坦军队残余而设立的。他的职责是确保巴基斯坦人的军队最多只能残留在这边境一带，而不会侵入阿富汗境内。作为阿富汗人忠诚的下属，他很乐意履行这项职责。\n\n曾几何时，谢哈布丁汗不曾受命镇压巴基斯坦人的时候，他也曾统治过巴基斯坦西北部的两个小土邦——两个本应属于巴基斯坦的地区。当时，许多人赞颂他为治下的国家的现代化所作的努力，包括一手资助其辖区内的学校、医院、防御工事与道路等等。但同时，许多人也批评他在和任何人打交道时都流露出来的无情。\n\n而现在，他对边境诸省的专制统治在提升许多人的生活水平的同时，也毁了许多人的生活。无数部落团体视他为敌，只因他为发展而不断征用部落土地，而除了他曾管治的贾多尔和第尔地区，边境诸省的民众对他也没啥特别好的印象，反而不少人对他专制且无情的统治感到不满，导致当地出现了亲巴基斯坦，甚至亲印度的情绪。\n\n而面对这类事情，纳瓦卜扎达只会一如既往地行事——维护自己的权威，压制异议，直到事件平息。既然这一套以前行得通，现在用回这套又会有什么问题呢？"
 BKU_Ahmad_Barzani: "艾哈迈德·巴尔扎尼"
 POLITICS_AHMAD_BARZANI_DESC:0 "难道对于库尔德人来说只有不得不向理想妥协，才有可能实现他们那个遥不可及的梦想——拥有民族自主权吗？看来是的。\n\n谢赫·艾哈迈德·巴尔扎尼年轻时曾失去了一切：身在襁褓之时，他的部落掀起了一场反抗奥斯曼帝国的起义，结果他的父亲、祖父和一位兄长因宁死不屈反抗最高朴特，而最后被处决，当时他甚至还没成年。直到他三十年代被短暂的放逐到土耳其之后，艾哈迈德靠他一己之力领导起数量众多的库尔德部落反抗伊拉克政府以及他们那徘徊在他兄弟穆斯塔法身旁的英国主子。\n\n人们都觉得他的战争不过是希望飘渺的无力挣扎，可到五十年代末，当伊拉克共和国发现自己与三头同盟交战时，巴尔扎尼靠着为土军作战以及自己在土耳其政坛内的私交甚广的优势，迅速控制了他的故土。现在谢赫坐在一尊由无数库尔德自由战士尸骨搭建的王座上，听着从安卡拉传来的一首首舞曲，在他们的命令下和着致命的旋律，翩翩起舞。"
 SHX_fu_zuoyi_TNO:0 "傅作义"
 POLITICS_FU_ZUOYI_DESC:0 "傅作义是忍辱负重的英雄，还是卖国求荣的叛徒？\n\n要想找到这个问题的答案，就得回顾傅作义将军的一生：年仅16岁时就参加了辛亥革命，从保定军校毕业后又加入了阎锡山的晋军，凭借着作战勇猛一路高升。在中原大战期间，傅作义被任命移防绥远，出任绥远省主席。他在这片土地上倾注了相当多的心血，百姓在他的庇护下安居乐业。随后面对日本人的入侵，傅作义毫不留情的予以坚决还击，一次次的挫败了日本人与其走狗德王的阴谋诡计。\n\n但是，单凭爱国之心无法阻挡兵强马壮的日军，绥远最终还是沦陷，阎长官控制的山西省也丧于敌手。在此之后，傅作义与阎锡山似乎消失在众人的视野中。当他们再次出现时，所有人都对他们表示怀疑，他们现身的时机实在太过合适了：日本刚正式与中国签订停战协议，而他们则急切表现出与愿意日本人合作的态度。为解决时常袭扰他们的游击队，日本人接受了阎锡山与傅作义的提议，将他们任命为一省长官。阎锡山回到了他的山西老家，而傅作义则被派到了各路土匪横行的陕西省。在外人眼中，傅作义是个卖国求荣的汉奸，而傅作义自己心里明白，他所做的一切都是为了保护爱国志士的权宜之策，即使这会让他背上卖国贼的骂名，傅作义也在所不惜。傅作义不顾阎锡山屡次责问，放任许多抗日势力通过陕西成功逃亡。傅作义暗自在心中发誓，总有一天，他会和这些爱国志士在解放中国的战场上再次并肩作战。\n\n傅作义坚守这一信念，如当年治理绥远一般精心打理着陕西，在他的老长官阎锡山去世之后，山西也归于傅作义的控制之下。如今，傅作义已是手握两省之地的封疆大吏，而他心中那一缕抗日救国的火焰依旧没有熄灭。但这缕火苗的未来正在变得飘忽不定：杀人如麻的辻政信盘踞陕西西部，抗日力量在他的残酷镇压之下渐渐灭亡。对此，傅作义束手无策，只能等待转机的到来。\n\n傅作义究竟是忍辱负重的英雄，还是卖国求荣的叛徒？历史终将做出正确的判断，因为这位将军已经为他的信仰付出了一切。"
 SHO_Yamamoto_Moichiro: "山本茂一郎"
 POLITICS_YAMAMOTO_MOICHIRO_DESC: "对山本茂一郎少将来说，马来亚本该是他硕果累累、又不乏血腥的政治生涯中最后的神来之笔，是日本征服中国和荷属东印度群岛的尾声与高潮。在马来奉公会与日益集权的印度尼西亚共和国之间的谈判破裂后，马来亚起义爆发，作为印尼“独立”谈判的重要推手，山本被从爪哇调来，强势介入当地，领导日本的干涉行动。\n\n干涉的最初阶段是成功的，除资源丰富和战略上至关重要的霹雳州北部和彭亨地区之外，马来亚抗日统一战线被驱逐出马来亚大部分人口中心城市。然而，从那时起，山本的神来之笔突然变成一滩急速恶化的沼泽，他不得不与一个神出鬼没的丛林战高手反复过招。然而，一切并非到此为止——它甚至比山本脑子里最坏的情况还要糟糕。\n\n随着印度共和国——有些人说OFN在背后撑腰——对遍地都是的反日叛乱分子展开援助，山本的手段愈发极端：在他看来，极端也是有道理的，因为马来亚人一直难以置信地抵抗日本人的合作努力。为此，他带来一些缔造了马来亚胜利的人，例如臭名昭著的反叛乱战略家西浦进。然而，山本的时间却所剩无几。他马上就要退休——而统一阵线的势头却一浪高过一浪。"
 KRK_Kadyrov_Abdurashit: "卡德罗夫·阿卜杜拉希特"
 POLITICS_KADYROV_ABDURASHIT_DESC: "‘是什么定义了你所了解的世界？’，不同的人对这个问题会给出不同的答案：德国青年会说是西俄战争，它将世界撕裂又拼接，好似本应如此；俄国青年共产主义者会说是革命阵线衰亡的那天；阿卜杜拉希特·卡德罗夫会说，是德国人滞留在A-A线的那一天，那是改变历史进程的一天。\n\n当俄军在瑟克特夫卡尔周边重整旗鼓之时，卡德罗夫对西俄罗斯革命阵线的忠诚随着家乡愈发动荡而逐渐消散。但西俄战争爆发之时，他的忠心经受住了考验。凭借意志，他终究没有临阵脱逃回卡拉卡尔帕克斯坦。而在阵线濒临崩溃之际，卡德罗夫恰好在南方的前线。他利用混乱的局势，抓住返乡的最后机会。他的同胞正如无头苍蝇一般，他决定敢为人先，在同胞与蒙受迫害的乌兹别克斯坦政治流亡者的协助下，他建立起卡拉卡尔帕克人的国度。\n\n卡德罗夫凭借西俄战争中立下的汗马功劳，以及建国之初的统治，令他广受民众尊崇。卡德罗夫也成为了任何妄图摧毁卡拉卡尔帕克斯坦之人眼中的肉中刺，他必须要确保人民的安全。"
 TAJ_Bobodzhan_Gafurov: "博博占·加富罗夫"
 POLITICS_BOBODZHAN_GAFUROV_DESC: "少有人会像博博占·加富罗夫这般忠于社会主义，他是著名的强硬派，即使苏联崩溃也一直忠于共产主义，并担任塔吉克斯坦共产党总书记。他最初是一名历史学家，很快就晋升为党的领袖。虽因德国铁蹄蹂躏苏联大地，塔吉克斯坦脱离了苏联，但他仍然掌控着另一个共产主义政权，并试图重新崛起夺回控制权。\n\n即使西俄革命阵线和哈萨克红军在西俄战争及其余波中崩溃，但加富罗夫仍保持对革命事业的忠诚，并与邻国哈萨克斯坦保持着密切联系。他知自己不精通政治，并非带领国家度过这段动荡时期的最佳人选，但仍拒绝将自己的权力交给任何人。这并非说明他想独裁，而因为他的理念和信仰：加富罗夫未能在国内找到任何他认为值得传递燃烧的社会主义火炬的人，因此一直保持着对国家的控制。\n\n尽管如此，总书记的控制正在日复一日地慢慢衰减。政治局作为政权的小型管理机构，其成员对领导人的忠诚日益减少。与此同时，反对政府的异见者准备着手掌控局面，推翻这个显然已经失败的体制。加富罗夫的统治可能很快就要走到尽头了。"
 TRK_Poda_Annaorazov: "波达·安瑙拉佐夫"
 POLITICS_PODA_ANNAORAZOV_DESC: "土库曼的革命并未随着苏联的陷落而终结，苏联及其代表的意志，始终是土库曼人民的坚定信仰。不过，当伊朗趁苏联陷落之机入侵土库曼斯坦时，俄国官僚和行政人员却抛弃土库曼人民，飞也似地逃回家乡。于是，保卫土库曼斯坦的重任落到了一位医师、一位保卫者身上，波达·安瑙拉佐夫，一位土生土长的土库曼人。\n\n率领一帮由土库曼部落民、苏维埃游击队员、朋友以及盟友组成的乌合之众，波达不仅击退了伊朗人的进犯，还将同时入侵的阿富汗人赶回老家。这位撒马尔罕的英雄立下赫赫战功令举国动容，自然，他就被提名为土库曼斯坦主席。然而，治国远难于战胜敌军。战争结束后，波达过了几年比上战场或疗伤还要难受的生活，这样的日子使他压力倍增。\n\n波达尽力统治着土库曼斯坦，但他终究不是个管理者。虽然他坚信布哈林主义，但他也发现，自己有时会被身边的顾问、部长、将领、盟友和官僚牵着鼻子走。在这里面，有些人同样深信着布哈林主义，而其他人尽管十分敬佩他（他同样敬佩这些人），却支持着与他所提倡的布哈林主义原则背道而驰的思想。随着时间一点一点流逝，他们的态度也越发不明朗。有时，这样的生活会让他希望能再一次开赴前线。"
 KYR_Kaliynur_Usenbekov: "卡利努尔·乌先别科夫"
 POLITICS_KALIYNUR_USENBEKOV_DESC: "过去数十年的群魔乱舞，给吉尔吉斯斯坦留下难以磨灭的印记。这印记刻于每寸国土上，刻于民众生活中，还以一种极为突出的方式，刻在了国家主席身上。卡利努尔出生于曾经的突厥斯坦苏维埃共和国。在父母悉心教养下，他成为一名理想典型的吉尔吉斯人。在听闻的故事传说中，他也了解到沙皇的反复无常与总督的残暴不仁，在耳濡目染中成为了堪称典范的马克思列宁主义者。之后，他加入红军，保卫他脚下的土地、身边的人民——还有那无穷的远方、无数的人民。\n\n而最终，苏维埃联盟凄然落败，卡利努尔别无选择，只得与同志返回家乡。他们原想借此在惨败后重整旗鼓，恢复元气，但却遭遇更多的交火冲突。邻近的塔吉克斯坦与阿富汗两国陷入战火当中，而随着时间的推移，塔吉克人的颓势日渐明显。于是卡利努尔率领吉尔吉斯人民红军，以万夫不当之勇抗击强敌。只可惜，他在交战中落入一位极其残暴的阿富汗将军之手，差点在冰冷的大牢中丢了自己的左眼。\n\n幸而，卡利努尔最终得到营救。这救援并非来自摧枯拉朽的解放大军，而是出自举世无双的一位英雄——图尔达昆·乌苏巴利耶夫。卡利努尔与图尔达昆紧密携手，以一再受挫的悲剧英雄之身份，回到吉尔吉斯斯坦。此后，他决心转向政治斗争，在其中争取属于自己的胜利。人民信任他，人民支持他，人民指望他——而他，定要为这中亚的涅槃重生，辟出一条康庄大道。"
 UZB_Fayzulla_Khodzhayev: "法伊祖拉·霍贾耶夫"
 POLITICS_FAYZULLA_KHODZHAYEV_DESC: "若想准确描述人类的精神，或是给出一个坚实不变的定义，就好似徒手摘月，绝无可能。而要辨认清究竟是哪种动力，驱使着民众每天起个大早、工作不辞辛劳，则更是荒谬绝伦——人类哪有这份聪明？驱使人们工作与生活的动力有成千上万种的解释。不过，在乌兹别克斯坦则不然，在这里，不论是在哪颗跳动的心脏中，在哪个运作的头脑内，你都找不见任何一种动力。\n\n遭受遗弃，忍受无视，承受羞辱……只有这些词能形容乌兹别克斯坦境内那些悲惨的灵魂。中亚的战火接连不断，苏维埃联盟渐次崩塌，国家的形势每况愈下，这一切都对乌兹别克斯坦的民族精神乃至文化传承，带来了痛至骨髓的残害。而此情此景下，再无人能比乌兹别克斯坦总理，法伊祖拉·霍贾耶夫，更能体现这个民族的精神状态了。\n\n法伊祖拉曾加入乌兹别克共产党，是一位满怀热情的党员。然而，相比于其他苏维埃共和国，乌兹别克斯坦从中央得到的援助实在有限，国土也日渐荒芜。而此后，西俄罗斯革命阵线的崩溃，又给了这个国家致命一击，使其信念崩塌，只得趔趄而行。此后，该国政府便一直浑浑噩噩，日趋麻木，向着阴暗泥沼的更深处匍匐而行。\n\n时至今日，乌兹别克斯坦仍然端坐中亚，不声不响，默许着独善其身之风四处播散，静候着国内社会危机愈演愈烈。也许还有一丝希望之光，描绘着一个大众摆脱冷气、人民敢于发声的未来，但那希望也是若有若无，极其微茫。除此之外，乌兹别克斯坦再无良药。\n\n再无良药，除了创造未来的人民自身。"
 KAZ_Dinmukhamed_Kunaev: "丁穆罕默德·库纳耶夫"
 POLITICS_DINMUKHAMED_KUNAEV_DESC: "丁穆罕默德·库纳耶夫不仅继承了哈萨克共产党第一书记之位，也继承了一个奇迹。沙亚赫梅托夫书记领导哈萨克斯坦的十年绝不平凡，历经两场灾难，哈萨克斯坦仿佛本应灭亡。沙亚赫梅托夫重病缠身，让孤立的哈萨克斯坦在下一个十年中更上一层楼的重担就落到了库纳耶夫身上。库纳耶夫相信，自己已经准备好应对挑战。\n\n然而，虽然哈萨克斯坦延续了下来，但是过去的伤痕并没有愈合，新的创口也还在不断出现。多年的忽视与破坏，令哈萨克族在自己的祖国里，人数都只能勉强过半。在北方，无穷无尽的难民与土匪蜂拥而下，要让天平更加倾斜。即便是当下，斯大林和布哈林留下的遗产也依然死而不僵。倘若哈萨克斯坦企图偏离他们的道路，那代表他们的势力就会出面干涉。\n\n目前为止，库纳耶夫在自己的道路上，走得还算顺利——哈萨克斯坦确实正逐渐脱离前书记的道路。库纳耶夫一直支持哈萨克族自己的产业与文化，他的政策不仅把哈萨克公民的地位放在俄罗斯流亡者之上，也在沙亚赫梅托夫的基础上更进一步促进地方工业的发展。\n\n不过，这条路线的反对者可谓多如牛毛。从菲京，到尤苏波夫，甚至沙亚赫梅托夫本人，也在反对者之列。不少人对库纳耶夫的做法忧虑不安，他们认为，破坏俄罗斯族和哈萨克族之间的平衡必将引发灾难。库纳耶夫则相信，十年后的哈萨克斯坦，定会是前所未有的强大自主。或许，世界不会同意他的观点。"
 UTL_Veli_Kayum_Khan: "韦利·卡尤姆汗"
 POLITICS_VELI_KAYUM_KHAN_DESC: "韦利·卡尤姆汗随着他所鄙视的苏联的崛起，玩弄起反共与民族主义思想。他移居德国学习，选择永远不回到苏联。他因其泛突厥与反苏的言论和看法，在突厥流亡者运动中崭露头角。欧洲爆发战争之际，他选择帮助与其意识形态有许多共同之处的纳粹。为达成目标，他跻身于突厥斯坦军团的创始人之列——一支由突厥斯坦合作者与战俘组成的军队。他们虽被纳粹认为是“劣等种族”，但这态度很快就发生改变，纳粹希望在“巴巴罗萨行动”中利用中亚突厥人的反苏情绪。在迅速征服布哈林苏联的过程中，军团扮演了次要角色。\n\n随着战争的结束，长期压迫着卡尤姆汗族人的国家彻底崩溃，而乌兹别克斯坦终于有机会获得自由。谋取独立地位的尝试最终失败，过了多年以后，他才得到了另一次机会。借着天时地利，还有阿富汗人的支持，军团收获的成果颇丰。卡尤姆主张泛图兰主义，他的最终目标是要统一中亚的所有民族。当然，这一进程的第一步是战胜一切螳臂当车之徒，无论敌人都有哪些。\n\n卡尤姆实施铁腕统治，但他仍面临着强大的反对力量。许多人对他的法西斯政府并不忠诚，有些人甚至怀有对法伊祖拉的同情心。如果卡尤姆想要成为突厥斯坦的领导者，首先就得巩固他在这个不稳定小邦的权力。随后，他需要令整个中亚尊崇他，信赖他的泛突厥思想。"
 SLG_Federico_Gomez_Salazar:0 "费德里科·戈麦斯·德·萨拉萨尔"
 ILG_Giuseppe_Castellano:0 "朱塞佩·卡斯特拉诺"
 POLITICS_GIUSEPPE_CASTELLANO_DESC:0 "朱塞佩·卡斯特拉诺将军可能是意大利皇家陆军上层圈子的最常见八卦话题之一。作为一个两次世界大战的老兵，他在上一次世界大战期间在巴尔干战场服役时表现出色，之后又升职进了意大利的最高司令部。卡斯特拉诺的雄心高涨，但是命运却另有安排——在战争结束几年后，新任领袖加莱亚佐·齐亚诺托付重任给卡斯特拉诺，让他去管理阿尔及利亚边疆这个法外之地。\n\n卡斯特拉诺担任阿尔及利亚军管领地的领导人已经有几年了，但他的领导对于改善这个地区的局势并没有多大作用。意大利殖民者们多数是从西西里来的，而且往往和老牌黑手党家族有所联系，他们被阿尔及利亚所吸引，是因为这个地区被认为远离罗马当局的监视。由这些殖民者形成的飞地遍布着阿尔及利亚，而关于卡斯特拉诺和黑手党关系的真正程度也有着许多传言。罗马决定支持由阿尔及利亚当地人形成的民兵组织，例如民族解放阵线，让他们武装反抗伊比利亚殖民地政府和他们的“黑脚”盟友，而这一决定也造成了进一步的不稳定。\n\n被困在阿尔及利亚的总督没有多少资源能来开展实际工作，而因此只能被迫坐视局势脱离他的控制越来越远。不过，随着三头同盟内部局势再度紧张，阿尔及利亚和卡斯特拉诺也许会发现自己再一次成为焦点。一旦如此，卡斯特拉诺也许会有机会向意大利证明自己的有用之处，从而找回脸面——从一个通过暗中交易和幕后谈判统治着帝国一个偏僻角落的将军，变成一个从众多敌人手中拯救帝国边疆的民族英雄。"
 IBR_Francisco_Franco:0 "弗朗西斯科·佛朗哥"
 POLITICS_FRANCISCO_FRANCO_DESC:0 "虽然国际上的评价总是功过参半，但不可否认的是，国士之才干是考迪罗弗朗西斯科·佛朗哥地位最好的保障。随着德国在二次世界大战中的胜利，葡萄牙的安东尼奥·德·奥利韦拉·萨拉查找上了佛朗哥，希望建起一个抵抗德国人的防御性联盟。起先，西班牙与葡萄牙是一个综合防御条约里的伙伴，接着，两国合二为一。\n\n几时繁荣几时落寞。繁华能几何？憔悴及兹辰。过去十年里，佛朗哥亲眼见证了国家那些不可逾越的灾厄。三头同盟中的旧日盟友，现在却为了蝇头之利，紧扼着对方的喉咙打作一团。曾经高高扬起的团结的幌子，现在都飘散在地。50年代对阿尔及利亚的殖民化政策、国家复兴的宏伟标志，随着时间的推移愈发展现出其两面性，将伊比利亚拖入了与意大利不断的冲突之中。《继承法》规定，两位考迪罗都去世后，葡萄牙将并入西班牙，重建起君主制。而萨拉查则胡搅蛮缠，认为《继承法》不应存在。心怀不满的长枪党“旧衫兵”企图发动一场政变，佛朗哥将他们解除权力，终于制止了政变。\n\n伊比利亚，曾经的骄傲，已然陷入困境的环抱中，甚至考迪罗也开始日益担心她是否还能维持统一。尽管他不曾向他人透露过这一想法，但却似乎能察觉到青萍之末旋起的微风。在他的内心深处，他认为自己至今所做的一切努力可能会化为灰烬，那一天随时都要到来。"
 IBR_Antonio_Salazar:0 "安东尼奥·德·奥利韦拉·萨拉查"
 POLITICS_ANTONIO_DE_OLIVEIRA_SALAZAR_IBERIA_DESC:0 "将自1932年起一直掌舵葡萄牙的安东尼奥·德·奥利韦拉·萨拉查贬低成一个碍手碍脚的官僚相当不公正，萨拉查凭着一己之力在祖国掌权，比佛朗哥控制西班牙还要早那么几年。只不过在德军入侵安哥拉与莫桑比克的压力下，他还是决定接受与恶魔的交易。当佛朗哥接近萨拉查，并提出把防御条约转变为一个国家时，萨拉查有保留地同意将葡萄牙与同为右翼国家的西班牙进行合并。如今的伊比利亚联盟宣告成立，曾经的西葡两国将会团结和睦、并肩作战……至少理论上会如此。\n\n然而，理想与现实相去甚远。萨拉查不怎么关心伊比利亚联盟的福祉，而格外关心葡萄牙自身的好处。一方面，萨拉查希望保护葡萄牙免遭任何伤害和麻烦，另一方面他又近乎病态地痴迷于否决任何试图巩固联邦的提案，很快便因其阻挠而在委员会中臭名昭著。他那“西班牙压迫葡萄牙”的偏执导致了他与佛朗哥本人的多次对峙，令佛朗哥视其为可能会导致伊比利亚分裂的众多因素之一。佛朗哥曾试图推动《继承法》的通过，这一法案意味着在两位考迪罗去世后，君主制将复辟，而葡萄牙将就此并入西班牙，这让西葡间的裂痕愈发严重。萨拉查则不然，他还清除了一伙试图发动反联盟政变的长枪党“旧衫兵”。"
 VIN_Ngo_Dinh_Diem_TNO: "吴廷琰"
 POLITICS_NGO_DINH_DIEM_DESC: "十年了，在被拒绝担任首相后已经过去了整整十年，而现在，在经历了越南历史上最大的危机之后，吴廷琰终于卷土重来。吴廷琰的仕途靠的是他在官场的缓慢升迁。日本人来到印支半岛时，他迅速改换阵营对抗法国人，并与日本人建立了联系。\n\n由于他在大越复兴会的建立中起到了举足轻重的作用，为了不被法国人逮捕而四处寻求庇护。然而不久，日本人就将殖民者赶出了越南。尽管吴廷琰功勋卓著，但这并不意味着当上首相的就是他，最终，陈仲金坐上了首相的位置。\n\n靠着十年的养精蓄锐，也靠着胞弟的帮助，吴廷琰到达了他仕途的顶点。无能的政府已被推翻，紧急状态已经确立，吴廷琰可以放开手脚，为越南带来秩序与正义。"
 VIC_Ho_Chi_Minh: "胡志明"
 POLITICS_HO_CHI_MINH_DESC: "这个被全世界称为胡志明的人也叫“阮生恭”和“胡伯伯”，此外还有五十到二百个笔名。除了1890年出生于越南中部并在法国和俄罗斯接受马克思主义政治培训外，几乎没有人知道他的私生活如何。然而，全体越南人——甚至是他的敌人——都知道他是一个通晓多种语言的有为诗人，他用汉字和国语字写成的诗歌几乎可以让所有越南人轻松阅读、聆听。\n\n可如今经过二十多年的斗争，人们比以前更了解他了。首先是与法国的斗争，然后是与维希法国的斗争，最后是与日本的斗争——胡志明非常清楚，这都是同一种帝国主义。哪怕形势再怎么危急，他也绝不会举手投降。胡志明在越南北部开辟了一片解放区，将地下工作者派到了全国各地。此时他并非仅仅只是一个领袖，更是日越两国政府的噩梦，身上好似有解不完的谜团。在敌人眼里，他就像一个神话中的英雄。\n\n但胡志明年事已高，即使日本对亚洲的控制力已然减弱，他也自知大限将至，可能再也看不到越南作为独立国家傲然雄踞东南亚的时候了。胡伯伯在越南民间家喻户晓，人人拥护。可他走后，人民要跟随谁呢？"
 VIN_Vu_Ngoc_Anh: "武玉英"
 POLITICS_VU_NGOC_ANH_DESC: "武玉英首相曾是一名职业医生，来自南定省北部的一个天主教官僚家庭。他早年在法国留学，并因此广受尊敬，曾参与过东京地区的天花疫苗接种。得益于他的名声，在1930年至1940年间，政府任命他为东京的众议院议员，让他在经济与金融总理事会工作。他职业生涯的分水岭是对北部饥荒的处理，作为援助与救济工作的主要组织者，他成了结束饥荒的大功臣。\n\n在1945年日本迫使越南独立后，他的事业轨迹出现了极大的转折。由于他行事有条不紊，富有同情心，陈仲金政府指派他担任卫生与救助部长，他出色地履行了职责。1952年，陈仲金辞职，陈文章保留了他的职务，并提拔他为副首相。武医生从未想过自己能到达如此高位。之后，随着四号攻势的失败，他又登上了首相之位。\n\n要是在其他时候，他一定可以成为一位出色的首相。他有着数十年的医疗生涯，也有相当的政治手腕，这为他带来了不小的余地。他做事有条理，富有同情心，就算得不到人民的爱戴，人民也不会过多指责他。但他现在是什么？只是上届失败政府的守门人罢了。吴廷琰的人为主义如日中天，国民党阵线也抛弃了他，似乎越盟的复兴已经无可避免。他的统治还没开始就结束了，唯一的问题是：谁将成为继任者？"
 CAM_Norodom_Sihanouk_TNO: "诺罗敦·西哈努克"
 POLITICS_N_S_DESC_TNO: "诺罗敦·西哈努克是柬埔寨的老国王，自1941年以来他就一直担任国王的职位，那时候柬埔寨还在法国治下。在日本人的压力下，他宣布了柬埔寨独立，并在担任国王的同时出任首相。1955年，西哈努克突然宣布放弃王位，这震惊了所有人，表面上看是为了逃避宫廷生活中的“明争暗斗”。作为一名“普通公民”，他将在保有国王名誉的同时自由参与到平民政治之中。\n\n西哈努克退位后成为了一个无情的人，柬埔寨的民主羽翼未丰，他便只手遮天。他所依靠的是人民社会同盟，这是一个服务于他个人的庞大组织，占领了整个国民大会。\n\n在平民政治层面，他同样冷酷无情，把异议之声扼杀，把自由高棉和印度支那共产党打为非法组织。虽然这两个团体都在威胁着西哈努克的国家建设计划，但是反政府的抗议也在变得越来越常见。柬埔寨生存在越南、日本和泰国的夹缝之中，显然西哈努克没办法解决柬埔寨的危局。"
 LAO_Kou_Abhay: "库·阿沛"
 POLITICS_KOU_ABHAY_DESC: "随着传奇亲王佩差拉·拉达纳冯首相的任期结束，富米·诺萨万用尽了他的政治遗产与最后的一点善意，把库·阿沛推到了首相的位置上。库·阿沛是一位贵族军人，曾在伊萨拉行动期间与泰国有合作，但这一点微不足道，不会引起争议。诺萨万认为选择此人可以在增加老挝王家陆军权力和延续佩差拉的自由遗产之间找到平衡。\n\n尽管如此，阿沛还是获得了微弱的多数，毕竟他只是政权的看守者，没有支持或得罪任何一个派系。从1959年佩差拉亲王任期结束，到1962年的选举，阿沛一直是一个无害而无为的首相。现在随着选举临近，阿沛终于可以准备卷铺盖走人了。\n\n对于库·阿沛本人，则没什么要说的。他是南方贵族之子，他的儿子是显赫的将军库巴拉西·阿沛。现在的他只是个垂死的老人，所做的不过是签署文件和监督游行。他是老挝进入下一个历史阶段的大门。"
 THA_Plaek_Phibunsongkhram: "贝·披汶颂堪"
 POLITICS_PLAEK_PHIBUNSONGKHRAM_DESC: "大元帅生于1897年，年幼时人们把他称作是一个“怪胎”——很少有人能预料到，他后来真的会从常人中脱颖而出。他统治下的泰国与多年前已不可同日而语。几十年来，他孜孜不倦地培养着泰民族，尽力将其塑造成符合自己心目中的形象。贝·披汶颂堪的泰国富丽堂皇、繁荣兴旺、但却完全与时代脱节。\n\n贝元帅是共和国的国父，执掌泰国近三十年，他大力推行着残酷的现代化、同时也促进了泰文化的复兴。他肯定欧洲的法西斯运动，从意大利的领袖和德国的元首那里汲取灵感，尽力模仿他们的威权民族主义，与包围着这个不发达国家的欧洲殖民帝国相抗衡。如果说是谁将泰国带入现代社会，谁的功劳最大，那非颂堪莫属。他凭借的正是对意识形态的自信和军事上的妥协。\n\n在日本的泛亚主义联盟中，泰国参与了亚洲各地血腥残酷的军事行动，将欧洲的殖民主义斩草除根。因此，公众对贝的支持日益高涨。然而，他为了巩固自身的权力，颁布了最终废除君主制的“家长宪章”。这使得异见分子蠢蠢欲动，纷纷在黑暗中抽出匕首、伺机而动。大元帅的健康状况持续恶化，人民对泰国的未来疑虑重重——他还可以活到为人民答疑解惑的那一天吗？"
 BUR_Aung_San: "昂山"
 POLITICS_AUNG_SAN_DESC: "革命者、社会主义者、叛徒、合作者、国父。\n\n以上这些词都可以用来描画缅甸国父昂山的形象，取决于你提问的对象是谁。昂山本名廷林，于1915年出生在一个中产阶级家庭。他本应成为缅甸众多的法律工作者之一，但他却选择了投身缅甸革命民族主义运动的潮流。自那时起，他的人生轨迹就开始急剧变化，很快就在我缅人协会中声名鹊起。他曾在1939年被捕，之后在仰光，一位名叫铃木敬司的日本军官与他进行了接触。两人之间的这段关系至少持续了十年之久，也再次改变了昂山的命运走向。\n\n1943年，随着印度陷落，缅甸也终于获得了独立，缅军中以昂山为首的革命民族主义者与巴莫的穷人党平分了权力，不过这种状况并不会持续太久。巴莫缺乏盟友，日本人也意识到了这一致命弱点。1952年的命定之日，波木昂与奈温向仰光的总统府进军，迫使缅甸立法机构举行全民公投，将昂山任命为临时总统。\n\n昂山终于实现了他的梦想，但并没有得到他应得的功勋：农村叛军肆虐，国家摇摇欲坠；宗教领袖与地主携手对抗昂山的世俗主义；日本的阴云依旧笼罩在缅甸上空。昂山没有其他出路，唯有向亲密盟友、同时也是启发了他的那个人：纳塔吉·苏巴斯·钱德拉·鲍斯求助，但后者将全身心都投入了彻底解放印度的事业上，对他爱莫能助。\n\n要想实现远大抱负、成为伟大之人，就免不了要付出重大牺牲——但问题是，重大，究竟有多重呢？"
 PER_Mohammad_Reza_Pahlavi_TNO: "穆罕默德·礼萨·巴列维"
 POLITICS_MOHAMMAD_REZA_PAHLAVI_DESC: "穆罕默德·礼萨·巴列维是一块空白的画布。在伊朗人民看来，沙阿并非凡人。在他的支持者看来，他是向现代化美好未来冲刺的波斯的象征。他是从战车上眺望巴比伦混乱废墟的居鲁士大帝，不是那个攻城拔寨、穷兵黩武的暴君，而是一位为他们带来现代化的解放者。就像在他之前的每一位万王之王一样，穆罕默德·礼萨·巴列维得到了一抔贫瘠的泥土，却希望将其打造成一片长满无花果、结着各式各样硕果的富饶果园。沙阿就是波斯钢铁意志的具现，坚韧不拔地挑战各种不可逾越的挑战。\n\n在那些诋毁他的人看来，沙阿不过是在世的大流士三世，他比日耳曼尼亚的亚历山大更加头脑简单。在他的敌人看来，沙阿也不是什么万王之王，而是德国任命的行省总督，嗯，还是个残暴的总督。无论如何，伊朗早已不是全世界都为之仰慕的那个国家了。曾经，在山巅之上矗立着高耸的宫殿，其中居住着品德高尚，智慧充沛的统治者；现在，只剩下几尊坟墓和一位生活在自己幻想中的老人诉说着过去的辉煌。沙阿是波斯永恒的警钟，他让波斯人民意识到他们的国家堕落到了何等程度。\n\n在穆罕默德·礼萨·巴列维自己看来，他的形象并非如此。沙阿不想重现昔日的辉煌，也不愿重蹈过去的覆辙。伊朗已经处于垂死挣扎的边缘。在摩萨台国有化油田并流放君主之后，没有什么事实比伊朗向日耳曼尼亚投降更为明了。德国人重建对国家的控制，并让他恢复王位时，沙阿知晓了真相。伊朗不能再通过固守过去来挽救自己的未来，他也不能沉迷于在瑞士阿尔卑斯山脚下玩花花公子的角色伪装了。他再也不能畏缩于他父亲——礼萨沙阿漫长而血迹斑驳的阴影下了。日耳曼尼亚政府日暮西山，其对伊朗油田的控制每一天都在变得越来越脆弱。当那一天来临，沙阿将使伊朗成为世界大国，走向她的黄金时代。他不再会是那个模糊的、脆弱的偶像，他，穆罕默德·礼萨·巴列维，将成为真正的万王之王。\n\n沙阿也许是一块空白的画布，但最美丽的著作总是从一块白布开始的。"
 TNS_Victor_Siminel: "维克托·西米内尔"
 POLITICS_VICTOR_SIMINEL_DESC: "如今的德涅斯特里亚省督是维克托·西米内尔将军。他并未主动争取担任这一职责，但他认为，自己的职责就是完成任务。\n\n西米内尔出身于摩尔达维亚的一个“拉泽西”，也就是自耕农家族，曾在第一次世界大战中立下汗马功劳。在对苏战争期间，他没有进入高级指挥层之中，而是在骑兵部队中服役，任职于罗马尼亚间谍机构，特别情报局的中层。\n\n安东内斯库倒台后，阿夫拉梅斯库内阁于1956年任命西米内尔为特别情报局局长，下令由他负责将反安东内斯库的间谍小组和军队派系重新吸纳进更为广泛的政府机构，因为其存在理由已经消失。西米内尔出色地履行了这一职责，因此尤柳·马纽的政府任命他转任德涅斯特里亚省督。按照西米内尔挂在嘴边的说法，“大杂烩地方的大杂烩政府”。\n\n在西米内尔的领导下，德涅斯特里亚长期抬头的游击队威胁暂时得到了遏制。可尽管取得了这一成功，西米内尔，乃至他的政治上级，都面临着一个问题：这地方究竟还能撑多久？"
 IME_Carlo_Alberta_dalla_Chiesa:0 "卡洛·阿尔贝托·达拉·基耶萨"
 POLITICS_GG_CHIESA_DESC:0 "卡洛·阿尔贝托·达拉·基耶萨总督的辉煌职业生涯让许多人感到惊艳，更多人则感到嫉妒。达拉·基耶萨是一名二战退伍军人，为追随父亲的脚步，他要求从皇家陆军调任到宪兵队，因为他的父亲也是宪兵队的一名将军。战争结束后，他被派往意大利新夺得的黎凡特领土，在那里，他在调查和镇压于黎凡特活动的各种恐怖主义和准军事组织的过程中展示了自己的能力和勇气。他接二连三地抓获恐怖组织成员，因此迅速在宪兵队中晋升，并引起了加莱亚佐·齐亚诺的注意。\n\n在任命新任黎凡特总督的时候，新任领袖齐亚诺并没有指派一名老牌法西斯，而是选择了这位年轻的将军。这个选择十分具有争议，因为众所周知，达拉·基耶萨对法西斯主义少有同情；但在他短暂的任期内，这位宪兵将军成功为黎凡特带来了一种和平的表象，尽管这也意味着他不得不采取一些离经叛道的手段。罗马方面想要成果，而达拉·基耶萨就给了他们成果——极端的叛乱组织得到镇压，同时他也与那些愿意谈判的武装分子签署了一系列停火协定。然而，黎凡特的前路仍然摇摇欲坠。\n\n在达拉·基耶萨看来，意大利这样的统治形式肯定不会长久，必须与黎凡特人民达成一定的协议，不然这片地区一定会再度陷入混乱。这位宪兵将军努力使黎凡特恢复了表面上的和平——但这种和平能持续多久，还有待于观察。"
 GUL_Enrico_Mattei: "恩里科·马泰"
 BHU_Kanwal_Singh: "坎瓦尔·辛格"
 POLITICS_KANWAL_SINGH_DESC: "在故事开始的时候，坎瓦尔·辛格将军还是一位英雄。他奋勇地冲上火线，名列第一批印度之虎勋章的受勋者之中，那是自由印度政府的最高军事荣誉。但在抗击英国人的独立战争结束之后，印度国民军开始反抗国大党的软骨头，坎瓦尔·辛格发现了新的机会。他占领了不丹这个在1910年被英国人从印度分裂出去作为保护领的山地小国，并得到了印度国民军驻不丹将军的职位。但在战争结束后，辛格接到了一项新的任务：确保不丹牢牢掌握在印度手中。随着时间推移，不丹游击队的威胁与日俱增，辛格将军的处境也越发孤危。\n\n除此之外，他对自己的内阁和军队的疑心也越来越重，军中流亡的孟加拉族将领更加重了他的担忧。他们可能会从他手中夺取权力，或者更糟的是，可能会是支持流亡不丹国王的间谍！在辛格看来，每个人都在针对他，而他是唯一一个能够让不丹投入印度母亲怀抱的人。然而，只有时间才能证明他是能将不丹带入印度，还是会让喜马拉雅山脉的巨龙再次咆哮。"
 ULS_Neil_Blaney:0 "尼尔·布莱尼"
 POLITICS_Neil_Blaney_ULS_desc:0 "尼尔·布莱尼出生于1922年民族主义运动高潮时期，他一生都在推进统一的天主教爱尔兰理想。无论是在阿尔斯特战场上担任中尉，还是在1948年成为众议院最年轻的成员，布莱尼始终坚定地致力于天主教民族主义。尽管他的激进主义和乡村风格使他成为城市选民的眼中钉，提前终结了他成为总理的雄心，但他在乡村地区的忠实支持者为他赢得了足够的政治影响力，使他成为“永久部长”。\n\n不幸的是，对于曾经的阿尔斯特人民来说，这位永久部长所掌管的是“北方郡部”，即前北爱尔兰实际上的总督。在将该地区置于都柏林控制之下的烈焰中锤炼而成的“北爱特区”，最初是一个临时行政单位，任务是使该地区与翡翠岛的其他部分保持一致。然而，整合停滞不前，保障稳定的德国驻军在经济崩溃后撤出，北爱特区变成了一个定时炸弹。埃蒙·德·瓦莱拉选择去拆除它的人正是尼尔·布莱尼。\n\n在就任北方郡部长后不久，布莱尼决心以他在德国学到的方法解决统一主义者的问题。北爱特区一夜之间变成了由不同的准军事组织、警察部队和军队组成的有序合体，布莱尼利用这些力量在一片枪林弹雨中镇压了阿尔斯特抵抗组织及其民众支持者。对他的共和党支持者来说，布莱尼无疑成了爱尔兰统一的救世主。此外，他在贝尔法斯特的成功重新点燃了他对获得爱尔兰最高职位的兴趣。"
 SIK_Tashi_Namgyal: "塔希·纳姆加尔"
 POLITICS_TASHI_NAMGYAL_DESC: "身为十一世却嘉和锡金独立后的首位领导人，塔希·纳姆加尔领导锡金在风雨飘摇的二十世纪中蹒跚前行，塑造了该国从旧到新的发展道路。\n\n纳姆加尔出生于西藏，在其兄长早逝后继承了王国，并被达赖喇嘛任命为新一任却嘉。纳姆加尔继位时年龄尚小，在宫廷的保护和英属印度的监督下，他努力维持着这个遗世独立的王国的安宁，却没有意识到世界已在悄然之间发生了巨变。\n\n旧世界被新秩序取而代之，锡金的主权也从大英帝国移交到独立的印度，经历了建国初期的痛苦，锡金从此不愿再做出任何重大的改变。自由印度成立后，锡金又顺理成章地变成了前者的附庸。纳姆加尔与自由印度政府密切合作，实现了国家的现代化，同时他个人也推动了早该进行的土地改革。\n\n虽然纳姆加尔因他对医疗保健、艺术和科学的慷慨投资而广受菩提亚-雷布查人的爱戴，也得到了尼泊尔族人的普遍认可，但锡金王廷的风评并未因他而好转。年事已高的十一世却嘉怅然若失地看着属于他的王国，思考着一个孤独的问题：\n\n“在我死后，这个国家会走向何方？”"
 POLITICS_ADOLF_HITLER_TNO_DESC:0 "谈到阿道夫·希特勒——大日耳曼国的元首兼总理，十九国至高无上的暴君，世界之都日耳曼尼亚的建筑师，国防军最高指挥官，德国民族社会主义工人党党首，《时代周刊》1938、1946和1961年的年度风云人物——这个人的时候，应该从哪里开始说起呢？\n\n他出身贫寒，是一位奥地利旅店老板的儿子，曾在慕尼黑和维也纳求学，在一战中服役于德国陆军并被授予勋章。没人能够否认，他的政治生涯宛如扶摇直上，就算是像啤酒馆暴动这样的挫折也只是让他离自己的野心更进了一步。他以暴力与政治作秀并举、把共产党和民主派赶出国会，成功登上了德国的权力顶峰。在他的领导下，德国挣脱了凡尔赛条约的枷锁，建立起一支令人胆寒的军队，让欧洲的其他国家屈服于德国的淫威之下，从大西洋到黑海，万字旗高高飘扬。在他的指导下，德国建立起日耳曼尼亚这样的伟大工程，他也精心监视着欧洲的不受欢迎者被残忍灭绝、投入火海。\n\n但这位全德意志的、从乌拉尔直到比利牛斯的全欧主宰也难逃岁月的摧残。那曾经能够让人群沸腾的呼声，现在只剩下尖锐的细语，精密的钢铁意志也已经布满锈痕。他正用那双曾写下《我的奋斗》的双手颤抖不止地为那幅水彩画添上最后一笔，上面描绘的则是那些正从他的记忆中缓慢褪色的，早已死去的面孔。亚历山大与拿破仑之后世上最伟大的征服者，现在成了一个衰弱的老人。1962年，他已经73岁高龄了，已经有人开始大胆地宣称他将不久于人世。而令全世界感到恐惧的则是，一旦元首的丧钟敲响，战争的熊熊烈火就将再次燃遍整个欧洲。"
 EGY_Farouk_I:0 "法鲁克一世"
 POLITICS_FAROUK_I_DESC:0 "埃及国王法鲁克是个十分具有品味的人。从积极方面来评价的话，法鲁克决心让生活成为一场派对，每一刻都应该充满乐趣和兴奋，这样才能防止精神老化迟钝。而从负面角度来说，他是埃及经济中的一个黑洞，完全抛弃了他的政治责任，令埃及十分尴尬。这位国王过去可能只是个热衷于改革和现代化的年轻人，然而，那早已是陈年往事了，现在法鲁克只想用尽一切手段给自己找乐子。\n\n在法鲁克闲下来的时候，他每天的生活就是花天酒地、吞云吐雾。不幸的是，更常见的情况下他会嗨起来，开着他的红色跑车全速驶过开罗的街道，或者向人群中投掷大量金币，以此来从事一些慈善活动。如果国王格外有兴致的话，他可能会坐上私人飞机，飞到他想去的任何地方。他暂时离开埃及会让众人都感到欣喜若狂，因为这通常意味着大权会有至少一两个星期落在更有能力的人手中。\n\n在他的世界之旅中，法鲁克“充分”利用了埃及的财富，将其挥霍在他想要得到的一切东西上面，无论是给他最新的情妇买一条钻石项链，还是将一套钱币加入他不断扩大的收藏品行列当中，抑或是为了尝试那些据说可以令人长生不老的偏方。不管他买了什么，肯定都对埃及人民没有一点好处。不过，法鲁克并非奸角也不是恶棍，他只是对周围的世界漠不关心而已。对这位国王来说，政治是一件严肃、冗长、常常令人厌烦的事情，因此他不想多去在意政治。他宁愿自己享乐，也不愿承受世界强加于他身上的什么责任。"
 WRS_Alexander_Yegorov: "亚历山大·叶戈罗夫"
 POLITICS_ALEXANDER_YEGOROV_DESC: "自弱冠之日起，亚历山大·叶戈罗夫便跻身行伍，自此终其一生与戎马为伴。他在1883年出生于萨马拉河畔，18岁时就加入了俄罗斯帝国陆军，并迅速崭露头角。早在革命前，叶戈罗夫就已加入社会革命党；1917年苏维埃政府掌握大权后，他更是凭借着这份资历进入政局、青云直上。从第一次世界大战到苏俄内战的西南前线，从伟大的卫国战争到西俄罗斯战争，他无不英勇奋战、身先士卒，这也使他在军旅生涯中至少五度为枪弹所伤。然而，叶戈罗夫却十分谦逊，他总是对自己立下的汗马功劳闭口不提，却默默担负起诸多失利的责任，即使有些失利其实和他毫不相干。即便是莫斯科落入德寇之手也没能击垮叶戈罗夫的意志。在流亡到A-A线以东后，他重振旗鼓，把西俄地区残存的红色力量重新统合在西俄革命阵线的麾下。他领导革命阵线在西俄战争中一路高歌猛进，只可惜在胜利的果实触手可得之际，通敌者和阵线内部的反动派从背后横插一刀，让一切成果付之东流。\n\n岁月飞逝，曾经横刀立马的老将现已年近耄耋，垂垂老矣。曾经在阵线一呼百应的叶戈罗夫手中的领导权日渐旁落，而他手下的军官集团则整日忙于争权夺利。阿尔汉格尔斯克变幻无常的气候和在军旅生涯中留下的旧伤让老将的健康状况雪上加霜，但阵线内部的裂隙却丝毫没有一点要弥合的意思。\n\n尽管阵线屡战屡败，叶戈罗夫的决心却从来未曾动摇——至少在国外的观察员看来是如此。他的决心必须坚定，因为仍有无数的俄罗斯人民忠于伟大的革命，而他的身上，肩负着他们寄予的希望与梦想。无论谁能成为叶戈罗夫的继任者，只有时间才能证明，这位继承人能否承担起这个重任。"
 BKR_Validi_Tugan: "艾哈迈德扎基·瓦利迪·托甘"
 POLITICS_VALIDI_TUGAN_DESC: "艾哈迈德扎基·瓦利迪·托甘，或者用他在国外更加知名的名字，泽基·瓦利迪·托甘，某种程度上是一位反映了二十世纪巴什基尔历史的人物——在青年一代形成民族认同，经历了俄国内战带来的变局，屈辱般地被剥离传统，以及最终，得到了再度证明自己的机会。作为一名伊斯兰神职人员的后代，瓦利迪成为一位颇有所成的突厥学家，研究沙俄末期的巴什基尔民族历史。在那段时期，为了促进俄罗斯穆斯林群体的利益和巴什基尔自治，他开始进行政治活动。\n\n两次俄国革命后，瓦利迪成为巴什基尔民族主义最知名的象征。他最初与布尔什维克合作，相信他们会打破沙皇对人民奴役的诺言，但后来他发现布党的口号之下掩藏的正是自沙皇时代就压迫着诸民族的大俄罗斯沙文主义。他被赶出了巴什科尔托斯坦，继续在中亚与巴斯玛奇运动一道同苏维埃独裁主义作斗争，但毫无结果。他被迫流亡，与自身根源的联系被强行斩断，但他继续在国外进行着学术活动，在千里之遥维系着巴什基尔学术传统的存续。\n\n在西俄战争带来的乱局中，独立的巴什基尔伊斯兰共和国成立了，但当时没有人会觉得瓦利迪会涉足混乱不堪的巴什基尔政坛，年轻一代甚至都少有人能记得他的名字。他们真是大错特错！从土耳其回到战乱频仍的俄罗斯腹地并不是一件轻松的事情。他的功绩在自己的家乡再度得到人们的认可，在这个巴什基尔人与穆斯林故土的主权面临重大挑战的时代，他顺理成章地成为了巴什基尔民族的领袖。"
 GAY_Mikhail_Antipin: "米哈伊尔·安季平"
 POLITICS_MIKHAIL_ANTIPIN_DESC: "米哈伊尔·伊万诺维奇·安季平原先不过是车里雅宾斯克一名卑微的农夫，比起教育或哲学问题，他更多关心的是日复一日的生存问题。在责任——当然也有征役——的感召下，他摆脱了这种生活，作为一名机枪手加入步兵部队，前往乌克兰战线作战。他是一名硕果累累的战士，甚至一度获得苏联英雄的荣誉，但他没来得及获得应有的荣耀——不久以后，政府就垮台了。他的部队陷入内讧，他独自一人逃了出来，身上只剩下蔽体的衣物。\n\n在荒野中游荡了一个多月后，安季平来到了盖尼镇，当地的一位神父收留了他，并细心照料直至他恢复健康。在这个过程中，安季平获得了某种宗教上的启示，他觉悟到俄罗斯所有那些骇人的悲剧——沙皇的无能、德国入侵、十月革命、苏维埃的暴政、饥荒、又一次的德国入侵，这一切绝非偶然，而是惩戒。俄罗斯的众人背弃了主，因此，祂将罪孽的报应降临。\n\n神启为安季平的生活注入了新的意义。他将盖尼和附近村庄的人们召集起来，竖起“圣格奥尔基骑士团”的旗帜，许诺道，“那无神论的恶龙，将被真理之矛贯穿。”这一骑士团虽然规模很小，但为该地区的人民带来了稳定与精神上的激励，不得不说他们卓有成效地抵御了狂人们和异教徒的侵蚀。安季平大团长只会在上帝面前跪下，而拒绝让骑士团向任何凡间统治者屈膝，可一旦他找到了一位足够虔诚的领袖，为了上帝的事业，他乐于献上自己与部众的忠诚。"
 GOR_Ivan_Chernyakhovsky: "伊万·切尔尼亚霍夫斯基"
 POLITICS_IVAN_CHERNYAKHOVSKY_DESC: "在俄罗斯无政府混乱烈焰的炙烤灼烧之下，伊万·丹尼洛维奇·切尔尼亚霍夫斯基的灵魂已然化作灰烬——但在这片择人而噬的废土之上，他已经能算得上是位幸运儿了。\n\n切尔尼亚霍夫斯基的转变始于西俄战争。在彼时的岁月里，他曾是名开朗乐观、鼓舞人心的指挥官，率领着麾下的第8集团军奋勇战斗。后来，当加夫里洛夫退却时，切尔尼亚霍夫斯基也后撤到了高尔基，如同礁石般屹立，抵御着俄罗斯一浪高过浪的混沌浪潮。\n\n然而，他回到的国家就像他曾经逃离的那片土地一样迷失了方向。人民为反动思想所蛊惑，无情地耻笑着红军；共产党人也摘掉了身上的红星，与法西斯蒂和资本家为伍。当他到达高尔基时，切尔尼亚霍夫斯基的脑海中余下的唯有愤怒：对摧毁家园故土的德国侵略者，和背叛祖国事业的俄罗斯人。\n\n如今，身在高尔基的切尔尼亚霍夫斯基困处囹圄，指引他的只剩下痛苦与责任。俄罗斯已经步入歧途，他因而选择将自己的精力悉数集中于运用手中余下的力量削弱德国。与德国的战斗是共产主义最后的希望——尽管代价沉重，但战斗绝无止息。"
 KOM_Nikolai_Voznesensky: "尼古拉·沃兹涅先斯基"
 POLITICS_NIKOLAI_VOZNESENSKY_DESC: "尼古拉·阿列克谢耶维奇·沃兹涅先斯基，原先只是苏联政坛的一名中层人物，但现在却发现自己成为了前苏联的一小块地方上唯一的（尽管有些瑕疵）民主的保障。沃兹涅先斯基凭借其经济科学和行政管理方面的才能在同僚中脱颖而出，在西俄战争前夕，他得到红军最高统帅部的青睐，获得了监管科米苏维埃社会主义自治共和国恢复的任务。沃兹涅先斯基在这个地方苏维埃上做出了不少贡献，因此在科米人民中收获了相当的欢迎，人们认为他希望把普通人的利益置于渴望权力的苏维埃派系间的争吵和阴谋之上，是一位仁善的政治家。\n\n阵线军人与瑟克特夫卡尔那些强硬的共产官僚间无休止的权力斗争的结果，是科米苏维埃社会主义自治共和国现任主席沃兹涅先斯基成为了共和国中唯一还可以自诩获得人民支持的挂名领导。苏维埃高层的无能与狭隘给科米带来阵痛，并几近令其毁灭，他对正统马克思主义教条的幻想破灭了。于是他将共和国的政治制度重塑，摆脱了一党专政，科米成为了代议制民主国家。在这里，男男女女都可以自由发声，一直都将如此。\n\n尽管沃兹涅先斯基的努力让科米的普通市民们过上了充满信心、吃喝不愁的日常生活，可是卑鄙的瑟克特夫卡尔派来了许多卑鄙的家伙，这些人全心全意地想要推行他们的制度，根除科米的民主。而且沃兹涅先斯基面临的挑战不仅来自极端分子，也来自他的民主派同僚。他们指责沃兹涅先斯基的粗暴和不当行为，以及他还与各种社会主义团伙保持着的暧昧关系，以此质疑他是否有能力维护共和主义价值。然而，面临有这些政治压力，沃兹涅先斯基不会放弃他所设想的体制，他可不是个不战而降的人。"
 ONG_Vladimir_Kirpichnikov: "弗拉基米尔·基尔皮奇尼科夫"
 POLITICS_VLADIMIR_KIRPICHNIKOV_DESC: "二战前，弗拉基米尔·瓦西里耶维奇·基尔皮奇尼科夫只是苏联红军的一名普通指挥官。人们认为他必定会勇敢地与敌人作战，并以苏联英雄的身份捐躯，但他注定要走上另一条迥然不同的道路。在俄罗斯陷入军阀林立的混乱时期前那几个月的战争中，基尔皮奇尼科夫率领第43步兵师在卡累利阿地峡与芬兰人作战，敌人凭借优越战术击溃了苏联的前线部队，第43师几乎全军覆没。在一片狼藉的溃退中，基尔皮奇尼科夫被俘，并遭受了芬兰军队的审讯和关押。\n\n这位少将就这样一直被关在牢里，直到西俄罗斯战争爆发。自东线战事结束以来，芬兰一直受到德国国防军的保护，没有受到俄国混乱局面的影响。然而，只要西俄罗斯革命阵线的攻势冲过以A-A线，芬兰就将身处危险之中。现在，他们已经无法把守卫自己国境线的希望全部寄托在德意志国身上了。为了解决这个问题，芬兰人组建了反共志愿军。这是一支由俄罗斯人在他们的领土上编成的武装力量，由基尔皮奇尼科夫本人领导。芬兰对他们许下承诺，只要他们把红军赶出阿尔汉格尔斯克，他们就能在这块领土上获准独立并安居乐业。\n\n现在，基尔皮奇尼科夫统治着这个以奥涅加为中心的小小军阀国家，他必须挺身而出，同西俄罗斯革命阵线抗衡。尽管芬兰人仍然在一定程度上控制着该国，但是如果基尔皮奇尼科夫的反共志愿军把阿尔汉格尔斯克从共产主义者手中解放，卡累利阿的俄罗斯人最终就可能重获自由。"
 PRM_Gutrum_Vagner: "古特鲁姆·瓦格纳"
 POLITICS_GUTRUM_VAGNER_DESC: "西俄罗斯的怪诞狂徒——阿列克谢·亚历山德罗维奇·多布罗沃利斯基的出身可谓是平平无奇。战后苏联陷入崩溃，他的家庭难以为继，剥夺了他一展抱负的机会。但跟大多数同龄人一样，他接受的教育时刻强调社会主义学说的先进性。\n\n但是，西俄罗斯革命战争期间，多布罗沃利斯基被征召入伍后，却亲眼目睹红军被更强大的敌人无情屠杀，他不禁为雅利安巨剑的威能所折服。他与少量同伴躲进了彼尔姆的密林，投身于对真理的探索：为什么德国大军能够轻松碾碎苏维埃国家，征服斯拉夫部落呢？\n\n他在俄罗斯的历史中找到了答案。彼得大帝游历欧洲，归来后便强制人民践行更加先进的文化。显然雅利安精神的真谛并不在于种族，而在于心灵。得到启示后，他便给自己取了个雅利安式的名字：古特鲁姆·瓦格纳，自封“雅利安兄弟会元酋(Fyurer)”，宣布彼尔姆为雅利安伟大复兴的基地。瓦格纳领导着俄罗斯最恐怖的军队，准备把这片土地带回雅利安文明的摇篮。"
 SAM_Andrey_Vlasov: "安德烈·弗拉索夫"
 POLITICS_ANDREY_VLASOV_DESC: "对于许多俄罗斯人来说，那位倒戈的红军将领安德烈·安德烈耶维奇·弗拉索夫的名字仍然是一个敏感话题。在他为数不多的支持者的眼里，弗拉索夫就是现代的伊万·卡利塔。卡利塔是一位有远见的统治者，他明智地向军事上占优势的征服者屈服，然后利用他们的支持，来为未来强大而独立的俄罗斯国家赢得立足之地。然而，对于大多数前苏联公民来说，他的名字与最令人憎恶的背叛联系在一起，就像犹大一样。当然，弗拉索夫的真实性格远没有那么诗意。\n\n很难说这位臭名远扬的将军究竟是出于用德国刺刀刺穿红祸的真诚愿望，还是仅仅是为了在与纳粹结盟时生存下去才做出这些举动，但不管他的动机如何，德国最高统帅部从不认为他是一个值得关注的盟友，只允许他在战线的后方默默地注视着自己的国家被德国军靴践踏。\n\n弗拉索夫最后一次在德国人和俄罗斯人民眼中救赎自己的机会出现在西俄罗斯战争期间，当时他的俄罗斯解放军帮助扭转了西俄罗斯革命阵线进攻的局势。尽管弗拉索夫帮助击退了苏联人，并在战后于萨马拉获得了自己的领地，但德国人仍然把他看作一条拴着短绳、需要密切监视的狗。不光要受到主子们的羞辱，就连那些曾经他信赖的官员们也不喜欢他，他们开始把他卑躬屈膝的行为视为解放俄罗斯的障碍。弗拉索夫，软弱、孤立的男人，只能寄希望于重夺俄罗斯将会免去他那悲惨的称号——恶心的卖国贼。"
 TAR_Abdulla_Alis: "阿卜杜拉·阿里什"
 POLITICS_ABDULLA_ALIS_DESC: "阿卜杜拉·阿利什可能是一位苏联公民，但他首先是个鞑靼人，他把他的祖国看得高于一切。阿利什作为农民的儿子，成为了最著名的鞑靼作家和记者之一。在二战期间，他曾在红军服役，也侥幸在布良斯克躲过了被德军俘虏的命运。苏联崩溃时，他只是呆在家里。鞑靼苏维埃社会主义自治共和国侥幸逃过了战争最严峻的阶段，但仍有成千上万的人被送上了前线，永远回不来了。更重要的是，自1920年失败的伊德尔-乌拉尔国以来，他们第一次尝到了真正自由的滋味。一旦拥有了自由，他们就再也不想放弃。当西俄罗斯革命阵线前来要求宗主国地位时，鞑靼人接受，并换来高度自治和俄罗斯法律的豁免权。他们与阵线的关系虽然紧张，但仍能和平共处，直到西俄罗斯战争爆发，俄罗斯人试图把红军的征兵范围扩大到鞑靼人。又一次强迫鞑靼人在俄罗斯人的战争中流血的想法让很多人难以承受，其中就包括阿利什。\n\n鞑靼人拿起武器，为他们长期被剥夺的自由而战。国民诗人阿利什也成为了当时的战争英雄，声名鹊起，并以战场上和言语上的英勇闻名于世。当彼得·加夫里洛夫率领的苏维埃军队让步并向北撤退的那一刻，人们对阿利什大加赞扬，并提议选举他为喀山市长。作为地位最高的文职官员，他实际上是鞑靼斯坦的第一任总统，同时他签字批准了鞑靼宪法。阿利什帮助祖国赢得了自由，他将为保卫祖国而艰苦奋斗。"
 VOL_Vasily_Ivanov: "瓦西里·伊万诺夫"
 POLITICS_VASILY_IVANOV_DESC: "瓦西里·尼古拉耶维奇·伊万诺夫于20世纪20年代被征召入伍前，曾是一名出身卑微的农村鞋匠。接下来的几年里，他加入了军官学院，并在军中逐渐晋升，在德国入侵时，他是一名上校。他和他的部队在命运多舛的莫斯科保卫战中战斗，但在莫扎伊斯克防线崩溃、德军大举攻入时，他们还能得以相对有序地撤退。与许多其他老兵背道而驰，他们向北撤退，与叶戈罗夫元帅的部队会合。伊万诺夫被晋升为新生的西俄罗斯革命阵线的将军，成为领导进攻德国的指挥官之一。\n\n然而，这种势头没能持续下去。背叛和权力斗争蚀空了阵线，德国人和伪军很快就扭转了局势。伊万诺夫已经解放并占领了他的家乡沃洛格达，这时他做出一个艰难的决定，他放弃了他的事业，他的军队从阵线中脱离并宣布中立。对他来说，继续在迅速瓦解的阵线中行事只会给这个已经发生了很多事情的地区带来更多的流血。\n\n这一举动为伊万诺夫赢得了沃洛格达人民的赞扬。人们认为他既是让他们城市摆脱纳粹暴政的解放者，又是把其他军阀带来的混乱挡在海湾之外的防波堤。阵线和莫斯科专员辖区勉强接受了他的立场，它们都认识到在双方中间存在一个缓冲国的好处。然而，尽管近年来这种武装中立的政策一直成功地威慑着他人，但其他军阀揭穿伊万诺夫并开始试探他的军队只是个时间问题了。"
 VYT_Vladimir_III: "弗拉基米尔三世"
 POLITICS_TSAR_VLADIMIR_DESC: "1917年，弗拉基米尔·基里洛维奇·罗曼诺夫大公出生于流亡途中，在1938年其父基里尔·弗拉基米罗维奇大公——也就是已故沙皇尼古拉二世的堂弟逝世后，他接过了俄罗斯帝国皇族首领的位子。\n\n第二次世界大战爆发时，弗拉基米尔正住在布列塔尼，很快，德国人就拘留了他们一家。在德国当局的“坚持”下，他很快就开始了协作，进行无线电广播，鼓励俄罗斯人从苏联政权叛逃。战争结束后，德国人想让他担任乌克兰的摄政，但他拒绝了，理由是这会分裂俄罗斯，他不能接受。\n\n大战结束了，但弗拉基米尔仍无法回到俄罗斯——德国人担心他会像弗拉索夫那样，过于受到俄罗斯人的拥护而最终会威胁到自身的统治。直到西俄罗斯战争爆发，他才成功说服德国人允他归去。接着他召集了一批君主派和流亡白军军官组成的部队，发动了一场异常成功的反攻。当德国国防军的攻势逐渐停歇的时候，弗拉基米尔却在继续推进，并突破了防线，在俄罗斯建立起一小片君主派统治的地方。\n\n此后的几年里，新上任的沙皇弗拉基米尔三世努力扩大国土，但却收效甚微，此外国内也冒出来许多令人头疼的内部问题。现在，沙皇在等待，等时机一到，他就要大胆出击，光复全俄罗斯，追回自己神圣的天赋继承权。"
 DRL_Oskar_Dirlewanger: "奥斯卡·迪勒万格"
 POLITICS_OSKAR_DIRLEWANGER_DESC: "匪帮之王，奥斯卡·迪勒万格。这个名字在南俄臭名远扬，人们闻之惶然色变，亦想将其碎尸万段。其手下烧杀劫掠，奸淫偷盗，无恶不作，恐吓着全体南乌拉尔人民。\n\n投机取巧，左右逢源，这是迪勒万格的人生哲学。1934年时，他因强奸幼女而入狱，后来通过打点政治关系，他避免了一系列对他的审判，因此逃过一劫。1939年时，他志愿加入武装党卫军。在那里，其喋血又堕落的性格受到上级赏识，被认为是高效的领导能力，这使他平步青云，被提拔为所谓“迪勒万格旅”的首任指挥官。\n\n东线战争期间，这只党卫军下属部队在战场上犯下的罪行罄竹难书。烧、杀、抢、掠，在俄罗斯和波兰的土地上肆意妄为。在西俄战争中，这些暴行一次又一次地上演着。这充分证明，随时间推移，迪勒万格的残暴有增无减。\n\n然而，在希姆莱领导的党卫军政变失败后，迪勒万格的生活天翻地覆。一支国防军部队收到命令，要求解除迪勒万格旅武装，并将全体官兵拘禁起来。迪勒万格下令向这支国防军部队开火，并率领队伍遁入俄罗斯的寒冬之中。最终，他们在南乌拉尔开辟了一块根据地，在那里他们继续热忱于掠夺和杀戮。\n\n因此，迪勒万格和他的旅效率极高。但是，迪勒万格厌倦了洗劫摧残无名小村，他开始将目光投向南乌拉尔的地区珍宝：奥伦堡城、黑山及其设备设施。他将把那里摧毁殆尽，烧成白地。\n\n当然，值钱的东西还是必须要取走的。"
 MGN_Trofim_Lysenko: "特罗菲姆·李森科"
 POLITICS_TROFIM_LYSENKO_DESC: "特罗菲姆·李森科，昔日被苏联赞颂为社会主义科学的天之骄子。终于出了个心怀谦卑的无产阶级科学家，他摒弃了资产阶级反动机构的所谓“教育”，证实了马克思主义不但适用于人类社会，更适用于大地母亲的馈赠！他的理论会在农业掀起一阵轰轰烈烈的革命，把苏联变成一个全球性的农业强国！达尔文主义已经过去，未来属于李森科主义！\n\n至少，他自己是这么承诺的。\n\n虽说他的成果极其不尽如人意，但正在逼近的战争让他免于面对严重的后果。NKVD第22摩托化步兵师在苏联前线崩溃时把李森科及其他支持他的科学家转移到了东方，以避免他的“关键研究”落入法西斯的魔掌。当苏联彻底崩溃之时，李森科发现自己失去了赞助者，而NKVD也发现自己没有了上级，于是，一个联盟就在二者的集团间诞生了。李森科说服了NKVD的长官，即使苏联已经不再是一个统一存在的国家，但是他的研究能否维持下去对于苏联依然意义重大，因此他必须找到新的研究设施。在为西俄罗斯革命阵线工作了一段时间（当然最后离开了）之后，他们在废弃的工业城市马格尼托格尔斯克找到了一处避难所。昔日被废弃的黑山如今成为了研究与科学创新的中心。\n\n然而，李森科从未抛弃自己的伪拉马克主义进化论，并依旧在倾注时间与资源试图证明其正确性。既然联盟陷入了如此严峻的困境，若能证明他的理论同样适用于人类，军事价值不可估量……"
 ORE_Workers_Council_of_Orenburg: "奥伦堡工人委员会"
 POLITICS_WORKERS_COUNCIL_ORENBURG_DESC: "奥伦堡工人委员会既是把不同社群粘合起来的胶粘剂，也是导致他们彼此离心的磁铁石。在俄罗斯崩溃后的烈焰与血雨中，自给自足的村落联合起来组成一个松散的互助联盟，这便是“工人委员会”的发端。苏联的专制社会主义，于此让位给无政府共产主义的教义，这便是奥伦堡，她的城市本身是这一“准国家”政治、文化与经济的中心，也是组织委员会会议的核心场所。\n\n奥伦堡委员会从外表上看似乎寓意着乌托邦式的社会主义理想，简直是社会主义理论在人类历史中繁衍百年后的巅峰，但稍一检视，工人委员会腐朽的根基在众人面前可谓一览无遗。\n\n人们对未来缺乏把握，而任何决议的通过都需要获得近乎“集体一致”的投票，奥伦堡工人委员会要做点什么已是难上加难。更糟糕的是，委员会内部充斥着腐败与分离主义情绪，眼看就要完全摧毁村社间那点游丝般的团结了。为此，尽管公社正在对结构进行初步的改革，但奥伦堡仍然缺乏一种有效的行政结构约束，这种优柔寡断如果持续下去，那宣判她死刑的日子就快要到了。"
 URL_Janis_Mendriks: "亚尼斯·门德里克斯"
 POLITICS_JANIS_MENDRIKS_DESC: "亚尼斯·门德里克斯曾是拉脱维亚的神父，数年前，因其布道活动被苏联送进了沃尔库塔劳改营。苏联崩溃后，沃尔库塔劳改营随之爆发骚乱，若不是这位神父的干预，那这场冲突恐怕会非常血腥。同情劳改犯的守卫和囚犯们团结起来，由此发展为后来的乌拉尔联盟。\n\n在意识到沃尔库塔的环境过于严酷后，门德里克斯说服了他的同道们，只有南下才能获得拯救。但他们“出埃及”般的旅途也付出了很多牺牲，数百名原先的囚犯与守卫在途中逝去。但门德里克斯神父似乎从未放弃他的信仰，并在每天的路途开始前召集人们进行激励演说。在那一片漆黑的时日里，他的话语是大家唯一可以依靠的光芒，也许正是信仰引导他们走到了最后，并定居于南乌拉尔。在这片与世隔绝的土地上，这位老神父重新拾起以往在拉脱维亚时的演讲才能。尽管他是天主教徒而其追随者大多是东正教徒，但教派的差异似乎无关紧要了，因为他的话有能让人们变得坚强的力量，重新燃起人们对新生活的希望。\n\n正是他的魅力与决断带领着乌拉尔联盟不断前进。他的和解性领导方针非常有效，使得联盟的很多指挥官在需要时都向他寻求指导与慰藉。哪怕在最严峻的时刻，他的决心也少有落空，总是能做到言出必行。毫无疑问，亚尼斯·门德里克斯是天主的使徒，而在这可怕的时代，他也成功地向所有人证明了他也能成为一名杰出的战士。"
 FAV_Yevdokia_Bocharova: "叶夫多基娅·博恰洛娃"
 POLITICS_YEVDOKIA_BOCHAROVA_DESC: "叶夫多基娅·达维多夫娜·博恰洛娃一直追寻着在内战中因支持红军而牺牲的父母的足迹。十八岁时，她考入一所航空学校，成为了一名飞行员与教官。后来德军大举入侵，苏联成立了三个全部由女性组成的轰炸机团：第586、第587航空团和第588夜间轰炸机团。博恰洛娃此时已是老练的飞行员，凭借着十年飞行经验被选为第588团的队长。当时航空团的作战条件极其恶劣：她们只能使用老旧的双翼轰炸机，在夜间为了隐蔽她们只能关闭引擎并在没有引导的情况下投弹。尽管有诸多条件限制，航空团依然成功地执行了一次又一次任务，惊恐的德军给她们取了个外号，叫“暗夜女巫”。\n\n苏联的空军指挥系统在莫斯科混乱无序的疏散中崩溃，博恰洛娃却将第588团和其他航空队召集了起来。在一番有条不紊的撤退之后，她将松散的空军重新安置在了一个西伯利亚城市——苏尔古特的临时跑道上。在接下来的几年里，一个自称“自由飞行员”的组织利用阿尔汉格尔斯克的苏联工业残余、回收残骸甚至家庭作坊重新振作起来，资深飞行员训练出一批批新的飞行员。自由飞行员组织在西俄战争中发挥了巨大的作用，并在战争结束时保留了大部分作战力量。时至今日，博恰洛娃依旧组织着飞行员出击来阻止纳粹空军的轰炸袭击。"
 OMS_Dmitry_Karbyshev: "德米特里·卡尔贝舍夫"
 POLITICS_DMITRY_KARBYSHEV_DESC: "德米特里·米哈伊洛维奇·卡尔贝舍夫的往事充满了悲剧，其中只有背叛、失败和愤怒。他在一战中为沙皇而战，在内战中加入赤卫队，在祖国受侵略时又重上战场。卡尔贝舍夫被德军俘虏，在许多集中营中辗转，德军对他严刑拷打、残忍虐待、任由他自生自灭，他却从未放弃对自己人民的希望。最终，他和其他几人一同逃出生天，亡命东方，越过形同虚设的苏联边关，投靠至拉扎尔·卡冈诺维奇的西西伯利亚人民共和国麾下。\n\n苦涩的岁月使卡尔贝舍夫痛苦不堪，他决心不再让俄罗斯遭受此等苦难。他开始筹划他口中的§R大审判§!，那是即将到来的、与德国的最终决战，将要一举决定俄罗斯的命运。他召集众多志同道合之士参与他的事业，并很快对卡冈诺维奇掀起反旗，攻占鄂木斯克，将这座城市武装到牙齿，以便在此安心备战。卡尔贝舍夫宣布成立全俄罗斯黑色联盟，在他的心目中，这个组织将成为俄罗斯前进道路上唯一的指引者。\n\n但时光荏苒，他曾经忠诚的部下间的猜疑与日俱增。现在，他只能眼睁睁地看着空中秃鹫盘旋，流下热泪，他希望拯救的俄国人民正在手足相残而没有奋勇杀敌。§R大审判§!近了，德米特里·卡尔贝舍夫担心除非有贤能之才继承其衣钵，俄罗斯会在这一刻到来时走向终焉。"
 SVR_Konstantin_Rokossovsky: "康斯坦丁·罗科索夫斯基"
 POLITICS_KONSTANTIN_ROKOSSOVSKY_DESC: "与许多人不同，无论发生了什么，时至今日康斯坦丁·康斯坦丁诺维奇·罗科索夫斯基仍保留了他对苏维埃祖国的忠诚。出生于沙皇时代的一个波兰上流社会家庭，他的童年却过着非常穷困的生活。这使得他顺理成章地加入布尔什维克党，他是一名高贵的绅士与军事履历完美的军官，没过多久，他就凭借此成为了苏联最著名也是最优秀的指挥官之一。经过军中二十年的服役，当纸牌屋即将倒塌，苏联即将崩溃之时，罗科索夫斯基不得不适应全新的环境。他的第3集团军被德国人所击退并到达乌拉尔时，拉扎尔·卡冈诺维奇热烈地欢迎他的到来，于是他加入了西西伯利亚人民共和国。\n\n但是，卡冈诺维奇和他手下军官之间的同盟充满了不信任与激烈的竞争，同盟非常脆弱，并且即将分崩离析。尽管西西伯利亚不惧一切困难、为生存而战，但当德国人继续进行无情的轰炸，领导人和将军们之间的裂痕只增不减，终于到了无可挽回的地步。当看到卡尔贝舍夫侵占了鄂木斯克而卡冈诺维奇却无所作为，人民共和国就像一条正在沉没的船，罗科索夫斯基迅速在斯维尔德洛夫斯克市召集了他的第3集团军，并以他领导的强大武力为后盾建立了一个临时军政府。虽然他对他以前在秋明的党内上级感到失望，罗科索夫斯基仍然没有放弃他关于重建苏联的事业，这一事业将由其忠诚和公正的军队所推动，在俄罗斯和苏联的战争艺术中诞生并受指导，在官僚之上为劳动人民服务。罗科索夫斯基年事已高，却仍然不辞辛劳地服务，他的健康受到严重损害，但在这绝望的时刻，他的决心依然坚定。即使他也许再也见不到红军在红场上迈进的场景，他也可以不失尊严地依靠老朋友与同志继续他未竟的事业。"
 TYM_Lazar_Kaganovich: "拉扎尔·卡冈诺维奇"
 POLITICS_LAZAR_KAGANOVICH_DESC: "很多人都认为，就算是在布哈林的苏联崩溃时，他的政敌也不可能在俄罗斯取得巨大权力、跻身最有权势的领导人之列。然而，拉扎尔·莫伊谢耶维奇·卡冈诺维奇证明了那些人的错误。作为约瑟夫·斯大林的狂热支持者，卡冈诺维奇曾因反对布哈林的政策，而被调遣到西西伯利亚部，担任一个平常看来无关紧要的职务。然而，日后这也使他远离战争前线，从而能够积累权力并发展为西俄战争之前俄罗斯境内最大的国家之一。\n\n在陆军元帅康斯坦丁·罗科索夫斯基和中将德米特里·卡尔贝舍夫以及第3和第10集团军的支持下，卡冈诺维奇建立了西西伯利亚人民共和国，其领土范围从乌拉尔山脉一直延伸到鄂木斯克。但不幸的是，这个共和国注定命不久矣。德国空军的不间断轰炸和两位前盟友的疏远最终导致了这个政权的崩溃。罗科索夫斯基的军队从西方，卡尔贝舍夫的黑色联盟从东方撕裂了这个从苏联废墟中诞生的短命国家，卡冈诺维奇只得撤往秋明城，统率西西伯利亚的残部。\n\n现在，在这个动荡的时代，卡冈诺维奇只能领导一个残存国家，一个战间期俄罗斯的遗留产物。虽然面临领地内外敌人的威胁，但他的革命派必将牢不可破。身为一位强硬的老布尔什维克，卡冈诺维奇绝不会手软，他必将消灭国家的敌人，并且会像伟大导师列宁与他最伟大的门徒斯大林同志在十月革命的荣光时刻所设想的一般，让统一的无产阶级国家成为现实。"
 VOR_Vasily_Blokhin: "瓦西里·布洛欣"
 POLITICS_VASILY_BLOKHIN_DESC: "有些人有严格的道德准则，但是瓦西里·米哈伊洛维奇·布洛欣早就把它们抛之脑后，成为了内务人民委员会，即NKVD的首席行刑官。作为一名契卡，他“干脏活”的效率不容忽视，也正是因此他节节高升。布洛欣的残暴无与伦比：他亲自监督了对“国家敌人”的大规模处决，从最无足轻重的小人物到苏联历史上最著名的布尔什维克。在他的注视下，成千上万的人死去，但他却能设法避免自己受到任何清洗活动的影响。\n\n二战结束，苏联耻辱地战败，布洛欣不愿让自己的权力如此轻易地消散。作为大型古拉格（劳改营管理总局）系统沃尔库塔劳改营的主管，他继续行使自己的职权，最初是作为西俄罗斯革命阵线权威的代言人。事实上，他为所欲为，没有人能阻止他，因为他们要么被处死，要么神秘地消失。然而，随着古拉格囚犯开始反抗他们的守卫，情况发生了变化：反对者团体乌拉尔联盟的形成，置他于危险之中。但很快，他们向南逃亡，布洛欣再次成为至高无上的统治者。\n\n瓦西里·布洛欣被留下管理沃尔库塔的古拉格，现在则独自管理这座城市本身，尤其是西俄罗斯革命阵线在著名的西俄罗斯战争中崩溃之后。在少数留下来的守卫的帮助下，他重组了这个地区，并成功建立起属于他的军阀国家。然而，布洛欣并不是个有野心的人：他想要的只是他封地的独立与生存，不管要付出多大的代价。"
 YGR_Jaba_Ioseliani: "贾巴·约谢利亚尼"
 POLITICS_JABA_IOSELIANI_DESC: "在布哈林统治时期，科米苏维埃社会主义自治共和国的土地上遍布古拉格系统的劳改营，在那里，为了国家的利益，政治异见者、罪犯和苏联的其他“不受欢迎的人”被迫接受严酷的劳动计划。即使在苏联崩溃后，西俄罗斯革命阵线仍在继续这种做法，将一车车的囚犯送往集中营，并通过沃尔库塔的红海军基地密切监视他们。贾巴·康斯坦丁诺维奇·约谢利阿尼就是被送进这系统的一个人。约谢利阿尼是格鲁吉亚一所大学的辍学生，他发现抢劫银行比搞学术来钱更快。军事法庭迅速认定他有罪，并把他扔进开往沃尔库塔的第一艘船上。他加入了律贼，即掌管着许多古拉格罪犯网络的所谓“服从‘律例’的盗贼”，并开始接受可能会持续几十年的繁重劳动。\n\n但幸运的是，几周后苏联崩溃，沃尔库塔失去了补给线。囚犯们分成两拨：一拨想和守卫一起工作以求得生存，另一拨则拒绝打破盗贼律例，不想成为“素卡”。经过几次短暂而血腥的冲突后，叛徒们逃到了乌拉尔，约谢利阿尼帮助组织了一场大规模的罪犯出逃，进一步深入内陆，远离了沃尔库塔躁动的狱卒，这极大地提高了他的地位，让他在代表他们阵营的律贼领袖圈子里占据了一席之地。西边的西俄罗斯革命阵线一度崛起，而西边的敌人又在衰落，约谢利阿尼的影响力也越来越大，接着他被选为组织的主席。他还与德拉贡诺夫和兹拉托乌斯特的军火商达成了几项相当有利可图的协议，内容是他将作为缓冲，同西俄罗斯残余势力战斗，以换取他们的武器装备。但在监狱等级制度内部，有人认为约谢利阿尼的协议是对律贼律例的背叛，而人们在窃窃私语，说他看起来缺乏征服野心，说他自满了，懒情了……"
 ZLT_Yevgeny_Dragunov: "叶夫根尼·德拉贡诺夫"
 POLITICS_YEVGENY_DRAGUNOV_DESC: "叶夫根尼·费奥多罗维奇·德拉贡诺夫的血管里流动着的，是众位俄罗斯枪械制造师的血！他从小就从事这一家族事业，并且很快就以一名高级枪械制造师的身份参加红军报效祖国。他被幸运地安置在西伯利亚城市兹拉托乌斯特，远离了前线的屠杀。德拉贡诺夫的命运不会就此终结，当苏联崩溃的时候，他成为了这个城市事实上的市长。他扩大了武器制造业的规模以至于它成为了城市的主要出口产业，在之后数年来俄罗斯人血腥的自相残杀中获取巨大的利益。德拉贡诺夫的好运气甚至更进一步，因为备受尊敬的工程师米哈伊尔·卡拉什尼科夫来到了这个城市。他们两人建立起了紧密的友谊，他们的技术的结合相当有利可图，并设计出了俄罗斯人前所未见的强大武器。\n\n不像其他后苏联时代的俄罗斯军阀，德拉贡诺夫没有任何重建苏联或者消灭日耳曼尼亚的妄想。当然，他不会介意这些事真的发生，但是他更加看重的是利润。有赖于武器贸易，兹拉托乌斯特已经成为了混乱之海中一个繁荣而稳定的净土，他希望繁荣与稳定能持续下去。他几乎会向所有人出售武器，而且他渴望找到更多买家。并且在接下来的岁月里，他期待他的生意更加积极蓬勃地发展……"
 ALT_Ivan_Zavoloko: "伊万·扎沃洛科"
 POLITICS_IVAN_ZAVOLOKO_DESC: "长期以来，伊万·尼基弗罗维奇·扎沃洛科的人民一直被嘲笑为沉湎于被早已抛弃的过去的乡下土包子。“裂教者”——这便是对这些旧信徒惯常的蔑称。这个称呼激怒了旧礼仪派的信徒们，不管怎样他们只是认为继续保持先人的宗教信仰是应当的，这么做没有伤害到任何人。在里加时，扎沃洛科是一名俄罗斯古物的收藏家，他摸索着引导着他的社区，同时继续着自己对于过去的研究。当俄罗斯帝国衰落时，旧信徒们认为接下来也许一个新的崇拜的黄金时代即将开始。恰恰相反，苏联，以及后来的纳粹德国野蛮地压迫旧礼仪派社区。纳粹入侵以后，扎沃洛科跟着他的同类们开始了漫长的陆上流亡，逃离了这片埋葬着美好未来的废墟。\n\n在奥伊罗特，扎沃洛科与本地居民的第一次见面并不是一个好的开始。当地的阿尔泰居民一直以来就看不起外来者，尤其是他们还信仰着不儿罕教（白教），这种新兴宗教被沙皇和苏联视为一种威胁。而对于这群古老宗教的流亡者们，新兴宗教的教徒几乎不带一点同情。许多人认为，在这面饱受战争与盗匪蹂躏的土地上，与外来者分享有限的生存空间就是自杀。\n\n从如此的不幸开始，到现在成为这个具有双重宗教与民族传统的年轻国家的总统，扎沃洛科的崛起让该地区的许多军阀感到震惊。他对细微之处的耐心关注，他不分高低贵贱对每位公民的同情，使得他成为奥伊罗特两大族群共同追随的唯一领袖。然而，个人的努力无法为一个国家打下稳定的根基。扎沃洛科总统及其追随者必须成功地在更深层次上将旧礼仪派与不儿罕教教徒的命运联系起来，让这个年轻国家的美好未来生根发芽、免于夭折。"
 KEM_Rurik_II: "留里克二世"
 POLITICS_RURIK_II_DESC: "尼古拉·伊万诺维奇·克雷洛夫少将曾是红军军官，在塞瓦斯托波尔和斯大林格勒等战役中担任第62集团军的参谋长。但是，当伟大的卫国战争变成苏联的巨大失败时，克雷洛夫的身心都遭到了重大打击，不断撤退带来的压力使他的精神陷入了崩溃。但第62集团军并没有感受到他的痛苦，因为这支队伍其实早就土崩瓦解了。他和他的一小群军官成了光杆司令，加入了向东涌入乌拉尔的难民潮。最终，他们在中西伯利亚共和国联系到了上级。共和国指派克雷洛夫去解决西伯利亚黑军的无政府主义叛乱，结果却又是一次耻辱的失败，然后在克拉斯诺亚尔斯克，他又被其颇为倚重的属下之一安德烈耶夫将军背叛，被迫率军撤往克麦罗沃。在那里，他在恍惚中愈陷愈深。他喝着酒，抽着烟，试图麻醉心中的痛苦和罪恶感。\n\n不过在一天晚上，一切都突然改变了。他赤身裸体地将自己锁在房间里，只带着一盒香烟、三瓶伏特加和一本关于东正教神秘主义的书。走出房间时，他宣布他受到指示，将重新统一俄罗斯。是谁下的令呢？他拒绝透露。战友们为他的精神状态感到担忧，当克雷洛夫自我加冕为“留里克二世、全罗斯的皇帝和专制君主”时，这种担心加剧了。然而，士兵和雇佣军们被征服和荣誉的承诺所吸引，他们的支持淹没了军官们的担心。\n\n留里克鼓吹一种俄罗斯传统主义和苏式军国主义杂糅的思想。他声称自己是沙皇传统的继承者，却瞧不起罗曼诺夫家族；他颂扬“伟大者”弗拉基米尔的美德，但自己却是一位无神论者，并且像打发“江湖骗子和巫师”一样将神父们赶走。可以说，他斑驳的意识形态正是其支持者的一种代表——反动派、苏联老兵和求财的军人。军官团中有些人怀疑这位“留里克”的一系列手段都不过是为了争取农民支持而演出的一场戏；如果当真如此的话，那只能说他的演技实在是太好了。"
 KRS_Nikolai_Andreev: "尼古拉·安德烈耶夫"
 POLITICS_NIKOLAI_ANDREEV_DESC: "尼古拉·特罗菲莫维奇·安德烈耶夫于1905年出生。1935年，他被从预备役中征召，重新加入红军，并成为了西伯利亚的一名政委。最开始他还怀抱与德国人作战的希望，但却进入了军官学校。但随着战争局势变得越来越令人绝望，他却在不断学习越来越多的课程——不是为了磨练技能，而是想拖延时间，避免被派到一场他认为注定失败的事业去。苏联崩溃后，他和军官毕业生同学们结成一个小集团，开始在克拉斯诺亚尔斯克地区巩固权力。当中西伯利亚共和国成立时，共和国政府担心这类事先产生的团体会威胁到其民主制度，于是安德烈耶夫的集团被解散，他们被打散发配到共和国领土的各个偏远角落。安德烈耶夫被安排在尼古拉·克雷洛夫的指挥下，但他仍秘密地与他的同道们保持联系。\n\n随着共和国开始失去对权力的控制，开始分崩离析时，安德烈耶夫集团在克拉斯诺亚尔斯克再次集结，并在克雷洛夫将军向西伯利亚黑军发起那注定失败的攻势时发动了兵变。为了让这座城市的人们相信他们不只是改头换面的军政府，安德烈耶夫和他的军官们许诺了将进行全新的全面的改革：自由贸易！私有财产！外国援助！公开选举！自由！民主！\n\n随着先前秩序的崩溃，安德烈耶夫集团认为统一西伯利亚的重任落在了他们的肩上。要实现统一，向东边大海的冲刺必不可少，并随之获得外国的承认，然后再巩固和准备推动解放整个俄罗斯。但是，安德烈耶夫是否真的能够实现这些承诺，那就是另外一回事了。"
 NOV_Alexander_Pokryshkin: "亚历山大·波克雷什金"
 POLITICS_ALEXANDER_POKRYSHKIN_DESC: "二战中的传奇飞行员与苏联英雄，亚历山大·伊万诺维奇·波克雷什金，于战争结束后回到了他的家乡新西伯利亚。他只希望能过上平静的生活，却不知命运会把他带往何方。\n\n波克雷什金对中西伯利亚共和国的统治十分满意，并最终在政府里谋得一职。管理共和国下的新西伯利亚市不算什么难事，直到那天，西伯利亚战争到来了。面对东方强大的亚戈达最高苏维埃，很快，他被迫令全城进入战争状态。定量配给出现了，征兵急剧增多了，新西伯利亚的后生们被送上西伯利亚前线战场，然后死去。终于，波克雷什金变得忍无可忍。在与巴尔瑙尔市长瓦西里·舒克申达成幕后交易后，开始了计划的实施。\n\n两人和他们的部下迅速控制了新西伯利亚，组建起新政府——一个不受任何影响，真正独立于俄罗斯的混乱的政府。现在，波克雷什金通过与巴尔瑙尔的不稳定联盟实现了统治，他需要确保国家保持的稳定。尽管新西伯利亚有着大量的人口、工业和功能性农业，但也有着挥之不去的内部与外部问题。谁来解决它们呢？任务就落在了波克雷什金身上。"
 NRL_No_Authority: "无政府"
 POLITICS_NO_AUTHORITY_SIBERIA_DESC: "苏联崩溃后，西伯利亚最北部孤悬尘世的边陲地带没有出现新的权力继承者或分裂政权。由于缺乏中央集权的官僚机构、基础设施、工业、大规模贸易或长途通讯来维系这片广袤的土地，当地的村庄基本上回归到了几个世纪前的生活方式：靠着农业、狩猎和畜牧自给自足。当地的雅库特人、鄂温人和楚科奇人得以在不受干涉的情况下恢复萨满教信仰，而信仰正教的俄罗斯村民也不会来找他们的麻烦。通常人们能走到最远的地方就是另一个村庄，居民们可能要等很多年才能打听到外部世界的一点消息。\n\n尽管这片土地可能贮藏着丰富的资源，但安居西部或南部宜人地域的军阀们却并不觉得有征服此地的必要。广阔的面积、落后的基础设施和酷寒的冬日足以阻止任何稍有常识的独裁者对此种愚行加以尝试。把这里放着不管似乎也没什么风险——大多数村庄中能称得上作战力量的，也不过就是几个拿着老式猎枪的老头。看来，除非西伯利亚人民能够以某种方式团结起来，或者被一方成功继承俄罗斯遗产的势力所征服，否则他们将继续维持一贯的生活：孤立无援，生活在世界的边缘。"
 PRC_Aleksandr_Vasilevsky: "亚历山大·华西列夫斯基"
 POLITICS_ALEKSANDER_VASILEVSKY_DESC: "亚历山大·米哈伊洛维奇·华西列夫斯基，出身自一位俄国东正教神父之家。他早年间出乎意料地没有继承父业，而是选择了去当兵打仗，还在沙俄军队中一路升官晋衔。十月革命爆发后，他辞去原职，转入后方部队并在那里度过了整场内战。华西列夫斯基的组织才干在战间期表现得淋漓尽致，其间还结交了诸如亚历山大·叶戈罗夫、米哈伊尔·图哈切夫斯基和格奥尔基·朱可夫这样名声显赫的同僚。当德军入侵时，华西列夫斯基正在布哈林治下的总参任职；凭借着坚毅的个性，他得以脱颖而出，步步高升。但即便有才如斯，他仍旧无法阻止莫斯科城下的撤离行动化作一团数百万官、兵、民相互争涌，混乱不堪的人潮。\n\n华西列夫斯基决意要尽力保存红军的有生力量，遂率领从莫扎伊斯克防线撤下的残部大体有序地向东退却，直翻过乌拉尔山脉。他本以为能够在蒙古人民共和国站住脚，获得喘息机会以待日后反攻；但日本侵略者和蒙疆傀儡政权却早已占领了乌兰巴托、并将蒙古人民军逼进荒原深处，将这一线希望彻底踏灭。于是，华西列夫斯基与蒙古军队结下难称牢靠的联合关系，暂据着前图瓦人民共和国的疆域。这股势力独立世外，西部战争、西伯利亚战争乃至西西伯利亚人民共和国的灭亡都过于遥远；他们对伊尔库茨克的亚戈达政权同样避之不及，只因害怕曾经的撤退被指为叛徒行径从而招来杀身之祸。无论如何，即便当下孤掌难鸣，华西列夫斯基仍不轻言放弃：他势要举兵筹策，待有朝一日光复故国。"
 SBA_Siberian_Soviet: "西伯利亚苏维埃"
 POLITICS_SIBERIAN_SOVIET_DESC: "苏维埃联盟崩溃之后，安加拉河流域居民的生活从莫斯科的统治中脱离出来。他们所做的第一件事情，就是以真正的社会主义方式，组建了一个委员会。许多地方部门机构在脱离莫斯科监管的情况下仍然维持着运作，而大批需要从苏联其他地区进口的货物，则在配给制度及推行节衣缩食的运动下得以放弃，或者被当地生产的产品所替代。当地人与西俄地区残余的苏联政府失去了联系，又不愿接受中西伯利亚共和国“民主”的临时政府，以及亨里希·亚戈达之流残暴专横的政权，于是他们组建起地方民兵组织，决意用鲜血来捍卫他们的自由。也正因如此，许多原来被排斥的无政府主义思想家从苏联最偏僻遥远的地区涌来，在他们的影响下，人们宣布独立，并成立了西伯利亚无政府苏维埃，一个当地所有主要城镇及工业工会都在其中拥有平等代表权利的自治管理机构。\n\n无政府苏维埃在外部威胁中逐渐站稳脚跟之后，一支在伊雅河岸自由公社活动的武装力量——西伯利亚黑军，在苏维埃内部占据了主导地位，并对外宣称他们将以军事无政府主义作为纲要。对于在这片自由地区上生活的男男女女来说，民兵兵役已经成为了他们生活中重要的一部分，集结起来的公社武装部队不仅是保卫公社的自卫工具，而且也是对周边地区传播其解放思想的手段。\n\n在无政府主义社会中逐渐蔓延的军事化思想，看似同无政府主义的理想相互矛盾，不过出乎意料地没有立即引起苏维埃和军队之间的紧张关系。但许多平民忌惮他们的自由将最终被西伯利亚公社独立的保护者——黑军的野心所吞噬。"
 TOM_Boris_Pasternak: "鲍里斯·帕斯捷尔纳克"
 POLITICS_BORIS_PASTERNAK_DESC: "鲍里斯·列昂尼多维奇·帕斯捷尔纳克并非职业政客，而是一名诗人和学者。作为一名有着犹太血统的莫斯科人，他在苏联时代就凭借他的诗集和翻译的英、德文经典作品而迅速成名。然而，他早年对列宁的仰慕很快就消失了，因为他总是在努力地把朋友和同事们从内务人民委员会的黑名单上划去，或是把他们从政治犯监狱里捞出来。尽管官方对帕斯捷尔纳克的评价下降了许多，但他从未遭到谴责或迫害，因为政治局和内务人民委员会的许多人都认为他太消极，不切实际，且毫无政治威胁。随着德军向莫斯科进军，帕斯捷尔纳克和残存的苏联知识分子逃往东方，许多人在托木斯克市落脚避难。他们在那里决定起草一部受俄罗斯不朽的民主思想启迪的自由主义宪法，承诺恢复苏联治下他们渴盼的言论自由，中西伯利亚共和国正是他们伟大事业的产物。事实证明，她正是江河日下的独裁政权远东苏维埃的死对头。不过，共和国的领导人无法应对将军们的野心，不久之后就在自身的矛盾中崩溃了。\n\n现在，帕斯捷尔纳克统治着这个由知识分子和艺术家们主持的思想家和诗人的国度。尽管他和同事们能做精彩的演讲，能起草引人入胜的法律，能撰写美妙的国歌，但他们以前唯一从事过的仅是大学的教职。他们能取得成功吗，还是说他们满足于安坐在象牙塔之中？帕斯捷尔纳克和他的梦想家之国将走向何方？一切尚未可知。"
 AMR_Konstantin_Rodzaevsky: "康斯坦丁·罗扎耶夫斯基"
 POLITICS_KONSTANTIN_RODZAEVSKY_DESC: "康斯坦丁·弗拉基米罗维奇·罗扎耶夫斯基一直是一个东方人。新生的苏维埃体制冉冉升起，而他自年轻之时就鄙视它，灼灼逼人的压迫促使他从苏联的布拉戈维申斯克（海兰泡）治下逃往哈尔滨的流亡者聚居区。在这里，他深信必须创建一种能与布尔什维克匹敌的体制；在法西斯刚刚诞生的欧洲，他找到了答案。内战失败的蚀心之痛，使得许多俄罗斯人接受了这种新生意识形态。年轻且极具感召力的罗扎耶夫斯基抓住这一良机，以万字旗将这些人统于麾下，用演讲点燃人们胸中欲念之火。他许诺总有一天必将重返家乡，解放受难的俄罗斯人民。\n\n俄罗斯法西斯党成立不久，与满洲新霸主，日本，建立了紧密的关系。这位法西斯党最大的恩主在其生存期间支持它，直到随着主席团的垮塌，再一次宣称俄罗斯的机会到来。\n\n依仗日本盟友的热情，俄罗斯法西斯党的首领为摧毁犹太-布尔什维主义发动了一场神圣十字军。然而，他完全解放的梦想被群集的对手所击碎：将军们和他们的沙皇，还有更糟的，米哈伊尔·马特科夫斯基和他那帮叛贼想要越过太平洋寻求援助。康斯坦丁·罗扎耶夫斯基只能单单作为一个军阀头子独自留在了结雅，他无比愤怒，发誓必将对所有俄罗斯之敌复仇，无论他们是谁：犹太人，赤匪，马特科夫斯基分子，伪沙皇拥戴者，这些胆敢挑战元首的恶徒。对他而言，这是重振俄罗斯昔日荣光的唯一方法，但这个梦想似乎愈发遥不可及。"
 BRY_Valery_Sablin: "瓦列里·萨布林"
 POLITICS_VALERY_SABLIN_DESC: "瓦列里·萨布林于1939年新年之际生于列宁格勒，在他的家人跟随苏维埃最高主席团的残部撤往东方时，他还只是一个孩子，就连他的父亲——一位海军军官，也已经冲向德国海军迎接自己毁灭的命运了。萨布林从未忘记父亲的牺牲，他从小便梦想着那个记忆中依稀可见的苏联，以及祖辈曾为之奋战的那场伟大革命。尽管对亚戈达的统治颇有微词，萨布林仍然主动参军担任了一名政委，这并非出于对亚戈达极权帝国的忠诚，而是出于某种天真的信念：也许在残存的几座军事院校的大厅深处，他能够找到问题的答案吧。这真的就是先烈们想要的结局吗？他所目见的一切，只不过是无穷无尽的失望。找到的寥寥几本书籍都已经过层层审查，而内务人民委员会则紧盯着自己的一举一动。\n\n当东方在中西伯利亚战争中陷入一片火海时，萨布林履行了自己的职责，激励他的部下们为了社会主义与平等而战——但每当士兵们向他寻求教导，他就愈发怀疑自己是否站在真理的那一边。最终，他的心防如溃堤般崩解。在几位忠诚士兵的陪同之下，萨布林突袭了一座广播塔，向生活在东部的全体前苏联同胞们广播了一条消息。他恳切地提到俄罗斯人民正面临许多困难，也说出他的梦想——建立一个真正平等的社会主义国家，让人民摆脱亚戈达的恐怖统治。他并不指望人们会听这些话，但确实地，许多人听到了他的声音：男人女人们蜂拥而至，加入他的行列，梦想家们，异见者们，青年们。现在，萨布林与他的革命者们正为未来而战，准备为他们的梦想做出至高的牺牲。"
 CHT_Mikhail_II: "米哈伊尔二世"
 POLITICS_TSAR_MIKHAIL_DESC: "米哈伊尔·安德烈耶维奇·罗曼诺夫世子于颠沛流离中出生在凡尔赛，成长于苏格兰，在伦敦接受教育，二战期间在澳大利亚为皇家海军服役。在纳粹德国战胜苏联之前，他以为仍有重返俄国大地的希望，但是战后莫斯科专员辖区的建立又让他的希望化为泡影。于是米哈伊尔世子决定隐姓埋名，在澳洲继续过普通人的生活，他成为了一名航空工程师。直到他受邀前去哈尔滨。\n\n这是一场与流亡白俄举行的晚宴，开始时波澜不惊，而在一场迅速的草原式战斗后，米哈伊尔就被谢苗诺夫阿塔曼为首的白俄将军掳走，来到了西伯利亚的赤塔市，并被加冕为米哈伊尔二世。他试图向将军们解释自己父母的婚姻属于贵庶通婚，因而无法成为皇位的继承人，但将军们却毫不在意，继续把他当做合法的傀儡沙皇。\n\n现在，沙皇见自己处于困境：他的东面是昔日的盟友与今日的仇敌——康斯坦丁·罗扎耶夫斯基的法西斯集团，北面是红军军阀，南面是日本的仆从国，而西面是后苏联时代的大独裁者。无需多言，他分到了一手“好牌”。\n\n但他仍然下定决心，要把这手牌打到最好——只要将军们真的能让他决断一切。"
 IRK_Genrikh_Yagoda: "亨里希·亚戈达"
 POLITICS_GENRIKH_YAGODA_DESC: "在前苏联时代，亨里希·格里戈里耶维奇·亚戈达这个名字家喻户晓，同时也令人闻风丧胆。作为内务人民委员会的领导者，亚戈达负责维护布哈林政权的稳定与安宁，在最初的权力斗争中取得地位的他自那时起就一直支持着布哈林。只要亚戈达一声令下，就算是最显赫的布尔什维克也难逃人间蒸发或是被以反革命罪处死的命运。\n\n接着，战争爆发，苏联的大片土地，乃至莫斯科都落入了德国的铁靴之下。在随后的混乱当中，亚戈达利用自己手中的权力将最高苏维埃主席团的大部撤往东方，尽可能地远离德国人。最终，他在西伯利亚的荒原深处建立了统治，并在那里执掌着后苏联时代最大的残存国家。\n\n然而，前最高苏维埃主席团建立的国家并没有长存下去。各路敌人和叛徒不断地在亚戈达的帝国内划出自己的地盘，让这个国家难以为继：从哈尔滨那帮可恶的反动派，到中西伯利亚的“民主派”和将军们，再到贝加尔湖对岸的修正主义叛徒。但是，尽管伊尔库茨克政府遭到严重的打击，它还是作为一个军阀国家幸存了下来。正统性让它从诸多军阀中脱颖而出——没有别的军阀有资格自称为旧政府的直接延续。在亚戈达的政权中，内务人民委员会负责保卫革命的最后堡垒，权力集中在一小撮布哈林派政客手中。亚戈达手上仅剩的牌只有这些，但这就足够了。"
 KMC_Ivan_Yumashev: "伊万·尤马舍夫"
 POLITICS_IVAN_YUMASHEV_DESC: "海军上将伊万·斯捷潘诺维奇·尤马舍夫曾在红海军服役了数十年，尽管现在他曾效力的那个国家已不复存在。从波罗的海到鄂霍茨克海，他曾经在那么多的海域上驰骋，但如今只能把大部分目光放在白令海上。整个卫国战争期间，他把精力全部投入在指挥太平洋舰队中，主要是在海上巡逻，偶尔会与日本船只发生小规模冲突。当驻扎在符拉迪沃斯托克时，他听到了苏联被击败的消息，于是他立马采取行动，在日本豺狼到达之前将舰队撤出了港。\n\n一切尘埃落定后，尤马舍夫上将和他的军官们向亚戈达政权宣誓效忠，获得了一份临时工作。接着随着反动派的推进，尤马舍夫的海军不得不离开阿穆尔河沿岸的要塞，寻找新的安身之所。堪察加彼得罗巴甫洛夫斯克这一城市已被苏联政府和大多数居民抛弃，除了几个村庄外，这里几乎没有什么基础设施。于是堪察加沿岸成为了红海军的指挥部，这个小渔村也被改建为一个临时的海军基地。\n\n在这远离文明之处，远东的红海军除了不停在军舰边上凿冰外，什么都做不了。只能眼睁睁地看着这个地区陷入混乱和内讧。由于没有任何获得补给和燃料的正常途径，船员们开始通过在太平洋上劫掠走私度日，他们成了日美间海上竞争中的额外干扰。可以说，尤马舍夫上将并不喜欢他的士兵沦为这种人——但可以肯定，他不会剥夺士兵们唯一可能在这地球边缘生存的方式。"
 MAG_Mikhail_Matkovsky: "米哈伊尔·马特科夫斯基"
 POLITICS_MIKHAIL_MATKOVSKY_DESC: "米哈伊尔·阿列克谢耶维奇·马特科夫斯基的俄国法西斯主义在很多方面都与罗扎耶夫斯基针锋相对。凡是罗扎耶夫斯基的教条之处，马特科夫斯基都采取实用态度；罗扎耶夫斯基大放厥词、播撒愤怒，马特科夫斯基就竭力寻求妥协，运用他的策略将政敌从对立面吸引到自己这边来；罗扎耶夫斯基赞扬黑衫军的反犹理念，马特科夫斯基就蔑视他们的暴力行径。曾有一段短暂的时光，两人志同道合，强强联合的结果便是俄罗斯法西斯党的崛起与巅峰，越来越多的俄国侨民寄希望于法西斯主义能够拯救祖国。\n\n接着，伟大的卫国战争爆发了。随着德国人发起铲除俄罗斯的战争，两人之间的裂缝也慢慢扩大。尽管希特勒决心彻底摧毁俄罗斯、消灭俄罗斯人民，但罗扎耶夫斯基依然试图乞灵于他的帮助，梦想着俄国从布尔什维克的统治当中解放出来。马特科夫斯基却没有这样的妄想，德国对苏联的战争就是对俄罗斯的战争，这背后是德国人对俄罗斯人民的种族仇恨。无论俄罗斯法西斯党如何卖力争取支持，纳粹绝不可能把建设一个独立的俄罗斯国家列入他们的计划之中。马特科夫斯基的派系认可了他的策略，然后沉寂下来等待时机，蛰伏的时间里，他们慢慢发展壮大。\n\n随着时机来临，他们将罗扎耶夫斯基的支持者从马加丹市逐出，控制了这座城市，并公开宣布从俄罗斯法西斯党分裂出去。在接管自己的领地之后，马特科夫斯基开始致力于将俄罗斯从废墟中拯救出来。方法就在日本重重封锁的大洋彼岸：美利坚合众国。然而，就算是马特科夫斯基这样的谈判高手也很难说服外国势力支持他们。不过，他不会让任何质疑阻碍他的行动。"
 OMO_No_Authority: "无政府"
 OMO_Alexander_Men: "亚历山大·缅"
 POLITICS_ALEXANDER_MEN_DESC: "亚历山大·弗拉基米罗维奇·缅从来没想过会成为如此多人的牧者，他的羊群们将生命托付予他，上天将沉甸甸的担子压在了肩膀上，但他确实做到了，他是北方的圣父。\n\n情况并非一开始就是如此。当缅还是个小犹太娃的时，他就接受了洗礼，缅的父亲在他六岁时就被从他身边带走，被NKVD以诬告的罪名押进了古拉格，这让这个小男孩与全世界的许多人感同身受，对恐惧和暴政燃起了强烈反感。在苏联，尽管地下教会存在危险，缅仍然成为了一名虔诚的基督徒，却是一名非正教的基督徒。缅坚定地相信超越阶级、性别、种族甚至信仰的平等，他的思想在教会甚至整个联盟中几乎无人知晓。\n\n在苏联灭亡后那段黑暗日子里，缅正身处寒冷的北方，安慰着苦苦挣扎的农民，给予他们上帝的爱——如果他们不接受上帝的爱，他就会用自己的话来表达。他告诉他们，他希望建立一个真正的人人自由的土地，一个平等互助的地方，一个能让所有人都能摆脱枷锁的公社和村庄。\n\n他的信仰和行动开始在与世隔绝的西伯利亚大地上获得支持。起初，支持增长得很缓慢，然后突然之间，北方与世隔绝的村庄都开始信任他们的圣父。\n\n今天，北境开始向这个长期以来腐蚀神圣祖国的混乱进军。他们必在圣父的注视下，使一切受苦之人得蒙拯救。"
 YAK_Georgy_Basharin: "格奥尔基·巴沙林"
 POLITICS_GEORGIY_BASHARIN_DESC: "格奥尔基·普罗科皮耶维奇·巴沙林被认为是在这个动荡年代的雅库特独立精神的代表人。他出生于一个贫苦农民大家庭，立志要在教育上取得成就。他曾在莫斯科学习历史和文学，后在俄罗斯和平的最后几年回到家乡。在对德战争和西伯利亚战争中，他都避免了应征入伍，而是参加了旨在为雅库特民族的自由而战的自由民族主义者运动。不久，最高苏维埃的军队被赶走了，而知识分子的圈子似乎实现了他们的梦想。\n\n崭新的民主政府继往开来，宣布建立一个新的雅库特共和国，并许诺进行宏伟的改革，为人民提供自由。然而，这个新生的国家刚成立不久，就遭到了现实的打击。丰富的钻石等自然资源虽被认为有助于国家的发展，但却成了对国家的诅咒。当地公司垄断了采矿业，用利润为自己的项目融资。他们在雅库特国内积累了权力，甚至形成了自己的“国中之国”。为了更方便地开展行动，他们还建立了独立的军队。国内犯罪猖獗，寡头们和黑帮组织同流合污，不受政府干预，自由运作。\n\n在这一切之中，格奥尔基·巴沙林仍然是一个诚实和公开的捍卫者，尽其所能地管理着共和政府。他虽然可能受到大多数人的尊敬，但是几乎没有什么办法来对抗禁锢他的寡头政治。目前，他所能寄望的，只是雅库特民族主义之火能持续燃烧下去。"
 PHI_Jose_Yulo: "何塞·尤洛"
 POLITICS_JOSE_YULO_DESC: "如同奉仕团的其他高层一样，何塞·尤洛·尤洛在自由邦政府和共和国政府内都任过职。自1935年起，这位顶尖的律师一直在法庭上为奎松总统和劳雷尔总统的立法议程辩护。在他看来，如此优异的历程已经使他人生圆满，因此他完全可以在1959年退休，回到企业律师的老本行去。\n\n然而，他的退休计划与整个共和国一起出了差错——1959年11月，劳雷尔总统去世，而叛军在月底向政府宣布全面开战。随着一座又一座城市陷落，战线越来越向马尼拉逼近，国民议会也完全陷入了僵局。在大东亚省与奉仕团主流派系“劳雷尔派”争执数周后，尤洛成为了双方妥协之下的候选人。当年平安夜，尤洛匆匆宣誓，就任第二共和国的第二任（临时）总统。\n\n虽然自从尤洛就任以来，叛军的攻势受到了阻碍，但他还远远不能宣布自己已经“完成了任务”。菲律宾大片地区仍处于叛军控制之下，共和国实际控制的领土也好不了多少。不过，应对叛军的事还是交给第14军处理吧——当下，尤洛需专注于废除先总统所实施的不太受欢迎的政策，直到他卸任为止。"
 UPH_Wendell_Fertig: "温德尔·费尔蒂希"
 POLITICS_WENDELL_FERTIG_DESC: "在职业上是工程师，在时局下是游击队，在民心中是领导者——温德尔·费尔蒂希已经决心接受自己作为命定英雄的角色，无论前路如何。\n\n费尔蒂希初来菲律宾时，还是一名美国陆军工程兵。他在二战中的主要工作就是炸毁桥梁，籍此迟滞日军的推进。但日本人的突破速度仍旧有增无减，将他的努力成果一扫而空，费尔蒂希也因此身陷敌后，不得不和他所在部队的残部以及一些菲律宾当地斗士撤入山中，继续着游击斗争。后来，美利坚祖国却为一纸《赤城协议》无情地抛弃了他们。此时，费尔蒂希则毫不动摇地宣布了自己为了一个自由的菲律宾共和国而斗争的决心。他是菲律宾第一个弃绝公民身份的美国人，也是第一个在莱特宣言上签字的美国人。\n\n然而，他那高贵的决心又何曾得到过丝毫的回报呢？费尔蒂希仍旧是游击队中一个常被忘记的顾问角色，卡洛斯·P·加西亚把他这个人才扔进了无人问津的角落里慢慢生锈。费尔蒂希愈发担忧，缺乏战略头脑的加西亚会使他和战友的一切牺牲全部白费。因此，他发动了一场政变，当上了游击队的最高领袖。现在，他正努力把菲律宾自由共和国打造成一把利刃，直直瞄准日本占领区的心脏。等到胜利之日来临时，他将功成身退，把领袖之位让给他人——毕竟，他不是一个独裁暴君，他只是一个在尽力修补菲律宾的工程师。\n\n但待他职责已尽之时，人们都会知道，是温德尔·费尔蒂希让自由之光照进了菲律宾。"
 SPH_Luis_Taruc: "路易斯·塔鲁克"
 POLITICS_LUIS_TARUC_DESC: "在稻田行军之后，许多问题困扰着菲律宾共产党的流亡党员。进攻哪里出了什么问题？问题是什么时候出现的？又出现在哪里呢？最重要的是，谁该对此负责？互相指责逐渐变成了尖锐的攻讦，最后演变为可能导致革命共和国分裂的严重决裂，一切都如苏联的弥留之际一样。\n\n在这一片混乱中，路易斯·曼加鲁斯·塔鲁克站了出来。他是菲共的武装力量——虎克军的领导者。党的军队撤退后，这位煽动者将军的话更加有分量了。他严厉地批评了当时的总书记何塞·巴尔塔萨·拉瓦，这让他在党内的声望愈来愈高。他指责说，如果不是拉瓦一次又一次地要求他的战士们克制，那些法西斯绝不可能迫使他们退守科迪勒拉。拉瓦的独断专行与过分谨慎让革命付出了不可忽视的代价，趁着机会还没完全消失，是时候纠正错误了。\n\n在猛烈而疯狂的掌声中，组织已经决定了：拉瓦必须下台，而塔鲁克将成为总书记。这位“阿里帕托将军”如今指挥着革命的一切，就像凯撒和教宗的二位一体。但有人仍会怀疑付出了这样多的努力能否足以让他们反败为胜，亦怀疑在追求胜利的过程中他是否会不小心抛弃某些革命信条。"
 MLY_Chin_Peng: "陈平"
 POLITICS_CHIN_PENG_DESC: "陈平，原名王文华，他的一生被神话和迷思所笼罩。现在，他就是昭南-马来军政部的头号公敌。陈平在马来亚中北部荒凉偏僻的山林草野中出没，逐渐成长为坚毅无情的战士。1957年，在马来奉公会的崩溃中，陈平挺身而出领导反日起义，带领马来亚抗日人民军四处征战，历经成功与失败，其中秘辛正如那句古话：疾风知劲草，烈火见真金。\n\n然而，对这个久经沙场的游击队员来说，光明似乎转瞬即逝。在1959到1961年的黑暗岁月里，人民军陷入极度困难、几近绝望，为了继续奋战求存，人民军不得不去袭击那些泰马边境的村庄和定居点——正是先前面临着日军血腥镇压、而人民军宣称要保护的那些人。沙漏仿佛马上就要流尽，此时，陈平却收到了来自国土军团内部起义者的电报。于是，1961年初，马来亚抗日统一战线在战火中成立。\n\n抵抗军迅速时来运转，统一战线成功保住位于马来半岛西海岸的重要港口，印度共和国（某些人称印度背后还有个更大的后台）的援助源源不断。由于送来援助的诸国皆是反日国家，陈平在这个问题上选择妥协，尽管他并非不知道非共产主义的反日武装力量正在增长。既未选择争权、也未选择解散统一战线，陈平只得收敛起他的政治野心：与相对温和的艾哈迈德·博厄斯塔曼结盟。博厄斯塔曼亦有野心，但二人之间暂时合作愉快，因为博厄斯塔曼需要人民军的力量，而人民军则要依赖博厄斯塔曼来获得公众的认可。"
 NRB_Baba_Masao: "马场正郎"
 POLITICS_BABA_MASAO_DESC: "英属婆罗洲在日本谋求亚洲霸权的计划中有着举足轻重的地位：一方面这座岛屿上的石油储备令日本寡头垂涎欲滴，另一方面婆罗洲正位于东亚和大洋洲贸易路线中间的战略要地。这一无可估量的价值促使日本军队横穿亚洲，直取南洋。日本军队在很短的时间内就成功占领了婆罗洲，前英国殖民地被重组为军管区，有一位意志坚定又富有决心的指挥官来管理这里的事务。而这个人正是马场正郎，他指挥着37军，这支军队被设想为婆罗洲的卫戍部队。\n\n作为出身军人家庭的马场正郎严格遵循着普鲁士式的军人纪律，他认为自己军旅生涯的辉煌正是印度尼西亚战役，这场战役为最终战胜美国人铺平了道路。随后他成为了婆罗洲的最高军政长官。这个职位是他用自己的荣誉挣来的，这一点他的仇敌或嫉妒者望尘莫及。作为一名称职的日本将领，马场正郎以铁腕手段控制着这里，他肆无忌惮地动用暴力手段来贯彻自己的意志，镇压胆敢反抗他的人。马场正郎坚信日本比其他任何国家都要优越，因而他坚持推动这一地区的同化政策，将此地变成日本寡头的游乐场，垄断巨头们都可以在从这里的丰富物产中分得一杯羹。\n\n随着战争推进，婆罗洲最终高度军事化，遍布壕沟和要塞，前英属保护领如今成为陆军从事海商活动的前哨站。37军严密守护着北婆罗洲与印度尼西亚的边境线，在马场领导下的这支军队成为大巽他群岛的增援部队，以及印尼合作政府的“支援性”力量，他们不应当有足够的力量独自战胜反共荣圈的叛乱。"
 INS_Sukarno_TNO: "苏加诺"
 POLITICS_SUKARNO_DESC_TNO:0 "印尼国父，印度尼西亚独立斗争领导人……所有这些，甚至更多的词汇，都能用以描述印度尼西亚共和国总统苏加诺。虽然现实一如既往地会要略显复杂，但这样的描述却与事实相差不远。\n\n尽管需要同日本人打交道来维持这个年轻国家的独立，但现在是个明眼人都能看出，其中的收益远远大于代价： 苏加诺以总统的地位，领导着一个迅速崛起且傲然挺立的国家；几年后，他的国家甚至可能拥有足以匹敌世界强权的经济实力，面对着极为艰巨而又颇具胆识的任务。\n\n然而，许多年月过去，这颗赤道明珠的掌舵人面临着来自四面八方的不满。来自印尼国最繁荣岛屿爪哇岛的中央集权并未受到一致欢迎，印尼军队成了孕育极端主义与激进思想的温床。苏加诺对此毫不畏惧，他深知人民对他的尊敬和爱戴能让他战胜一切。\n\n有了人民的授权和总统的力量，印度尼西亚将飞向广袤的蓝天，再不受人奴役。"
 MEN_Demchugdongrub: "德穆楚克栋鲁普"
 POLITICS_DEMCHUGDONGRUB_DESC: "世人应当如何称呼德穆楚克栋鲁普亲王？蒙古的英雄？中华民族的叛徒？1902年，德王生于苏尼特右旗，是黄金家族第三十一代传人，那木济勒旺楚克亲王的独子。六年后，德王经爱新觉罗皇室批准，承袭了父亲的郡王头衔，又被灌输了中华文化的精粹。古今中外的各色历史人物中，德王最崇拜的便是自己的祖先——成吉思汗。此后，他一生都在追求成吉思汗的遗产。\n\n1931年，德王继任锡林郭勒盟长。茫茫蒙古草原，此时仿佛换了人间：大清帝国灭亡，以北洋政府为中央的中华民国取而代之，却在俄国的阴谋策应下丢失了外蒙古。时逢乱世，德王决定趁此机会搏上一把。后来的九一八事变让德王利用南京的恐惧发起泛蒙古自治运动。谈判最终由于蒋介石及其追随势力的大汉族主义而破裂。蒙古独立建国的强烈愿望，驱使德王采用了最后的手段——向关东军求助，即使他很清楚关东军笑里藏刀的真面目。\n\n多年的奋战，部分实现了德王的梦想。大东亚战争九年后，蒙古自治政府消灭了苏联傀儡势力，并在西伯利亚干涉之后收复了失地。尽管他取得了丰功伟绩，但蒙古尚未统一，更遑论独立了。法理上，蒙疆仍然是汪精卫及其走狗的附庸；实际上，蒙疆也仅仅是关东军的封地。东蒙古的土地仍被满洲控制，外蒙古的抵抗搅得亲王寝食难安。\n\n有人将他鄙弃为羞辱了成吉思汗灵魂的叛徒，也有人批判他是一个做春秋大梦的附庸暴发户。对于这些评价，德王心里反而不无同感。可他绝不愿追随前宗主溥仪的脚步，甘做日本的傀儡。南京政府公布现代化计划后，德王警惕地发觉，革命的风暴即将重临大东亚。或许现在就是他证明自己不辱成吉思汗后裔之名的最后关头，从压迫者手中解放蒙古的最后机会。"
 MAN_aisin_gioro_puyi_TNO:0 "爱新觉罗·溥仪"
 POLITICS_PUYI_DESC:0 "昔日金銮殿上坐，今朝深囚狱中人。慈禧太后逝世前一天，她指定年幼的溥仪继承皇位，但此时清朝已摇摇欲坠，年幼的皇帝毫无回天之力。辛亥革命的压力之下，隆裕太后代为拟定退位诏书，溥仪就此逊位。新成立的中华民国政府允许溥仪暂居紫禁城，他便在城内继续生活。在那里，他与郭布罗·婉容成婚，并和她的弟弟润麒成了亲密的朋友。1924年，溥仪及其宫廷被驱逐出紫禁城，不得不流亡日本驻天津公使馆，为其未来的亲日倾向埋下伏笔。\n\n1931年，在天津蹉跎六年岁月后，日本驻屯军司令官土肥原贤二拜访溥仪，邀请他担任新满洲国的领导人。溥仪犹豫再三，最后还是接受了，带着宫廷前往长春。1932年，他上任满洲国“执政”，1934年再度登基称帝。尽管如此，溥仪还是很快发觉，他只不过是被日本人软禁在鎏金笼子里的一只小金丝雀罢了。\n\n溥仪的亲随也有此感：一直讨厌日本人的婉容更加疏远溥仪，鸦片成瘾，溥仪的兄弟也不再如往日般情同手足，甚至润麒也对日本人的控制愈发担心。然而，溥仪早已放弃挑战关东军的权威，日本赢得战争后更是如此。登基已逾三十年，一事无成，反倒落个众叛亲离，又日渐遭受病痛折磨，溥仪的身心早已被蚀成一支残烛。三十春秋，孑然一身，只余下笼中帝国。"
