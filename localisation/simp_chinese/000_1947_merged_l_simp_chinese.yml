 fascist_influence: "法西斯主义影响"
 fascist_influence_desc: "法西斯的影响让法西斯主义十分受欢迎，使该国易于同其他法西斯国家结盟。"
 communist_influence: "共产主义影响"
 communist_influence_desc: "共产党的影响让共产主义十分受欢迎，使该国易于同其他共产主义国家结盟。"
 democratic_influence: "民主主义影响"
 democratic_influence_desc: "民主派的影响让民主主义十分受欢迎，使该国易于同其他民主国家结盟。"
 neutrality_influence: "威权主义影响"
 neutrality_influence_desc: "威权主义的影响让人们对那些拥有强大政府和高贵王室的国家产生了新的尊重，使这个国家能很容易的和其他威权主义国家结盟。"
 soviet_german_friendship: "苏德友谊"
 soviet_german_friendship_desc: "德意志国与苏维埃联盟联起手来，共同对抗堕落的西方世界。"
 sour_loser: "苦涩的失败者"
 sour_loser_desc: "世界大战屈辱战败的怨恨支配着这个国家的政治。"
 received_attache: "接受军事顾问"
 received_attache_desc: "外国军事顾问正驻于我国。"
 ATTACHE_LIST: "我国接受了$LIST$的军事顾问，给予我国以下效果："
 porsche: "保时捷"
 porsche_desc: "保时捷倾向于设计具有重装甲的坦克。"
 henschel: "亨舍尔"
 henschel_desc: "亨舍尔在解决了初期的可靠性问题后，生产了战场表现良好的量产型虎式坦克。"
 GER_MAN: "曼恩"
 GER_MAN_desc: "曼恩公司最著名的产品是V号坦克“黑豹”，同时还生产和设计了一些早期型号的坦克。"
 rheinmetall: "莱茵金属"
 rheinmetall_desc: "莱茵金属设计和生产各类口径的火炮。"
 mauser: "毛瑟"
 mauser_desc: "毛瑟设计和生产各类小口径枪械。"
 ig_faben: "IG法本"
 ig_faben_desc: "IG法本致力于工业研究。"
 messerschmitt: "梅塞施密特"
 messerschmitt_desc: "梅赛施密特着力于轻型飞机的研究，例如Me-109战斗机。"
 focke_wulf: "福克-沃尔夫"
 focke_wulf_desc: "福克·沃尔夫对于大中型飞机的开发有着强烈的兴趣，例如Fw-190战斗机和Fw-200四发巡逻机。"
 junkers: "容克斯"
 junkers_desc: "容克斯成名于开发Ju-87斯图卡俯冲轰炸机。"
 todt: "弗里茨·托特"
 todt_desc: "德国工程师弗里茨·托特是托特组织的创始人，他将提高民用工业的建造速度。"
 speer: "阿尔伯特·施佩尔"
 speer_desc: "阿尔伯特·施佩尔是希特勒的御用建筑师，他在1942-1945年间作为帝国军备部长，让德国的工业生产效率得到极大提升，成就了“军备神话”。他将提高工业效率。"
 raeder: "埃里希·雷德尔"
 raeder_desc: "埃里希·雷德尔是运用传统水面舰艇战术的德国海军指挥官，支持“存在舰队”学说。"
 donitz: "卡尔·邓尼茨"
 donitz_desc: "卡尔·邓尼茨是运用U艇的德国海军指挥官，支持“海上破交”学说。"
 goering: "赫尔曼·戈林"
 goering_desc: "赫尔曼·戈林是一战中的王牌飞行员，他后来成为希特勒的重要支持者。他虽然帮了不少倒忙，但是他对希特勒有着绝对的忠诚。"
 walther_wever: "瓦尔特·韦佛"
 walther_wever_desc: "瓦尔特·韦佛是早期的战略轰炸理论的倡导者之一，极富前瞻性的眼光。"
 ritter_von_greim: "里特尔·冯·格莱姆"
 ritter_von_greim_desc: "里特尔·冯·格莱姆是一位战术封锁支持者。"
 ernst_udet: "恩斯特·乌德特"
 ernst_udet_desc: "恩斯特·乌德特是使用斯图卡俯冲轰炸机进行近接对地支援的专家。"
 werner_von_fritsch: "威尔纳·冯·弗里奇"
 werner_von_fritsch_desc: "威尔纳·冯·弗里奇，一位保守派指挥官，注重于步兵的集中使用。"
 ludwig_beck: "路德维希·贝克"
 ludwig_beck_desc: "路德维希·贝克注重强调补给线的重要性。"
 franz_halder: "弗朗茨·哈尔德"
 franz_halder_desc: "弗朗茨·哈尔德是一位大炮兵主义支持者，坚信口径就是真理。"
 heinz_guderian: "海因茨·古德里安"
 wilhelm_keitel: "威廉·凯特尔"
 wilhelm_keitel_desc: "威廉·凯特尔，保守派指挥官，注重于步兵，他缺少的指挥素养被对元首的忠诚所弥补。"
 ferdinand_schorner: "费迪南德·舍尔纳"
 ferdinand_schorner_desc: "费迪南德·舍尔纳善于防御和冬季作战。"
 general_staff: "总参谋部"
 general_staff_desc: "德军总参谋部对战争中各个方面负责，包括对动员及作战进行规划、决策和计划复盘等，大大提高了军队的组织度水平。"
 v_weapons: "复仇武器（V系列导弹）"
 v_weapons_desc: "V系列火箭是对我们敌人复仇的理想武器，比如攻击英国本土。"
 hermann_gortz: "赫尔曼·格尔茨"
 hermann_gortz_desc: "§H赫尔曼·格尔茨§!是一名精通业务的德国间谍。"
 elyesa_bazna: "艾利萨·巴兹纳"
 elyesa_bazna_desc: "§H艾利萨·巴兹纳§!更广为人知的是他的代号“西塞罗”。"
 marina_lee: "玛丽娜·李"
 marina_lee_desc: "§H玛丽娜·李§!是一名专门窃取敌方作战计划的芭蕾舞演员。"
 german_advisors: "德国军事顾问"
 german_advisors_desc: "由亚历山大·冯·法肯豪森率领的德国军事顾问团目前正在中国，其顾问正帮助国军达到西方标准。"
 walther_von_brauchitsch: "W·冯·布劳希奇"
 erwin_rommel: "埃尔温·隆美尔"
 gerd_von_rundstedt: "格尔德·冯·伦德施泰特"
 albert_kesselring: "阿尔贝特·凯塞林"
 hugo_sperrle: "胡戈·施佩勒"
 erhard_milch: "艾哈德·米尔希"
