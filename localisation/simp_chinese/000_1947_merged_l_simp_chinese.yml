 rkspeacedeal.1.t:0 "向德国人投降？"
 rkspeacedeal.1.d:0 "我们的处境从糟糕转至彻底毁灭。军队四分五裂，民众开始背离中央政府，三大城市遭敌侵占，惨遭蹂躏。若不采取紧急措施，整个斯拉夫民族恐将被日耳曼大军彻底消灭，从世上消失。危急时刻需要极端手段。我们将按对方条件谈判和平协议，这可能是压垮我们的最后一根稻草，但如果这是唯一出路，我们唯有承受。德国人要求我们撤退至阿尔汉格尔斯克-阿斯特拉罕线以西，那便如此吧。我们将退守西伯利亚，或许再也见不到莫斯科。但我们将把战斗带到他们的土地...他们的人民...他们的血液之中"
 rkspeacedeal.1.a:0 "原谅我们的祖国..."
 rkspeacedeal.1.b:0 "我们的祖国永远不会成为他们的坟墓！"
 rkspeacedeal.1.a_tt:0 "德国获胜:"
 rkspeacedeal.2.t:0 "俄国人投降了！"
 rkspeacedeal.2.d:0 "巴巴罗萨行动取得了巨大成功，俄罗斯人被彻底击败，他们的军队一片狼藉。他们提议按照我们的条件达成和平协议——所有高层已一致同意让俄方撤退至AA线（阿尔汉格尔斯克-阿斯特拉罕）以西。我们一脚踹开了大门，整个结构随之崩溃。然而，有人主张应推进至乌拉尔山脉，彻底消灭所有敌人。这会让我们陷入不利境地，因为我们仍需应对西部战线。尽管如此，元首..."
 rkspeacedeal.2.a:0 "同意！"
 rkspeacedeal.2.b:0 "拒绝！"
 SOV_collapsed_state:0 "最近崩溃"
 rksplusussr.1.t:0 "令人担忧的消息....."
 rksplusussr.1.d:0 "在伟大的卫国战争中蒙受耻辱性的失败后，民众开始质疑中央政府。一连串示威活动在西伯利亚主要城市中上演，虽目前规模不大，但无疑会随时间推移而壮大。我们的特工仍在密切监视平民动向，但能持续多久呢？当前，我们仍是[Root.GetNameDefCap]的领导者————至少现在还是..."
 rksplusussr.1.a:0 "我们有更大的问题要处理"
 rksplusussr.2.t:0 "针对政府的大规模抗议！"
 rksplusussr.2.d:0 "近期，全国范围内爆发了一场声势浩大的、以和平为主基调的抗议活动，针对我们的政府。从喀山一路到马加丹，民众的不满情绪已经沸腾。看来我们对民众的掌控正在丧失。士兵们正前往各城市——我们只能祈求最好的结果"
 rksplusussr.2.a:0 "是吗？"
 rksplusussr.3.t:0 "抗议活动转为暴力！"
 rksplusussr.3.d:0 "随着我方士兵的增援，抗议者开始挖掘掩体，局势很快变得暴力——抗议者向我们的士兵投掷手边一切可得之物。不出意料，我们的士兵以开火作为回应。那一天，四条生命消逝，另有十三人受伤"
 rksplusussr.3.a:0 "啊啊啊，这可糟透了！"
 rksplusussr.4.t:0 "军械库被突袭！"
 rksplusussr.4.d:0 "我们的困境愈发严峻。令人不安的报告显示，在四位同伴遇害后，抗议者近期袭击了一处军火库。这一事件仅在今早得到报道，一些专家推测，军火库是在夜幕掩护下被劫掠的。总计有一千支枪不翼而飞，它们可能无处不在，极有可能被用来对抗我们"
 rksplusussr.4.a:0 "不妙！"
 rksplusussr.5.t:0 "国家紧急状态声明"
 rksplusussr.5.d:0 "国内持续发生的各种抗议活动已经演变为全面的暴乱。许多人正在站队，同时也有其他人尽力与极端分子划清界限。政府已宣布全国性的封锁，并命令所有平民必须遵守宵禁，待在家中，否则将面临相应的处罚。然而，这无异于火上浇油。主要城市中的枪战屡见不鲜，我们的部队开始逃离，加入到其他派别的行列中去。我们的崩溃似乎已近在咫尺"
 rksplusussr.5.a:0 "哦，不！"
 rksplusussr.6.t:0 "哈萨克斯坦宣布独立！"
 rksplusussr.6.d:0 "我国持续的混乱局面促使哈萨克代表们为了保护他们的人民而宣布独立。我们的士兵正忙于应对叛乱，疲惫不堪，无法阻止这一宣告。我们在中亚地区的控制力正在瓦解，而这绝非终点"
 rksplusussr.6.a:0 "好吧..."
 rksplusussr.7.t:0 "突厥斯坦军团宣布成立！"
 rksplusussr.7.d:0 "随着哈萨克的独立，中亚地区陷入了混乱，一支由突厥斯坦合作者与战俘组成的军队利用中亚突厥人的反苏情绪，借着天时地利，还有阿富汗人的支持，宣布成立了突厥斯坦军团。然而，我们怀疑当地驻军是不是有点心慈手软了..."
 rksplusussr.7.a:0 "我们无论如何都到不了他们那里..."
 rksplusussr.8.t:0 "中亚其余国家宣布独立！"
 rksplusussr.8.d:0 "为了应对突厥斯坦军团的独立，中亚地区剩下的共产主义者宣布在其周围建立几个独立的苏维埃共和国。由于他们基本上与我们隔绝，因此我们很难支持他们。当地驻军誓言“将在联盟回归之前保卫苏维埃”"
 rksplusussr.8.a:0 "我们还会回来的..."
 rksplusussr.9.t:0 "[From.From.GetLeader]被暗杀！"
 rksplusussr.9.d:0 "在夜色的掩护下，我们的领袖[From.From.GetLeader]遭到冷血谋杀。调查正在进行，但鉴于当前的暴乱情况，进展缓慢。尽管如此，清晨还是举行了一场葬礼。消息传来，有人震惊，但令人担忧的是，多数人却在欢呼。我国的稳定程度降至前所未有的低点"
 rksplusussr.9.a:0 "红军将全面接管！"
 rksplusussr.9.b:0 "紧急政府过渡委员会将全面接管！"
 rksplusussr.10.t:0 "占领外满洲？"
 rksplusussr.10.d:0 "情报显示，俄罗斯境内的局势极为严峻，全国范围内爆发了大规模的骚乱和起义。对我们而言，这孕育了一个千载难逢的良机——占领外满洲地区。我们对该地一直怀有渴望，在俄国国内战期间，我们曾短暂控制过该地区，现在是时候夺回本就属于我们的土地。\n然而，也有担忧认为俄罗斯可能会采取报复措施，但鉴于他们当前的困境，这种可能性似乎极小。命运之骰已在世界地图上掷出，决定着外满洲人民的未来"
 rksplusussr.10.a:0 "前进吧！"
 rksplusussr.10.b:0 "我害怕，妈妈！"
 rksplusussr.11.t:0 "外满洲已被占领！"
 rksplusussr.11.d:0 "在一项卑劣的决策中，日本决定将外满洲从我们手中夺走。他们清楚我们的处境，并充分利用了这一点。我们驻符拉迪沃斯托克的指挥部不堪重负，被迫投降。这是忍无可忍的临界点，一场外来者的掠夺。一切掠夺的开始，似乎也是终结的开端"
 rksplusussr.11.a:0 "好像情况再无更糟！"
 rksplusussr.12.t:0 "唐努图瓦宣布独立！"
 rksplusussr.12.d:0 "唐努图瓦，实际上处于苏联控制之下的一个国家，宣布自己独立出来。其领导者明确表示，不希望他的人民继续受苦。然而，高层仅仅称这一举动为“虚张声势”，并继续他们的事务。唐努图瓦的未来充满了不确定性"
 rksplusussr.12.a:0 "唐努什么？"
 rksplusussr.13.t:0 "蒙古切断了所有联系！"
 rksplusussr.13.d:0 "蒙古，这个曾经在我们的势力范围内深受影响的国家，现在已经与我们切断了联系，并宣布成为一个“自由和统一的国家”"
 rksplusussr.13.a:0 "继续前进..."
 rksplusussr.14.t:0 "最高苏维埃主席团已经迁往远东地区！"
 rksplusussr.14.d:0 "НКВД（内务人民委员会）领导人亚戈达带领部分军政人员撤离莫斯科，向远东地区撤退。撤退目的是利用布哈林时期实施的“西伯利亚计划”（即将苏联经济中心迁移至远东的工业农业基地）作为重建基地。苏联解体后，亚戈达在远东地区成立了远东苏维埃社会主义共和国，宣称继承苏联的法统。"
 rksplusussr.14.a:0 "好吧。"
 rksplusussr.14.b:0 "紧跟着最高苏维埃主席团！"
 rksplusussr.15.t:0 "一封报告..."
 rksplusussr.15.d:0 "我国首都最近发生了一场军队与愤怒民众之间的冲突，人们强烈要求我们立即下台，让民主选举得以举行。不过，我们的军队已向他们证明，中央政府并不愿意谈判。因此，一些异议者开始讨论建立一个西伯利亚共和国的可能性，以此取代斯维尔德洛夫斯克现有的政权"
 rksplusussr.15.a:0 "胡说八道！"
 rksplusussr.16.t:0 "中西伯利亚共和国宣言"
 rksplusussr.16.d:0 "今日凌晨，学者领袖[TOM.GetLeader]在克拉斯诺亚尔斯克市议会大厦宣布成立中西伯利亚共和国，正式脱离苏联管辖。面对议会广场上万名支持者，帕斯捷尔纳克宣称新政权将遵循“文化自治与自由思想”原则，终结“莫斯科的官僚压迫”。随后，效忠中央政府的驻军与武装市民爆发激烈冲突，帕斯捷尔纳克领导的“十二月党人沙龙”民兵组织迅速控制市政枢纽及交通要道，迫使残余政府军西撤至乌拉尔山区。\n\n尽管新政权宣称已实际控制叶尼塞河流域至贝加尔湖的广袤领土，但远东伊尔库茨克的最高苏维埃主席团（由НКВД领导人亚戈达控制）公开质疑其合法性，称此为“分裂国家的叛乱行为”。 相关人士指出，此次独立运动根源可追溯至几年前苏联战败时的权力真空————当时帕斯捷尔纳克派系便以克拉斯诺亚尔斯克为据点构建自治体系，如今借苏共中央疲于应对经济衰退之机实现政治实体化。"
 rksplusussr.16.a:0 "混蛋！"
 rksplusussr.16.b:0 "在白绿相间的旗帜之下！"
 rksplusussr.17.t:0 "西西伯利亚人民共和国成立！"
 rksplusussr.17.d:0 "苏联战败后，斯大林同志率领卡冈诺维奇（斯大林派系核心成员）、元帅罗科索夫斯基及工程兵少将卡尔贝舍夫等军政要员，向乌拉尔-西西伯利亚地区战略撤退。\n他们依托乌拉尔工业带和秋明油田资源，建立反德根据地并延续社会主义制度，誓言“解放被占国土”。\n\n1953年，西西伯利亚人民共和国正式成立，首都设在秋明，在斯大林领导下迅速安定并整备红军。"
 rksplusussr.17.a:0 "祝他们好运！"
 rksplusussr.17.b:0 "为了斯大林！"
 rksplusussr.18.t:0 "结局"
 rksplusussr.18.d:0 "结局来临。国家已不再拥有昔日的辉煌。喀山曾是最理想的地方，但终究不是最安全的。每天，德军的轰炸让城市只剩尘土与废墟。叶戈罗夫认为是时候做出改变了。他决定成立西俄罗斯革命阵线，作为对抗德军扩张的最后一道防线。我们将坚韧不拔。我们定将归来。长夜漫漫，我的挚爱。"
 rksplusussr.18.a:0 "死亡并不可怕..."
 rksplusussr.19.t:0 "机会来了"
 rksplusussr.19.d:0 "最近，蒙古与苏联断绝了关系。这使得它们易受侵略，主要是来自我们的侵略。我们应该占领乌兰巴托还是让它们保持独立？"
 rksplusussr.19.a:0 "万岁！"
 rksplusussr.19.b:0 "让他们去吧"
 rksnews.11.t:0 "布列斯特-立陶夫斯克条约"
 rksnews.11.d:0 "今天早些时候，德国和苏联代表团自战争爆发以来首次会晤，双方签署了和平协议。随着苏联方面认为继续战争对其不利，于是宣布投降。意想不到的是，德国人同意在布列斯特-立陶夫斯克举行会谈，历史上的1918年，德意志帝国和苏维埃俄国在那里签署了一项单独的和平条约，最终结束了东欧的世界大战。\n苏联同意从阿尔汉格尔斯克-阿斯特拉罕线以西撤军。作为回应，德国也同意停火。虽然和平似乎已经回到了苏联，但专家们却对此持怀疑态度，认为苏联的和平状态可能不会持续太久.."
 rksnews.11.a:0 "啊？"
 rksnews.11.b:0 "胜利属于德意志！"
 rksnews.11.c:0 "我们让祖国丢脸了"
 rksnews.12.t:0 "[SOV.GetName]的领导人去世！"
 rksnews.12.d:0 "在 [GetDateText]，苏联流亡政府今天清晨宣布其领导人去世。祖国在伟大的卫国战争中战败后，举国上下都为之震惊。\n死亡原因可能是暗杀，因为我们在事发现场附近发现了一些证据。然而根据调查人员的线索，目前仍然没有确定的嫌疑人。外国专家指出了政府自身策划暗杀的可能性，因为他们认为该领导人无能且不适合担任其职位。\n尽管如此，国家还是以庄重的仪式哀悼了这一损失，举行了一场隆重的国葬"
 rksnews.12.a:0 "节哀顺变"
 rksnews.12.b:0 "那个混蛋终于死了！"
 rksnews.12.c:0 "警卫在哪里？！"
 rksnews.13.t:0 "日本接管外满洲"
 rksnews.13.d:0 "东京最近向全世界宣布了对外满洲的接管。根据日本官方的说法，此次接管的目的是为了“保障日本的利益”。日本对该地区一直抱有浓厚的兴趣，这一点可以从其在俄国内战期间的占领符拉迪沃斯托克看出。\n意想不到的是，日本在入侵过程中几乎没有遭到抵抗。这可以归因于苏联内部的持续动荡，这使得苏军无法有效地应对。\n苏联政府对这一入侵行为进行了严厉谴责，尽管它并未正式对日宣战"
 rksnews.13.a:0 "他们的野心终于实现了"
 rksnews.13.b:0 "天皇陛下万岁！"
 rksnews.13.c:0 "这对于我们来说太难处理了！"
 rksnews.14.t:0 "苏联的崩溃"
 rksnews.14.d:0 "在苏德战争中，苏联的战败及其投降，向民众展示了现政权的无能。现在，我们所熟知的那个联盟已经不复存在，民众已经为此发声。\n在经历了一系列战争中的失败和挫折之后，苏联的领导层已经决定向德国投降。这一决定在民众中引起了巨大动荡，导致了一场巨大的崩溃，最终摧毁了苏联。\n一个新的共产主义政府在喀山由亚历山大·叶戈罗夫建立，他希望为“解放他们的祖国，为人类的未来”而奋斗。专家们很怀疑叶戈罗夫是否能够正面抗衡庞大的德国。\n\n俄罗斯母亲已逝，唯有上帝能将其从地狱深渊中拯救"
 rksnews.14.a:0 "再会"
 rksnews.14.b:0 "苏联终于崩溃了！"
 rksnews.14.c:0 "漆黑的夜..."
 rksplusplusgermanpeace.1.t:"和平的机会"
 rksplusplusgermanpeace.1.d:"遭受了无法承受的重大伤亡，加之民众对持续战斗的支持率低迷以及震惊于我方武装部队的优势，似乎盟军终于承认败北，希望结束这场闹剧。近期，我们收到多封高级别外交信函，询问是否愿意同意和谈，提议尽快举行和平谈判。\n\n虽然这场悲惨的战争显然咎由彼启，他们拒绝归还我们正当拥有但泽省的权利，导致无数生命陨落，但这一和谈机会我们已等待良久。若我们接受，将同意在和平谈判期间立即停火，会谈将在科隆举行。届时，英国、法国、比荷卢三国以及波兰将作为与会方出席，当然，我们的轴心国盟友也将参与其中。\n\n这是帝国伟大的一天，我们实际上已无继续战争的必要。我们应该接受和谈，结束这场战争，确保再没有任何人能威胁到德意志人民以及我们的盟友！"
 rksplusplusgermanpeace.1.a:"今天，新秩序已经形成！胜利属于我们！"
 rksplusplusgermanpeace.1.b:"我们想要的是最终的胜利！"
 rksplusplusgermanpeace.2.t:"《科隆条约》——欧洲"
 rksplusplusgermanpeace.2.d:"随着停战协议全面生效，和平谈判现已启动，我们有许多议题要商讨，但自然而然地，首先需定夺的是欧洲的命运。\n\n我们的条件已经提出，对许多人而言并不意外。维希政府将被承认为唯一合法的法国政权，同时，我们对波兰及其他德国正当领土的要求将会得到认可与尊重。\n\n英国将置于一个新型的、强有力的政府之下，不再受制于软弱的议会民主制度。这个政府在经济和军事上将依赖于我们，并且其政治决策将按照我们的要求进行处理。\n\n我们英勇并肩作战的意大利朋友们，将被授予萨伏伊、科西嘉、马耳他等历史上属于意大利的领土以及其他地区。"
 rksplusplusgermanpeace.2.a:"德意志与意大利的和平，皆由此刻启程！"
 rksplusplusgermanpeace.3.t:"《科隆条约》——非洲"
 rksplusplusgermanpeace.3.d:"欧洲的版图已按我们的意愿划定，但整个非洲大陆仍待分割。我们在非洲的目标远不如在欧洲那样明确，但我们草拟了一份简明扼要的领土和条件清单，列出了我们认为有利的条款。非洲蕴藏着丰富的资源，确保对这些资源的控制应当是我们的首要任务。\n\n然而，我们的意大利朋友，特别是墨索里尼，长期以来一直觊觎非洲的大片领土。一战后他们认为被欺骗的土地，长久以来一直是意大利宣传的鼓动点，许多法西斯分子渴望扩大他们的帝国，并在这一过程中与法国和英国一决高下。\n\n我们将会获得中非的大部分地区、马达加斯加以及我们历史上的殖民地，而意大利则会吞并非洲的一大块土地，以连接利比亚意大利部分与东非，同时还将获得苏伊士运河、中东部分地区及黎凡特。同时，我们还将邀请南非瓜分英国殖民地，并在南非拥有“自由之手”，我们相信南非不久将落入我们的影响之下。\n\n最后，我们的[SPR.GetName]朋友要求将西非的部分地区并入他们的殖民帝国。鉴于[SPR.GetName]在战争中帮助了我们，因此我们觉得批准这一请求是合适的。"
 rksplusplusgermanpeace.3.a:"拥有殖民地总是一件好事！"
 rksplusplusgermanpeace.6.t:"《科隆条约》——希腊"
 rksplusplusgermanpeace.6.d:"当我们忙于与法国和英国的征服行动时，很容易忘记我们已占领希腊有一段时间了。现在，在如此多国家的见证下，没有比这更好的时机来决定希腊的命运了。\n\n意大利人是首批入侵希腊的，他们希望永久确保对地中海和希腊资源的影响力，不出意料，他们要求获得希腊土地的最大份额，考虑到他们在战争的这一前线投入了最多的兵力，这一点已经被认为是相当公平的。\n\n然而，保加利亚人对获取希腊的一部分领土表现出浓厚的兴趣。长期以来，他们一直力图控制希腊的马其顿地区，并试图将这些地方纳入大保加利亚之中。意大利总体上同意这些要求，毕竟保加利亚军队在入侵过程中提供了协助。\n\n此外，土耳其要求割让东色雷斯的一块土地，称当地有土耳其少数民族存在，并基于历史上的奥斯曼帝国省份地位作为其主张的基础。另外，土耳其还要求获得爱琴群岛的一部分。对色雷斯的要求与保加利亚产生了些摩擦，但我们已经同意土耳其的需求，而保加利亚别无选择，只能接受这个安排。"
 rksplusplusgermanpeace.6.a:"这座文明的摇篮将在我们新秩序的洗礼中重生！"
 rksplusplusgermanpeace.7.t:"《科隆条约》——南斯拉夫"
 rksplusplusgermanpeace.7.d:"从诞生之初，南斯拉夫就是一个协约国拼凑的产物，目的就是为了阻止我们获取应得的土地。而现在，我们的军队以其强大的力量终于见证了它的崩溃。随着它的瓦解，我们必须找出最合理的方式来分配这片土地。\n\n我们要求历史上属于德意志人的卡尼奥拉地区回归，那里至今仍有大量德意志人口。我们将把这片土地并入奥地利省区，确保所有我们的人民最终完全团结在同一面旗帜下。\n\n意大利人要求获得南斯拉夫的大部分地区，可能是因为达尔马提亚地区存在意大利少数民族，且有意大利文化的悠久历史，他们想要将这一地区并入。对于剩下的地区，他们似乎打算建立一个附庸国。\n\n不甘在这场讨论中被边缘化，保加利亚人对马其顿提出了他们的主张，这符合他们将整个马其顿置于其控制之下的目标。确实，保加利亚是第一次世界大战中的另一个不公正受害者，因此他们得到补偿是理所应当的。"
 rksplusplusgermanpeace.7.a:"我们是这块土地上正当的守护者！"
 rksplusplusgermanpeace.4.t:"《科隆条约》——中东"
 rksplusplusgermanpeace.4.d:"虽然非洲是我们的主要优先考虑地区，但前英国帝国在中东的存在是不可否认的。根据赛克斯-皮科协定，英国获得了黎凡特以及海湾地区的控制权。然而，根据《科隆条约》，这种现状将被彻底打破。\n\n我们对中东地区普遍不感兴趣，我们更关注非洲和欧洲的局势发展。但我们的盟友却对那里的情况充满极大兴趣，尤其是意大利。墨索里尼要求控制黎凡特的大部分地区，包括圣地。\n\n此外，墨索里尼宣称海湾保护国是理应属于意大利的土地，并对其石油资源表现出极大的兴趣。看来他还要求完全控制埃及，特别是至关重要的苏伊士运河，这样可以让意大利进出他们在非洲的领地更加便利。\n\n土耳其人也急于利用中东新一轮的兼并浪潮，视叙利亚为一个容易的目标，并声称其作为奥斯曼帝国曾经的一部分，理应归土耳其所有。尽管叙利亚曾是维希法国的一部分，但我们认为土耳其的战争贡献足以使其接手这片领土的控制权。"
 rksplusplusgermanpeace.4.a:"赛克斯-皮科协定如同签署它的那些帝国一样，已经寿终正寝了"
 rksplusplusgermanpeace.9.t:"收尾工作"
 rksplusplusgermanpeace.9.d:"既然同盟国已被处理，再无任何援助的可能，我们现在终于可以把目光转向巴尔干半岛。特别值得关注的是希腊和南斯拉夫，这两个曾经受到英法庇护，并被不公正地赏赐土地的国家，如今已门户洞开，正待我们去打击，这也是我们的盟友们所渴望的。斯洛文尼亚境内的德国戈策少数民族对我们来说尤其重要。这些国家逃避我们的掌握太久，现在，我们要结束这一切！"
 rksplusplusgermanpeace.9.a:"巴尔干半岛必须被纳入我们的势力范围！"
 rksplusplusgermanpeace.8.t:"《科隆条约》——中东"
 rksplusplusgermanpeace.8.d:"虽然非洲是我们的主要优先考虑地区，但前英国帝国在中东的存在是不可否认的。根据赛克斯-皮科协定，英国获得了黎凡特以及海湾地区的控制权。然而，根据《科隆条约》，这种现状将被彻底打破。\n\n我们对中东地区普遍不感兴趣，我们更关注非洲和欧洲的局势发展。但我们的盟友却对那里的情况充满极大兴趣，尤其是意大利。墨索里尼要求控制黎凡特的大部分地区，包括圣地。\n\n此外，墨索里尼宣称海湾保护国是理应属于意大利的土地，并对其石油资源表现出极大的兴趣。看来他还要求完全控制埃及，特别是至关重要的苏伊士运河，这样可以让意大利进出他们在非洲的领地更加便利。"
 rksplusplusgermanpeace.8.a:"赛克斯-皮科协定如同签署它的那些帝国一样，已经寿终正寝了"
 rksplusplusgermanpeace.10.t:"《科隆条约》——希腊"
 rksplusplusgermanpeace.10.d:"当我们忙于与法国和英国的征服行动时，很容易忘记我们已占领希腊有一段时间了。现在，在如此多国家的见证下，没有比这更好的时机来决定希腊的命运了。\n\n意大利人是首批入侵希腊的，他们希望永久确保对地中海和希腊资源的影响力，不出意料，他们要求获得希腊土地的最大份额，考虑到他们在战争的这一前线投入了最多的兵力，这一点已经被认为是相当公平的。\n\n然而，保加利亚人对获取希腊的一部分领土表现出浓厚的兴趣。长期以来，他们一直力图控制希腊的马其顿地区，并试图将这些地方纳入大保加利亚之中。意大利总体上同意这些要求，毕竟保加利亚军队在入侵过程中提供了协助。"
 rksplusplusgermanpeace.10.a:"这座文明的摇篮将在我们新秩序的洗礼中重生！"
 rksplusplusgermanpeace.13.t:"轴心国的解散"
 rksplusplusgermanpeace.13.d:"随着我们最终征服了欧洲大陆，且两大竞争对手已被消灭，我们与意大利和日本的联盟变得日益不稳定。没有了共同的敌人，我们国家与仅存的两个超级大国（除美国外）之间的争端变得越来越频繁，对盟友的需要也越来越不必要。因此，我们必须正式终止与轴心国他国的所有安全保障协议，以在未来获得更大的独立性，因为在新的世界秩序中，只有真正的德国人才能站在顶点！"
 rksplusplusgermanpeace.13.a:"我们这一方已经履行了协议"
 rksplusplusgermanpeace.5.t:"大英帝国的崩溃"
 rksplusplusgermanpeace.5.d:"自16世纪以来，大英帝国经历了一段持续的增长、扩张与繁荣时期，世界上的许多地方都曾飘扬过米字旗。一战后，大英帝国达到了巅峰；而二战之后，它却走向终结。\n失去了本土，大英帝国也就丧失了维持全球影响力的基石，在德军踏破伦敦之时，政府无计可施阻止这场崩溃的到来，因此帝国的很多部分纷纷独立。\n更不令人意外的是，许多与英国存在领土争议的国家，已经开始行动以确保自己的领土利益，阿根廷收复了马尔维纳斯群岛，西班牙夺取了直布罗陀，也门进入了亚丁，甚至美国也控制了加勒比海地区，诸如此类的行为不断上演。\n这个历史上最庞大的帝国，历经几个世纪才建立起来，却仅仅在几天之内就轰然倒塌。"
 rksplusplusgermanpeace.5.a:"日耳曼民族推翻一个帝国？历史总是惊人的相似"
 rksplusplusgermanpeace.11.t:"《科隆停战协定》"
 rksplusplusgermanpeace.11.d:"看来，在接连不断的失败和总体上无力阻挡德军的推进后，同盟国已经显示出他们愿意与德意志国及轴心国商讨和平事宜的意愿，并请求在谈判期间暂时休战，而和平条款将在德国城市科隆进行协商。\n\n轴心国热情地接受了这个提议，关于这些谈判最终会带来什么结果，有无数的理论猜测，大多数人都在预期会达成某种形式的严苛和平。\n\n但所有人都能达成共识的是，这次和平的结果不仅会对欧洲产生巨大影响，也会对更广阔的世界产生重大冲击。"
 rksplusplusgermanpeace.11.a:"旧的霸权消亡，新的霸权取而代之"
 rksplusplusgermanpeace.12.t:"《科隆条约》"
 rksplusplusgermanpeace.12.d:"这场经过数周，被国际上的批评者称为“一边倒”的谈判，终于落下帷幕，残存的同盟国正式与轴心国签署了和平条约，从而在欧洲结束了敌对状态。\n\n这些签名给世界现状带来了巨大改变，英国本土永久性地处于德国士兵的占领之下，非洲大陆则进一步在德国和意大利的占领下挣扎，而大英帝国的余烬已被国际社会瓜分。尽管美国强烈谴责了这一条约，日本却宣布这是对抗西方帝国主义所必需的胜利。"
 rksplusplusgermanpeace.12.a:"欧洲在恐惧中见证了自己的末日"
