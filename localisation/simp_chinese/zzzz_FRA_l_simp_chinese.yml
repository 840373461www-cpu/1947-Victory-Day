 FRA_pierre_laval: "皮埃尔·赖伐尔"
 POLITICS_PIERRE_LAVAL_DESC: "曾三次出任总理的皮埃尔·赖伐尔无疑是战前法国政府混乱与内斗的代表。第三共和国飞速倒台后，赖伐尔支持议会授予贝当紧急权力。他本人则担任维希政权的总理。\n\n尽管赖伐尔声称自己并非法西斯的拥蹙，而实际上他与德国的合作关系日益加深。世界大战结束后，一纸《巴黎协定》再次将赖伐尔推上了权力中心，然而他对法国政坛的控制还远远谈不上稳固。\n\n东方局势恶化的当下，从前遍布法国的混乱也日渐猖獗。赖伐尔与他的政府陷入了毫无意义的内耗，而法国的政局却已经抛弃了他们。议会中反对派的力量水涨船高，所有人都渴望改变现状，民族共和国的局势已经危如累卵。\n\n赖伐尔心知欧洲和平的表象下可有无数暗流在涌动，一旦战争爆发，法国必将再陷火海。"
