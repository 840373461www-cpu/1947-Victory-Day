#美德和平
 rksplusplusgermanpeace.1.t:"和平的机会"
 rksplusplusgermanpeace.1.d:"遭受了无法承受的重大伤亡，加之民众对持续战斗的支持率低迷以及震惊于我方武装部队的优势，似乎盟军终于承认败北，希望结束这场闹剧。近期，我们收到多封高级别外交信函，询问是否愿意同意和谈，提议尽快举行和平谈判。\n\n虽然这场悲惨的战争显然咎由彼启，他们拒绝归还我们正当拥有但泽省的权利，导致无数生命陨落，但这一和谈机会我们已等待良久。若我们接受，将同意在和平谈判期间立即停火，会谈将在科隆举行。届时，英国、法国、比荷卢三国以及波兰将作为与会方出席，当然，我们的轴心国盟友也将参与其中。\n\n这是帝国伟大的一天，我们实际上已无继续战争的必要。我们应该接受和谈，结束这场战争，确保再没有任何人能威胁到德意志人民以及我们的盟友！"
 rksplusplusgermanpeace.1.a:"今天，新秩序已经形成！胜利属于我们！"
 rksplusplusgermanpeace.1.b:"我们想要的是最终的胜利！"

 rksplusplusgermanpeace.2.t:"《科隆条约》——欧洲"
 rksplusplusgermanpeace.2.d:"随着停战协议全面生效，和平谈判现已启动，我们有许多议题要商讨，但自然而然地，首先需定夺的是欧洲的命运。\n\n我们的条件已经提出，对许多人而言并不意外。维希政府将被承认为唯一合法的法国政权，同时，我们对波兰及其他德国正当领土的要求将会得到认可与尊重。\n\n英国将置于一个新型的、强有力的政府之下，不再受制于软弱的议会民主制度。这个政府在经济和军事上将依赖于我们，并且其政治决策将按照我们的要求进行处理。\n\n我们英勇并肩作战的意大利朋友们，将被授予萨伏伊、科西嘉、马耳他等历史上属于意大利的领土以及其他地区。"
 rksplusplusgermanpeace.2.a:"德意志与意大利的和平，皆由此刻启程！"

 rksplusplusgermanpeace.3.t:"《科隆条约》——非洲"
 rksplusplusgermanpeace.3.d:"欧洲的版图已按我们的意愿划定，但整个非洲大陆仍待分割。我们在非洲的目标远不如在欧洲那样明确，但我们草拟了一份简明扼要的领土和条件清单，列出了我们认为有利的条款。非洲蕴藏着丰富的资源，确保对这些资源的控制应当是我们的首要任务。\n\n然而，我们的意大利朋友，特别是墨索里尼，长期以来一直觊觎非洲的大片领土。一战后他们认为被欺骗的土地，长久以来一直是意大利宣传的鼓动点，许多法西斯分子渴望扩大他们的帝国，并在这一过程中与法国和英国一决高下。\n\n我们将会获得中非的大部分地区、马达加斯加以及我们历史上的殖民地，而意大利则会吞并非洲的一大块土地，以连接利比亚意大利部分与东非，同时还将获得苏伊士运河、中东部分地区及黎凡特。同时，我们还将邀请南非瓜分英国殖民地，并在南非拥有“自由之手”，我们相信南非不久将落入我们的影响之下。\n\n最后，我们的[SPR.GetName]朋友要求将西非的部分地区并入他们的殖民帝国。鉴于[SPR.GetName]在战争中帮助了我们，因此我们觉得批准这一请求是合适的。"
 rksplusplusgermanpeace.3.a:"拥有殖民地总是一件好事！"

 rksplusplusgermanpeace.6.t:"《科隆条约》——希腊"
 rksplusplusgermanpeace.6.d:"当我们忙于与法国和英国的征服行动时，很容易忘记我们已占领希腊有一段时间了。现在，在如此多国家的见证下，没有比这更好的时机来决定希腊的命运了。\n\n意大利人是首批入侵希腊的，他们希望永久确保对地中海和希腊资源的影响力，不出意料，他们要求获得希腊土地的最大份额，考虑到他们在战争的这一前线投入了最多的兵力，这一点已经被认为是相当公平的。\n\n然而，保加利亚人对获取希腊的一部分领土表现出浓厚的兴趣。长期以来，他们一直力图控制希腊的马其顿地区，并试图将这些地方纳入大保加利亚之中。意大利总体上同意这些要求，毕竟保加利亚军队在入侵过程中提供了协助。\n\n此外，土耳其要求割让东色雷斯的一块土地，称当地有土耳其少数民族存在，并基于历史上的奥斯曼帝国省份地位作为其主张的基础。另外，土耳其还要求获得爱琴群岛的一部分。对色雷斯的要求与保加利亚产生了些摩擦，但我们已经同意土耳其的需求，而保加利亚别无选择，只能接受这个安排。"
 rksplusplusgermanpeace.6.a:"这座文明的摇篮将在我们新秩序的洗礼中重生！"

 rksplusplusgermanpeace.7.t:"《科隆条约》——南斯拉夫"
 rksplusplusgermanpeace.7.d:"从诞生之初，南斯拉夫就是一个协约国拼凑的产物，目的就是为了阻止我们获取应得的土地。而现在，我们的军队以其强大的力量终于见证了它的崩溃。随着它的瓦解，我们必须找出最合理的方式来分配这片土地。\n\n我们要求历史上属于德意志人的卡尼奥拉地区回归，那里至今仍有大量德意志人口。我们将把这片土地并入奥地利省区，确保所有我们的人民最终完全团结在同一面旗帜下。\n\n意大利人要求获得南斯拉夫的大部分地区，可能是因为达尔马提亚地区存在意大利少数民族，且有意大利文化的悠久历史，他们想要将这一地区并入。对于剩下的地区，他们似乎打算建立一个附庸国。\n\n不甘在这场讨论中被边缘化，保加利亚人对马其顿提出了他们的主张，这符合他们将整个马其顿置于其控制之下的目标。确实，保加利亚是第一次世界大战中的另一个不公正受害者，因此他们得到补偿是理所应当的。"
 rksplusplusgermanpeace.7.a:"我们是这块土地上正当的守护者！"

 rksplusplusgermanpeace.4.t:"《科隆条约》——中东"
 rksplusplusgermanpeace.4.d:"虽然非洲是我们的主要优先考虑地区，但前英国帝国在中东的存在是不可否认的。根据赛克斯-皮科协定，英国获得了黎凡特以及海湾地区的控制权。然而，根据《科隆条约》，这种现状将被彻底打破。\n\n我们对中东地区普遍不感兴趣，我们更关注非洲和欧洲的局势发展。但我们的盟友却对那里的情况充满极大兴趣，尤其是意大利。墨索里尼要求控制黎凡特的大部分地区，包括圣地。\n\n此外，墨索里尼宣称海湾保护国是理应属于意大利的土地，并对其石油资源表现出极大的兴趣。看来他还要求完全控制埃及，特别是至关重要的苏伊士运河，这样可以让意大利进出他们在非洲的领地更加便利。\n\n土耳其人也急于利用中东新一轮的兼并浪潮，视叙利亚为一个容易的目标，并声称其作为奥斯曼帝国曾经的一部分，理应归土耳其所有。尽管叙利亚曾是维希法国的一部分，但我们认为土耳其的战争贡献足以使其接手这片领土的控制权。"
 rksplusplusgermanpeace.4.a:"赛克斯-皮科协定如同签署它的那些帝国一样，已经寿终正寝了"

 rksplusplusgermanpeace.9.t:"收尾工作"
 rksplusplusgermanpeace.9.d:"既然同盟国已被处理，再无任何援助的可能，我们现在终于可以把目光转向巴尔干半岛。特别值得关注的是希腊和南斯拉夫，这两个曾经受到英法庇护，并被不公正地赏赐土地的国家，如今已门户洞开，正待我们去打击，这也是我们的盟友们所渴望的。斯洛文尼亚境内的德国戈策少数民族对我们来说尤其重要。这些国家逃避我们的掌握太久，现在，我们要结束这一切！"
 rksplusplusgermanpeace.9.a:"巴尔干半岛必须被纳入我们的势力范围！"

 rksplusplusgermanpeace.8.t:"《科隆条约》——中东"
 rksplusplusgermanpeace.8.d:"虽然非洲是我们的主要优先考虑地区，但前英国帝国在中东的存在是不可否认的。根据赛克斯-皮科协定，英国获得了黎凡特以及海湾地区的控制权。然而，根据《科隆条约》，这种现状将被彻底打破。\n\n我们对中东地区普遍不感兴趣，我们更关注非洲和欧洲的局势发展。但我们的盟友却对那里的情况充满极大兴趣，尤其是意大利。墨索里尼要求控制黎凡特的大部分地区，包括圣地。\n\n此外，墨索里尼宣称海湾保护国是理应属于意大利的土地，并对其石油资源表现出极大的兴趣。看来他还要求完全控制埃及，特别是至关重要的苏伊士运河，这样可以让意大利进出他们在非洲的领地更加便利。"
 rksplusplusgermanpeace.8.a:"赛克斯-皮科协定如同签署它的那些帝国一样，已经寿终正寝了"

 rksplusplusgermanpeace.10.t:"《科隆条约》——希腊"
 rksplusplusgermanpeace.10.d:"当我们忙于与法国和英国的征服行动时，很容易忘记我们已占领希腊有一段时间了。现在，在如此多国家的见证下，没有比这更好的时机来决定希腊的命运了。\n\n意大利人是首批入侵希腊的，他们希望永久确保对地中海和希腊资源的影响力，不出意料，他们要求获得希腊土地的最大份额，考虑到他们在战争的这一前线投入了最多的兵力，这一点已经被认为是相当公平的。\n\n然而，保加利亚人对获取希腊的一部分领土表现出浓厚的兴趣。长期以来，他们一直力图控制希腊的马其顿地区，并试图将这些地方纳入大保加利亚之中。意大利总体上同意这些要求，毕竟保加利亚军队在入侵过程中提供了协助。"
 rksplusplusgermanpeace.10.a:"这座文明的摇篮将在我们新秩序的洗礼中重生！"
 
 rksplusplusgermanpeace.13.t:"轴心国的解散"
 rksplusplusgermanpeace.13.d:"随着我们最终征服了欧洲大陆，且两大竞争对手已被消灭，我们与意大利和日本的联盟变得日益不稳定。没有了共同的敌人，我们国家与仅存的两个超级大国（除美国外）之间的争端变得越来越频繁，对盟友的需要也越来越不必要。因此，我们必须正式终止与轴心国他国的所有安全保障协议，以在未来获得更大的独立性，因为在新的世界秩序中，只有真正的德国人才能站在顶点！"
 rksplusplusgermanpeace.13.a:"我们这一方已经履行了协议"

#新闻
 rksplusplusgermanpeace.5.t:"大英帝国的崩溃"
 rksplusplusgermanpeace.5.d:"自16世纪以来，大英帝国经历了一段持续的增长、扩张与繁荣时期，世界上的许多地方都曾飘扬过米字旗。一战后，大英帝国达到了巅峰；而二战之后，它却走向终结。\n失去了本土，大英帝国也就丧失了维持全球影响力的基石，在德军踏破伦敦之时，政府无计可施阻止这场崩溃的到来，因此帝国的很多部分纷纷独立。\n更不令人意外的是，许多与英国存在领土争议的国家，已经开始行动以确保自己的领土利益，阿根廷收复了马尔维纳斯群岛，西班牙夺取了直布罗陀，也门进入了亚丁，甚至美国也控制了加勒比海地区，诸如此类的行为不断上演。\n这个历史上最庞大的帝国，历经几个世纪才建立起来，却仅仅在几天之内就轰然倒塌。"
 rksplusplusgermanpeace.5.a:"日耳曼民族推翻一个帝国？历史总是惊人的相似"

 rksplusplusgermanpeace.11.t:"《科隆停战协定》"
 rksplusplusgermanpeace.11.d:"看来，在接连不断的失败和总体上无力阻挡德军的推进后，同盟国已经显示出他们愿意与德意志国及轴心国商讨和平事宜的意愿，并请求在谈判期间暂时休战，而和平条款将在德国城市科隆进行协商。\n\n轴心国热情地接受了这个提议，关于这些谈判最终会带来什么结果，有无数的理论猜测，大多数人都在预期会达成某种形式的严苛和平。\n\n但所有人都能达成共识的是，这次和平的结果不仅会对欧洲产生巨大影响，也会对更广阔的世界产生重大冲击。"
 rksplusplusgermanpeace.11.a:"旧的霸权消亡，新的霸权取而代之"

 rksplusplusgermanpeace.12.t:"《科隆条约》"
 rksplusplusgermanpeace.12.d:"这场经过数周，被国际上的批评者称为“一边倒”的谈判，终于落下帷幕，残存的同盟国正式与轴心国签署了和平条约，从而在欧洲结束了敌对状态。\n\n这些签名给世界现状带来了巨大改变，英国本土永久性地处于德国士兵的占领之下，非洲大陆则进一步在德国和意大利的占领下挣扎，而大英帝国的余烬已被国际社会瓜分。尽管美国强烈谴责了这一条约，日本却宣布这是对抗西方帝国主义所必需的胜利。"
 rksplusplusgermanpeace.12.a:"欧洲在恐惧中见证了自己的末日"

