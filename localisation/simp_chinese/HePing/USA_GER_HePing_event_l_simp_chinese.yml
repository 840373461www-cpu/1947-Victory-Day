 JAP_colonialism_defeated_desc:"西方对亚洲的钳制已被打破！在我们的密切关注下，亚洲正迎来一个崭新的团结黄金时代，彻底摆脱欧洲和美国的干预。从今往后直至永远，旭日将照耀整个亚洲，光芒万丈！"
 
 JAP_no_help_coming:"孤身一人..."
 JAP_no_help_coming_desc:"随着德国成功统治欧洲，我们已被切断所有可能的援助来源。美国人遭受失去欧洲大陆的重创，英国人则沦为了德国的靴下之囚。面对日本侵略者，我们几乎没有抵抗之力，现在只能眼睁睁看着他们掠夺和奴役我们的家园"

