l_simp_chinese:
 form_Grosgermanisches_Reich_category: "建立大日耳曼国"
 form_Grosgermanisches_Reich_category_desc: "§O元首§!的荣光以及帝国辽阔的疆域永无止境，眼下，我们的领土已经抵至§O元首§!计划中帝国生存空间的全域，而那些胆敢阻挠我方意志的宵小之国亦已作古。\n全世界应当知晓我等民族之伟大，世人皆会在改建之后的国都——§Y日耳曼尼亚§!面前惊叹不止。\n有鉴于此，§O元首§!已然作出指示，我国应借此机会，宣告我国为§L神圣罗马帝国§!在精神上的继承者，乃§Y德意志民族神圣的大日耳曼国§!！\n\n§R雅利安民族的雄鹰将征服一切！§!"
 form_Grosgermanisches_Reich: "建立德意志民族的大日耳曼国"
 form_Grosgermanisches_Reich_desc: "§R与原版的§Y"建立大德意志国"§!决议互斥！§!"
 Change_xtl_TouXiang: "将希特勒头像和描述替换为1962年TNO的"

 form_Jap_empire_category: "建立大日本帝国"
 form_Jap_empire: "建立大日本帝国"

 form_HuGuoJun_category: "建立护国军"
 form_HuGuoJun_flag: "§Y护国军§!已经建立"
 form_HuGuoJun_category_desc: "§W在漫漫长夜，我们紧守心中不曾变更的希望，韬光养晦，等待解放和复仇的契机，§R异族蛮夷§!正站在我们同胞的尸山血海上，俯视着我们，但君子报仇，十年不晚。如今时机已至，§C他们那帝国§!早已不堪重负，被臃肿与无能拖垮，我们必须把握这时机，§G重燃星星之火§!。\n\n在护国军包含猜忌的目光下，我们不断进军，这条道路注定§Y崎岖难行、荆棘塞途§!。在此时机，南京庙堂中的那些§R汉奸蛀虫小人，中华民族的不孝儿女§!，用着自己那腐朽落后的思想诱骗、荼毒这神州大地。身为§Y孙先生真正的继承者§!，我们决不能坐视不管，我们需充分发挥自身的影响与正统，团结一切可以团结的力量。§G爱国人士、军阀、山贼，甚至一些汉奸§!，都是我们要争取的对象。战争迫在眉睫，我们将吹响新征程的嘹亮号角，唤醒这帮人心中的§Y荣誉和尊严§!，给他们机会§R洗净自己身上的耻辱§!，把他们当作§G同志和解放者§!团结在我们身边。要是§R再不能§!团结起来，我们解放神州大地的§R正义事业就要失败§!，我们伟大的中华民族，更是要§R匍匐在外国侵略者面前，千万年§!。\n\n齐心协力，朝着南京，朝着北京，不断进军！解放祖国，寸土必争，§R反抗压迫，民族振兴！§!起来，不愿做奴隶的人们！"
 form_HuGuoJun: "建立中华民国护国军"
 HuGuoJun_attack: "发动民族解放战争"

