 CRN_Franz_Halder:0 "弗朗茨·哈尔德"

 DEN_Werner_Best_TNO:0 "维尔纳·贝斯特"
 POLITICS_WERNER_BEST_DESC:0 "维尔纳·贝斯特是一位坚定的德意志民族主义者，曾加入数个极右党派，因此他在1930年急切地加入纳粹党也就令人不足为奇了。此后，他成为党卫军的一员，利用自己的法律和行政能力为新生的盖世太保组织做出了贡献，并在慕尼黑协调了长刀之夜的行动。1940年，政敌迫使他放弃了在盖世太保中的职位，他转而到法兰西的军事占领政府任职，并在1942年被任命为德国驻丹麦全权代表。维尔纳处在一个尴尬的位置上，因为丹麦仍然获准保留君主制度、内阁以及半民主的议会。德国占领当局做出了许多妥协，他们甚至建议贝斯特不要将丹麦的犹太人运往集中营，以维持与丹麦政府的良好关系。1943年一次恢复普选的尝试以及一系列罢工行动使贝斯特将丹麦带入了德国的军事占领之下，议会遭到解散，但丹麦国王、内阁和大部分官僚机构都完整保留了下来。奇怪的是，贝斯特也没能阻止丹麦绝大多数的犹太人逃亡瑞典，数十年来坊间一直有传言称他是犹太人的同情者。\n\n战争结束后，丹麦仍然处于这种尴尬的不稳定状态。名义上她仍然是个独立国家，但受到德国的密切监管，德国人也一直在威胁恢复军事戒严。贝斯特仍旧在任，他曾短暂地尝试推行广泛的日耳曼化计划。50年代的经济崩溃导致资金枯竭，让计划不得不暂停，但贝斯特仍然希望他的梦想——让丹麦成为大日耳曼国的一部分——有朝一日能够实现。"

 NOR_Josef_Terboven_TNO:0 "约瑟夫·特博文"
 POLITICS_JOSEF_TERBOVEN_DESC: "挪威专员约瑟夫·特博文已在日耳曼尼亚的视线之外过了二十年的幸运生活。挪威是德国战略防御体系中的重要组成部分，但作为和平条件赋予当地人的自治权利在特博文看来却是颇为恼人的，他觉得挪威人虽是雅利安人，但却懒惰又无能，这种看法源自工业上的诸多问题、日耳曼化进程停滞不前，以及长久以来无法粉碎挪威的军事抵抗组织(Milorg)。\n\n挪威在德国的治下迎来了崭新的繁荣，但背后却潜藏着国民联盟的本土法西斯主义者和德国占领军的冲突。50年代的经济崩溃后，冯·法尔肯霍斯特不情愿地放弃了驻挪军队。而国民联盟的目标则是在德国内部保留挪威文化的独立性，这在特博文看来是无法接受的；更甚的是，理想化的德意志农耕生活方式与挪威政客推动城市化的诉求也引发了逐渐升温，但并非无可挽回的冲突。\n\n对特博文来说，潜藏更深的问题是欧洲仅剩的几个残存国家之一——瑞典王国的存在。许多人认为，瑞典人早在几十年前就应该识大体地把他们的议会民主制度丢进历史的垃圾堆。有说法称，瑞典人窝藏了挪威的异见人士，向忠诚的挪威公民散布有关德国的恶意宣传和阴险的谎言，在此之上，瑞典人还资助了抵抗组织的恐怖分子，让他们得以逃脱毁灭的命运。\n\n不过，在特博文看来，这些问题都不是不能解决的。但前提是德国能够维持稳定，从而让他能够在与国民联盟的谈判中将德国搬出来当作筹码，逼他们同意进行更进一步的日耳曼化行动。特博文统治下的挪威是德意志的忠实臣属。至少现在是这样。"

 GGN_hans_frank:0 "汉斯·弗兰克"
 POLITICS_HANS_FRANK_DESC:0 "律师、士兵、纳粹忠臣——现在，或许还是一名国王。汉斯·弗兰克将一生奉献给了民族社会主义党，曾与他的领袖一起发动了失败的啤酒馆暴动。二战期间，第三帝国以摧枯拉朽之势击溃了波兰，弗兰克随即被任命为管理此地的总督。他与党卫军通力合作，折断了波兰人民的脊梁，对学者、神职人员以及任何可能对德国新秩序构成威胁的波兰人进行了大肆屠杀。在弗兰克和党卫军的统治下，无数平民百姓的鲜血被炼化为燃料，点燃了名为死亡的焚炉。\n\n进入1942年后，希特勒不再像之前那般青睐弗兰克，总督发现自己在领地内正逐渐陷入孤立。西俄战争期间党卫军的背叛点燃了元首的怒火，导致希姆莱分子被彻底逐出波兰。这下，弗兰克真正成了孤家寡人，集中营内的“劣等种族”已被屠杀殆尽，他只能充当向日耳曼尼亚运送奴隶的批发商。前方等待着他的没有荣耀，也没有新的胜利能让他东山再起。除非，弗兰克能为自己创造赢得荣耀的机会。\n\n当日耳曼尼亚暗流涌动，希特勒的精神状态每况愈下之时，弗兰克对波兰的掌控却在不断增强。总督整天畅想着如何建造更多的摩天大楼、纪念碑和美术博物馆，梦想着将华沙改造为雅利安文化的天堂。人们私下嘲讽他为“斯塔利斯劳国王”，但这讥讽之言背后却暗藏着真相——汉斯·弗兰克也许真的能成为国王。"

 UKR_erich_koch:0 "埃里希·科赫"
 POLITICS_ERICH_KOCH_DESC: "这就是留给埃里希·科赫的，他应得的境遇。\n\n埃里希·科赫执掌大权时，就像个登上王座的恶匪。科赫所施行的政策，即使以纳粹的标准来看都算是残暴至极。他对殖民地的施政方略就是不停榨取资源，无尽地压迫着当地人口，唯一目的就是让乌克兰人民屈服。在科赫的监管之下，德国通过施行饥饿计划掠夺原先属于乌克兰人民的琥珀色田野，而他制定出的劳动配额也为当地人戴上了奴隶的枷锁。在科赫看来，正是他一手打造出日耳曼国理想中的生存空间：希特勒皇冠上的一枚血钻。\n\n当然，有压迫的地方就会有反抗。西俄罗斯战争爆发后，科赫已经无法处理乌克兰专员辖区的诸多问题。大量行政人员不停地向他索要物资，希望进一步靠粮仓为德国病态的经济输血。而在他的暴政下，越来越多的当地人开始争取自由，希望摆脱他一身造就的深渊。这一次，科赫再也没法靠暴力镇压来解决问题了，专员辖区的秩序彻底失控。\n\n即使恐怖分子横行、辖区难以继续盈利，这位专员依旧没打算改变现状。科赫或许自有解决办法，但却没有精力去改变乌克兰的命运。为了榨取更多的利润，科赫宁可将这片殖民地碾为齑粉。而现在，他正注视着乌克兰的尘土随风飘散。"

 OST_Hinrich_Lohse:0 "欣里希·洛泽"
 POLITICS_HINRICH_LOHSE_DESC:0 "如果有人稍微去看一看德国所有的专员辖区，他发现不了这个令人印象深刻的景象。德国的大部分专员辖区都处于崩溃的边缘，或者是对德国不忠，又或者仅仅是无利润的地狱。然而，在这些争吵不休的傀儡中，有一个脱颖而出，成为德国真正的瑰宝。德国东方专员辖区基本上是一个平静、有利润、多少部分日耳曼化的地方，这一切都是因为一个人：欣里希·洛泽。洛泽是一战老兵，纳粹党的早期支持者，还是石勒苏益格-荷尔斯泰因省的高级专员，他被指派成为专员丝毫不令人意外。从那以后，他对东方专员辖区的管理比较松散，把大部分必要的工作委派给他最忠诚、最能干的下属。这种策略已经取得了很多成果，因为东方领是日耳曼化程度最高、利润最高、最稳定的专员辖区之一。只要以作为花瓶的洛泽来控制这些人，这个系统就能运行下去。\n\n然而，人寿终有期，过去的几年洛泽越来越远离公众的视线。当他努力延续着团结的存在时，在他手下的人都明白，随着洛泽松散的手段越来越无力，那些曾经忠心耿耿的下属们现在开始越来越饥渴，开始觊觎着洛泽的位置。\n\n德雷克斯勒、施塔勒克和迈尔-兰德鲁特之间相互争吵，科夫纳的进攻越来越大胆，维图什卡和耶克尔恩在暗处监视与谋划，系统中产生了明显的裂缝。东方领的人民只能希望，要么洛泽康复，要么选出一位折中的候选人接替他的职位，以免里加街头发生混乱和流血事件。"

 MCW_Siegfried_Kasche:0 "西格弗里德·卡舍"
 POLITICS_REICHSKOMMISSAR_Kasche_DESC:0 "牢卡在新版本TNO被移除力（悲）"

 CAU_josias_zu_waldeck_und_pyrmont:0 "约西亚斯·楚·瓦尔德克-皮尔蒙特"
 POLITICS_REICHSKOMMISSAR_JOSIAS_DESC:0 "瓦尔德克-皮尔蒙特亲王世子约西亚斯从小在权贵中长大，但在德意志共和国宣布成立时，他却无力阻止家族的贵族头衔和特权被剥夺。他在20世纪20年代末加入了纳粹党，很快就进入了党卫军，并稳步攀升。约西亚斯很快就有了一丝不苟、忠于法律的名声，就连布痕瓦尔德集中营的指挥官卡尔-奥托·科赫也被他以挪用公款的罪名起诉。当西俄战争结束时，约西亚斯已经在瓦尔特兰有了党卫军高级警察专员的舒适工作，而且在希姆莱失败的党卫军政变后也几乎没有受到事件波及。为了保持自己的名声不受影响，同时也继续充当希姆莱在德国东部外围地区的耳目，两人设计了互相之间闹翻的一出戏，以约西亚斯公开谴责党卫军并撕毁军证而告终。\n\n当得知高加索专员辖区被游击队所肆虐，需要新的专员时，约西亚斯很容易就用他出色的业绩和优秀的声望说服了元首。但是到达梯弗里斯后还不到一周，约西亚斯就被外高加索苏维埃游击队的一个支部绑架了，残忍折磨了三天。他记得自己所受的每一点痛苦，也记得每一副看着自己的面貌。在他终于获救后，他将他的“平定”计划付诸行动。在高速公路和城市设防，对当地人强行迁移，不合作的地区被无差别用燃烧弹轰炸。约西亚斯也开始用忠诚的党卫军成员充任政府人员和卫戍部队，并悄悄地重新加入了组织（不过他认为自己原先的成员编号没有被恢复是一种侮辱）。他仍然把资源配额运送给日耳曼尼亚，好让他们不会抱怨，但是仍有些人依然认为他实际上听命于南齐锡。"

 HOL_arthur_seyssinquart:0 "阿图尔·赛斯-英夸特"
 POLITICS_ARTHUR_SEYSS_INQUART_DESC:0 "阿图尔·赛斯-英夸特是纳粹占领下尼德兰的领袖，但随便哪个农民都干得了他的工作，恐怕还能比他做得更好。\n\n他是一名奥地利纳粹党人，在德奥合并期间参与了让奥地利沦为德国的一个省份的行动。他得到专员的职位是由于纳粹相信荷兰占领政府不需要嗜血的将军或狂热的政客来统治。当然，他与希特勒的私人友谊也在其中扮演了一定角色。\n\n他终其一生都在担任行政官僚，拥有丰富的管理经验，这可能是他带给荷兰的唯一正面要素，因为前荷兰领土上已经建立起一套令人惊羡的官僚体制，确保了占领政权的平稳运行。\n\n不过，这可能是阿姆斯特丹能向柏林汇报的唯一一件好事了。因为赛斯-英夸特的政治才能简直跟白痴别无二致，如果有人问他觉得哪位元首的继承者能为国家带来最好的利益，他只会回答“希特勒干得就挺不错的，下一任应该也差不多吧”。这种中立的态度让他的荷兰领地在其他派系忙着相互攻讦时选择隔岸观火，赛斯-英夸特认为这才是处理问题的最好方式。\n\n随着时间的推移，他的作用变得仅仅限于签发逮捕令和处决令，以及阻止荷兰民族社会主义运动(NSB)涉足权力中心。不过看起来赛斯-英夸特对“权力中心”这个词的理解跟世界上其他地方的人略有不同，因为绝大多数低级官僚都是由NSB阿姆斯特丹集团的成员所担任的，更高阶的职位则掌握在人民派与穆塞特派的手中，导致NSB离完全掌控政府仅有一步之遥。"

 BRG_Heinrich_Himmler:0 "海因里希·希姆莱"
 POLITICS_HEINRICH_HIMMLER_DESC:0 "几十年来，海因里希·希姆莱一直都是一位忠诚的纳粹党员。多年以前，他也曾参与了1923那次失败的慕尼黑啤酒馆暴动。而与啤酒馆暴动后的几个月里一样，德国的失败同样让希姆莱希望幻灭，满怀愤恨，也让他对自己的意识形态更加投入。\n\n战争胜利的春风已经吹过，伟大计划正在榨干德国工业，希姆莱的信心动摇了；经济已经崩溃，日耳曼尼亚政府却无力将其拯救，希姆莱的信心摇摇欲坠；俄国人只差一步就夺回了莫斯科，希姆莱的信心化作了无尽的残渣碎片。这不可能是因为犹太人的阴谋或者同盟国的破坏，再没有人能令德国刀刺在背了……除了纳粹自己。\n\n希姆莱相信，纳粹已经腐化堕落了，它从内部腐蚀了整个德国。而他，希姆莱，有责任——不，是天命所定，要从内部将其拯救。从巴黎到日耳曼尼亚再到正在解体的东方A-A线，党卫军部队准备好推翻希特勒，并让德国走上正确的路线。然而，斯派达尔却提前听到了消息，密谋还未开始便被“逆火行动”熄灭了。\n\n希姆莱的计划遗漏了，许多部队遭到了逮捕，党卫军似乎注定要毁灭于此。然而希特勒清楚，如果他杀了希姆莱，那么一定会有一场内战因此爆发，因此他给希姆莱找了一处远离日耳曼尼亚的封地，让他远离德国政坛的去处：党卫军勃艮第骑士团国。希姆莱极其不情愿地接受了这个提议，把德国国内党卫军交到了自己忠诚的部下莱因哈德·海德里希手中，随后前往了南齐锡。在那里，希姆莱的信念愈发坚定，而且他从未忘记自己所遭受过的不公……"

 COG_Siegfried_Muller:0 "西格弗里德·穆勒"
 POLITICS_SIEGFRIED_MULLER_DESC:0 "西格弗里德·穆勒专员是德国最受宠爱的媒体红人之一：他有着勇气，魅力与强烈的吸引力。他是中非专员辖区富有魅力的领袖，也是德国三位非洲专员当中最富裕的一位。作为一名老兵，穆勒在波兰、法国与俄罗斯崭露头角，他领导下的中非是唯一一个持续为德国带来利润的殖民地，相较之下其他殖民地则要么克扣利润，要么定期从祖国身上榨取油水，干着各种近乎背叛的勾当。他对中非的管理方式被委婉地称作“自由放任主义”，不那么委婉的说法则是“基本啥都不管”：让外国公司来肆意榨取刚果的财富，中非专员辖区则通过收取运输通行税赚得盆满钵满。同时，穆勒的德国手下则极尽玩忽职守之能事，每天喝酒喝到断片，无差别开枪猎杀会动的东西，与所有穿衣服的人发生关系，然后拿自己的工资支票来赌博。这还只是一般情况，更有甚者还会出卖自己的肉体去给其他专员辖区乃至任何人去当雇佣兵——不管是外国人还是德国人都无所谓，只要肯付钱就可以。\n\n穆勒本人的最大爱好则是打猎，他每隔一段时间就会定期前往黑暗的丛林深处猎杀各种壮硕的非洲野生动物。如果他碰巧遇到游击队的话，就有机会猎杀一种最为危险的猎物了……"

 GRO_Hans_Huttig:0 "汉斯·许蒂希"
 POLITICS_HANS_HUTTIG_DESC:0 "即便是在德国内部，也很少有人的威名能如汉斯·许蒂希专员那般令人毛骨悚然。作为大战期间种族灭绝营的督导人，许蒂希将其毕生的才华奉献于东非的残酷民族社会主义实践中。无论是盘根错节的非洲奴隶营，还是不断壮大的叛军部落，都将其视作纳粹恐怖的致命谜题，富有数学才华的祸根。但对汉斯·许蒂希本人而言，他更乐于将自己看作唯一探求到非洲真相的德国人：非洲大陆孕育着黑暗之心；唯有配上大马士革钢披裹的铁拳，文明才不会被次等人类的邪念所吞噬。\n\n许蒂希决心将自己的忠诚奉献给德意志，他在国内创下的种种“壮举”与精妙的组织能力已经多次向世人证明过这点。为了建立高效而纯净的政府，许蒂希只雇佣德国人参加他的事业，也拒绝启用党卫军非洲师的力量，相反，他不断锻炼磨砺着自己麾下凭借罗得西亚英裔白人支撑起来的精锐卫队。以许蒂希的意志建立起来的军国主义社会与其说是殖民当局，不如看作放大版的种族集中营。可悲的是，他的下属同僚们却有不少选择放任名下的领域堕落腐化，自己则立身制高点享受着无尽的繁荣与不应得的财富。\n\n对此，许蒂希相当蔑视那群“垮掉的”同僚。作为回应，他单线维持着与本土的沟通，独身策划着在东方与南方不可避免的冲突。“非洲唯一的纳粹分子”——这是外国情报机关称呼他的头衔，对此他也没有丝毫异议。非洲除了汉斯·许蒂希以外，谁也不需要。"

 ANG_Wolfgang_Schenck:0 "沃尔夫冈·申克"
 POLITICS_WOLFGANG_SCHENCK_DESC:0 "作为德意志昔日最耀眼的战斗王牌，沃尔夫冈·申克在德属西南非洲的统治是由空军造就的。在祖国服役期间，他以亲身执行过数百次飞行作战任务远近闻名，在德国空军任职期间，沃尔夫冈也因其轰炸机研制领域的专业技能尊享行内好评。可笑的是，德意志祖国最终打发他来管理非洲最贫困的专员辖区，这里缺乏工业基础，物资严重依赖进口，就连维持飞行跑道运转的燃料费也卡的很死。国内快速发展的空军力量是他唯一关心的精神寄托，任何曾经眺望过安哥拉地平线的人都能得出这样的结论：“沃尔夫冈的飞机是撒哈拉以南天空的唯一霸主”。\n\n多年以来，申克所有的努力都是为了将西南专员辖区打造为德属非洲的空中交通枢纽，而在国内事务方面，沃尔夫冈与其事业伙伴兼私交密友西格弗里德·穆勒一样，以宽大仁厚著称于世——两人经常同坐私人直升机出游或参加狩猎活动。也许，对流层之上的云朵正是他温暖的避难所，那里没有党卫军要应酬，没有土著需烦恼，天空正是有这般魔力吸引他远去——安慰与爱之所在。"

 ARM_Migirdic_Sellefyan: "姆克尔季奇·舍列费扬"
 POLITICS_MIGIRDIC_SELLEFYAN_DESC: "“锡罐之王”高踞宝座，但这宝座并非建立在波澜壮阔的古老史诗或民族解放的浪漫传奇之上，而只是土耳其出于其利益，为他捏塑而成。\n\n姆克尔季奇·舍列费扬曾致力于维系土耳其国内最后的亚美尼亚社区，或许在另一种人生中，他未来仍会继续这一事业。然而，随着亚美尼亚归入土耳其的势力版图，舍列费扬便成了领导他祖先家园的最佳人选。\n\n二战结束后，亚美尼亚局势依旧动荡不安，伊诺努需要一个人去管好当地。于是，写着某个名字的纸条塞进了总统手中，双方达成协议：舍列费扬拿到属于自己的游乐场，亚美尼亚则保证不能对土耳其利益构成任何威胁，新总统就此诞生。\n\n舍列费扬领导的亚美尼亚共和党如今统领全国。共和党在名义上是土耳其老大哥的兄弟党，而实际上，党只是舍列费扬个人利益的载体，里面全都是官迷、民粹主义者，还有寥寥数个亲土耳其政客。对他们而言，选举不过只是例行公事，但若亚美尼亚想要自由，就必须要有所付出……"

 ENG_Barry_Domvile:0 "巴里·多姆维尔"
 POLITICS_BARRY_DOMVILE_DESC:0 "在不列颠诸岛悠久传奇的历史中，世界各地的人们传唱着不列颠尼亚驾驭波涛的歌谣。然而，直到她被征服之时，才有一位水手被选出来统治这个国家。但巴里·爱德华·多姆维尔爵士既非浪涛上的英豪，也非其祖先一般的领土征服者。事实上，多姆维尔恐怕是不列颠岛上最讨人嫌的家伙：不但他自己是头号叛徒，他掌舵的不列颠亦已是枷锁中的囚徒。\n\n多姆维尔生于1878年，父亲是海军上将康普顿·多姆维尔。1892年，他追随父亲的脚步加入了海军，并在第一次世界大战期间指挥舰艇作战。之后他步步高升，被提拔到不同的岗位任职，包括海军情报局局长。但是，多姆维尔对极右翼极为迷恋，这始于1935年他参访德国，为纳粹政府所倾倒，还受约阿希姆·冯·里宾特洛甫邀请参加了纽伦堡党代会，不久之后他就参加了不少英德合作组织。战争爆发后，多姆维尔开始鼓吹要进行“一场流血的革命”，导致他在1940年身陷囹圄。\n\n但最终，登上不列颠海滩的国防军让这所谓的“革命”成为了现实。虽然被劳合乔治政府忽视，但他在随后的部委组织中担任要职，成为英国人民党建制派的巨头。当抵抗势力蜂拥而起、切斯特顿却无力将其镇压之时，多姆维尔的精明强干和在政府几乎所有派系中的良好声誉使他成为首相的自然之选。\n\n如今，这位舵手已经驾着不列颠行过六年的风风雨雨。人们似乎形成了某种共识，感觉他干得比其他人都好出不少。经济似乎稳步复苏，国家似乎日益团结，过去的阴影也在逐渐淡去。至于抵抗运动，多姆维尔的方法似乎也奏效了，相比五十年代的潮起云涌，现在的英国似乎十分平静。也许，这就是新时代的开始。\n\n§x还是说，这一切都不过是风暴前的平静……§!"

 FRA_Jean_Louis_Tixier_Vignancour:0 "让-路易·蒂克西埃-维尼扬古"
 POLITICS_JEAN-LOUIS_TIXIER-VIGNANCOUR_DESC:0 "让-路易·蒂克西埃-维尼扬古此人能当上总统，本身就是法兰西国政府陷入混乱内斗的典型表现。维尼扬古曾于1936年当选第三共和国的国民议会议员。在第三共和国飞速倒台后，他又被选为法兰西国的议员。在法国政客们的眼中，此人就是一个让人爱恨交织的两面派。\n\n西俄罗斯战争粉碎了德国经济，同时勃艮第建国，在此之后，时任法国总统的皮埃尔·赖伐尔突然去世，法兰西国的政治体制再次瘫痪。值此国家濒临崩溃之时，蒂克西埃-维尼扬古又一次成为了团结法国的众望所归之人。他由此被推举为总统。尽管障碍重重，但他还是团结起了支离破碎的民族党，重建了在经济危机后不复存在的微弱稳定杆，并维系了法兰西国政权。这样一来，人们对他的评价也日趋两极。\n\n尽管蒂克西埃-维尼扬古表面上宣称自己并非亲德派，而实际上他与德国的合作关系日益加深。此事实让议会中反对他的议员越来越多，所有人都渴望改变现状。在德国局势恶化的当下，从前遍布法国的混乱也日渐猖獗。让-路易·蒂克西埃-维尼扬古与他的政府陷入了毫无意义的内耗，而法国的政局却已经抛弃了他们。\n\n抵抗运动的实力水涨船高，勃艮第的威胁火烧眉毛，法兰西国局势已经是危如累卵。\n\n维尼扬古心知欧洲和平的表象下可有无数暗流在涌动，一旦战争爆发，法国必将再陷火海。"

 SER_Dimitrije_Ljotic: "德米特里耶·廖蒂奇"
 POLITICS_DIMITRIJE_LJOTIC_DESC: "在所有塞尔维亚人中，只有德米特里耶·廖蒂奇及其教权法西斯政党联合激进劳工组织得到了足够的信任，能够掌管塞尔维亚的傀儡政权。这也合情合理，因为他和他的政党是这个国家唯一甘愿做德国走狗的，即使在第二次世界大战和南斯拉夫沦陷于民族社会主义帝国之前，反德情绪就已充斥塞尔维亚全国上下。\n\n廖蒂奇生于1891年，在第一次世界大战期间曾在塞尔维亚军队服役；之后，他进入政界。1931年，他被任命为司法部长，但仅六个月后就被迫下台，因为他提出的政治制度即使对以威权著称的亚历山大一世来说也过于专制。之后，他成立了亲德政党联合激进劳工组织，却在1935年和1938年遭到拒绝，并在不完全虚假的“宗教狂热”指控下被送进疯人院，最终四处逃匿，直到1941年轴心国占领巴尔干。\n\n当轴心国寻找合作者时，只有廖蒂奇符合条件；极少有人像他这样热情、疯狂或谄媚。他是一个坚定的反犹主义者，甚至在许多纳粹之前就公开主张消灭犹太人。加上他对德国的疯狂热爱，以及对共济会、共产主义者和资本主义者的疯狂仇恨，使他成为控制塞尔维亚余下部分的理想人选……不过，对他来说不幸的是，这个政权根本无法运作，也永远不可能运作。\n\n由联合激进劳工组织统治的塞尔维亚政权被普遍憎恨；甚至连因他将其牧首从达豪集中营解救出来而喜欢他的教会如今也无法容忍他。这个国家是一个失败的国家，以至于让其他极度混乱的国家看起来都像托马斯·莫尔的《乌托邦》。由于大量塞尔维亚人在乌斯塔沙统治克罗地亚期间逃离或被驱逐，造成了难民危机。各种各样的游击队，无论是共产主义者还是民族主义者全都遍布乡村。每天都有大量叛逃事件发生。\n\n然而，廖蒂奇不仅没有提出解决办法，反而像他的德国偶像一样不断地咆哮。毕竟，为什么要自我反思呢？他可以把自己的问题归咎于犹太人、自由派、共济会、共产主义者，有时甚至归咎于教宗、土耳其人或保加利亚沙皇。结束廖蒂奇政权的唯一办法就是结束它的痛苦。但事已至此，问题已不是它是否会垮台，而是何时垮台。"

 CRO_Tomislav_II:0 "托米斯拉夫二世"
 POLITICS_TOMISLAV_II_DESC:0 "Tomislav II, previously known as Aimone Roberto Margherita Maria Giuseppe Torino di Savoia-Aosta, was inaugurated against his will as the new Croatian King whilst the Second World War consumed Europe. Once a Prince of Italy's royal house, Aimone found himself at the head of a nation which he had no love for - he didn't speak a word of Croatian nor had he even ever been there, as he was picked simply because of his noble blood. Upon being forced into kingship, Aimone soon found that his title was nothing but a farce, a thin disguise for the iron fisted rule of Ante Pavelić, commander of the brutal Ustaše fascist movement.\n\nThe creation of the Kingdom brought further woe upon Croatia, already plagued by the ruthless ethnic and religious violence wrought on the population by the Ustaše, as the destruction of what little was left of the nation's industry during the turmoil caused the collapse of its already weak economy. The only thing resembling good news was that with Pavelić's death in 1959, Italy, now with Ciano at the helm, seized the chance to actively oppose the Ustaše, forcing them underground.\n\nNow, power stays firmly in the hands of a cadre of Italian advisors and military officers, with King Tomislav II being an unwilling farce of King ruling over a broken nation that hates him and the foreign oppression he represents. With dissent in the country reaching unbearable levels, Croatia might very soon reveal itself to be a powder keg sitting right next on Italy's borders - and the fuse is getting shorter by the day."

 MNT_Nikola_II: "尼古拉二世"
 POLITICS_NIKOLA_II_DESC: "Historically, many rulers were deprived of their crown and forced into exile. Nikola II, king of Montenegro, is in the far more peculiar situation of being simultaneously a ruling monarch and an exile in a foreign land. A scion of the Russian imperial house of Romanov, Nicholas Romanovich has never seen his ancestral lands: born in France in 1922, he and his family moved to Italy in 1936, where young Nicholas completed his education, intending to pursue a career as a naval officer in the Regia Marina. His family connections quickly made him close to the Italian royal court, and he even lived in the residence of king Vittorio Emanuele III during World War II.\n\nIt was then that the trajectory of prince Nicholas's life intersected with the arrows drawn by Axis forces as they stormed across the European map. In the Balkans, Yugoslavia was dismembered into occupation governments and puppet states, among them the Italian protectorate of Montenegro, and as a newly restored kingdom, Montenegro needed a king. Nicholas was not only an Orthodox prince with an ancient surname: he was also educated in Italy, close to the Italian court, and even a relative of the old Petrović-Njegoš ruling house. After much reluctance, Nicholas was forced to accept his crown, and sent off to rule in Cetinje as Nikola II.\n\nBeneath all the pomp and propaganda, Nikola rules a broken country: while the constitution grants immense powers to the king, such power is more theoretical than real. In the cities, it must contend with the wishes of Montenegro's Roman masters, and in the countryside, it fails to reach into the partisan-controlled valleys of the interior. The few allies Nikola has, the local Chetniks and the Cossack regiments of the Italian army, are untrustworthy to say the least. Time will tell whether Nikola will bring back some semblance of peace in the country, or if his kingdom is destined to be yet another broken husk, swept away by the ever bloody tide of Balkan history."

 GRE_Georgios_Themelis: "乔治·塞梅利斯"
 POLITICS_THEMELIS_DESC: "如同现代希腊与横跨全世界的亚历山大帝国之间的关系一样，乔治斯·塞梅利斯仅仅是先总统塞奥佐罗斯·潘加洛斯一个黯淡的影子。精明强干的潘加洛斯曾从合作效府手中夺取权力，并说服意大利让他来恢复希腊的稳定，而糊里糊涂的塞梅利斯执政至今还没有什么出彩表现。潘加洛斯得到了保安营的忠诚，并且至少在表面上准备好了治理希腊的计划，而塞梅利斯不仅得不到自己政府的忠诚，还没法在公众面前掩盖住政府中盛行的腐败作风。\n\n尽管在雅典的大街小巷都可以听到人民在抱怨总统的碌碌无为，但他并不是不了解国家的局势有多么动荡，只是他担心的事情比老百姓担心的还要严重得多。他受制于意大利宗主和一派军官，前者能容忍塞梅利斯政府，仅仅是因为不会给自己找麻烦，后者则是因为军官们强取豪夺的行为得到了总统的准许。塞梅利斯并非不会用希腊人民的利益来中饱私囊，但他有时也会好奇这种状态还将持续多久。"

 SLO_Jozef_Tiso: "约瑟夫·蒂索"
 POLITICS_JOZEF_TISO_DESC: "从一名教士，到罗马天主教神父，再到斯洛伐克共和国的总统，约瑟夫·蒂索神父的一生都是绝无仅有的成功。他早年为晋铎成为神父而接受了教会教育，后来成为一名成功的温和派政治家。蒂索看上去就像是一座希望的灯塔，是一位体面的好人。然而，到了30年代中期，蒂索的观点却转向了威权和极权主义，并成为了斯洛伐克政界中典型的激进派。当纳粹占领捷克斯洛伐克时，约瑟夫·蒂索神父被任命为斯洛伐克共和国总统。蒂索背叛了他的人民，投身于所谓的“领袖崇拜”当中。\n\n在轴心国于第二次世界大战中取得胜利后，欧洲经历了短暂的繁荣，然后是十年的动荡。受到德国经济崩溃打击，斯洛伐克经济也几乎全面崩盘。然而，斯洛伐克政府还是笑到了最后。为了应对国内不断增加的骚乱，蒂索总统进一步镇压了国内的人民，以平息一切不满情绪。\n\n到了1962年，蒂索总统的健康状况正迅速恶化，并且没有任何改善的迹象。眼看蒂索气数已尽，政府内部的许多派系都已经开始准备面对他死后将要发生的一系列事件了。"

 ROM_Ion_Mihailache: "扬·米哈拉凯"
 POLITICS_ION_MIHAILACHE_DESC: "扬·米哈拉凯，罗马尼亚农民主义之父、国家农民党创始人之一。他拥有罕见的政治才能，以此在各党派之间穿针引线。虽然米哈拉凯相较于国家农民党大多数成员都更加倾向左翼，但他依旧赢得了党和罗马尼亚全国上下的尊重。政治家们若是敢于无视他，后果一定不堪设想。\n\n五十年前，米哈拉凯投身教育，开始了自己的职业生涯。在农村家乡，他就深受教师同僚和当地教士们的爱戴，他依仗自己的声望组建起了政治团体，从北蒙泰尼亚开始，建立起了全国性的影响力。\n\n米哈拉凯常年倡导有利于农民利益的改革。历经独裁统治和战争风云，他终于在安东内斯库倒台后一跃成为罗马尼亚最成功的政治家。1960年大选中，他领导国家农民党一举拿下三十二年来罗马尼亚议会中比例最高的多数席位，并将党的左翼重新团结回内部。现在，米哈拉凯领导着得到社会民主党支持的多数派政府。\n\n然而，人生苦短，时不我待，米哈拉凯渐渐察觉到了其他人早已发现的问题：年龄。他现在希望，无论是谁接替自己的位置，都能继续发扬他为罗马尼亚和罗马尼亚人民留下的一切。"

 HUN_Istvan_Horthy_TNO: "霍尔蒂·伊什特万"
 POLITICS_ISTVAN_HORTHY_DESC: "霍尔蒂·米克洛什曾被视作伟人，但虎父竟出了这样个犬子。这惹人憎恶的傀儡，法西斯分子眼里的社会主义者，自由主义者心中的法西斯，贵族里头的自由派，如今孑然一身又束手无策，只能任凭羞耻和悔恨弥漫其心。\n\n霍尔蒂·伊什特万曾只是个小工程师，不辞辛劳为国兢兢业业。他也曾坚定的为深爱的祖国母亲而战，公开批评纳粹并为犹太人的遭遇痛心疾首。但当他成了摄政后，一切都变了。掌权的亲德法西斯分子让他从“小摄政”变成了软骨头，声望荡然无存。\n\n而在其父去世后，他独自接过了摄政的衣钵，还有一个满身疮痍的匈牙利，而他也只能为这一切哀悼。政府名义上受他的晚辈，首相伊姆雷迪·贝洛控制，而贝洛在其中塞满了亲德亲信。如今伊什特万只得惶惶度日，苦苦等待着他拯救匈牙利的那一天到来，这条路充满艰难险阻，但他至死方休。"

 BUL_Boris_III_TNO:0 "鲍里斯三世"
 POLITICS_BORIS_III_DESC:0 "沙皇鲍里斯三世的故事井不只是传记中所叙述的那样简单。四十余年来，这位沙皇肩上始终担负着保加利亚的命运：他的骄傲源自每一次英勇举动，他的耻辱源自每一次卑劣恶行。那么，沙皇陛下驾崩以后，他的是非功过应当如何定论呢？\n\n沙皇的盟友们拒绝回答这个问题，因为答案对他们来说再清楚不过了。凭借着勇气与智慧，鲍里斯三世使马其顿归于保加利亚统治之下，他从法西斯的层层包围之中拯救了这个国家，井维护了它的独立。这也正是他的政府所叙述的故事：简单、纯粹、而又容易传颂。\n\n可关起门来，许多保加利亚人井不相信这个故事，沙皇本人明显已经展现出了独裁的趋向，他通过严酷的政策来维系自己的统冶。不论将沙皇鲍里斯三世描述得多么英明神武，他仍是一个中世纪国王般的独裁者——他性格中的偏执与顽固和普通人并无二致。\n\n不论沙皇最终将留下什么遗产，他的故事很快就要讲完了。现年六十岁，健康状况不佳的鲍里斯三世已开始着手培养西美昂王子，保证未来王子能够平稳地承继大统。而等到鲍里斯三世再也不用为现实的美好或病痛牵挂，撒手人寰之际，这位统一四海之王的故事也终将谢幕。"

 FIN_Juha_Rihtniemi: "尤哈·里赫特涅米"
 POLITICS_JUHA_RIHTNIEMI_DESC: "政治家有两种类型——一种是喧嚣张扬的表演者，他们拥抱喧嚣张扬的政策；另一种是默默奉献的工作者，没有他们，全世界政府都会瞬间崩溃。尤哈·里赫特涅米就是这样的一个人，极度爱国，来自一个深涉政治的家庭，专注于人民的福祉以及个人兴趣，即将东卡累利阿完全纳入芬兰版图。\n\n当德国经济崩溃，民族联合党高层全都黑头垢面时，尤哈却保持了清白。作为一名勤勉且经验丰富的公务员，他冷静而又有调理地处理了西俄战争，以高达72%的选票当选为总统。\n\n在担任总统期间，尤哈稳步而坚定地发展国家，尽管国家依然在德国巨头与逐渐恢复的俄罗斯碎片间走钢丝。他虽然授权了对奥涅加芬兰部队的大规模资金支持，以抵御俄罗斯的威胁，但显而易见，芬兰的老敌人迟早会重新卷土重来，将卡累利阿从祖国中夺走。为此，他的政府大力支持了向卡累利阿人教授芬兰语、在当地安排大量芬兰人以及驱逐残留俄罗斯人的计划。"

 TUR_Ismet_Inonu_TNO: "伊斯麦特·伊诺努"
 POLITICS_ISMET_INONU_DESC:0 "如果说穆斯塔法·凯末尔是土耳其人的父亲，那么伊斯麦特·伊诺努就是土耳其人的教父。他为土耳其指明了一条康庄大道，即使最华丽的辞藻在描述这位国家领导人时也会显得词穷。\n\n伊诺努于1884年出生在士麦那，父亲是库尔德人。从幼年开始，他就面临着一个帝国在他周围崩溃的重压。青年时，伊诺努在也门和鲁米利亚为奥斯曼帝国服役，表现出色，并在穆斯塔法·凯末尔本人的领导下参加了对抗欧洲旧帝国的解放战争。伊斯麦特是一个真正致力于使土耳其民族从哈里发的灰烬中重新崛起的人，他在新的革命卫队中平步青云，直到成为权势不亚于阿塔图尔克本人的副手。\n\n凯末尔尖锐的实用主义和伊斯麦特绝不妥协的意志之间关系一直很紧张，在过去许多的场合迸发出火花。如今，“加齐”已离土耳其人民渐渐远去，许多人声称“老维齐尔”做得太过分了：他把国家出卖给了她的敌人，他违背了土耳其建立的初衷。最重要的是，他玷污了阿塔图尔克的遗产。\n\n在长期担任土耳其共和国总统期间，伊斯麦特·伊诺努一心一意地追求一个目标，即让白手起家的土耳其共和国在这险恶丛生的世界里存续下去。当国家利益要求他与法西斯分子达成妥协时，他服从国家的意志。当局势恶化，导致他不得不动用军队的力量镇压平民时，他会做出艰难的抉择。在过去三十年的艰巨考验中，他一步一个脚印地前进。一路上，他被人打倒在地，在政治斗争中伤痕累累，被侮辱的体无完肤——但他从未被打败过。\n\n今天土耳其共和国屹立于世界，离不开伊诺努个人的政治才干与毫不妥协的意志。这位总统会让土耳其一直伟大下去，不论这要付出何等的代价。"

 SNS_Council: "叙利亚民族国委员会"
 POLITICS_SNS_COUNCIL_DESC: "叙利亚民族国，不过是个被遗弃的孤儿。\n\n作为交换，叙利亚人同意不再支持德国人以换取土耳其保障独立，他们心惊胆颤地看着土耳其士兵大步迈过阿兹姆宫，视线所见之处再也没有德国人的帮助。在昔日反法起义爆发之地，土耳其阴影下的叙利亚民族国成立了——而之后也诞生了反抗叙利亚国的NASIL组织。\n\n民族国在1952年的伊拉克战争中起到了至关重要的作用，当时土军正深陷伊拉克泥潭无法自拔，直到一名名叫塔伊富尔·瑟克曼的叙利亚军官提出了一个直接从叙利亚入侵伊拉克的方案，本来有把握一举赢下战争。但瑟克曼随后被NASIL暗杀，使得民族国顿时以政治迫害、动用军队，甚至是公开处决等等强硬手段暴力镇压了全国各地的异议以及反土情绪。\n\n今天，民族国被个由胡斯尼·扎伊姆、阿迪卜·施舍克里、法齐·塞卢、萨米·欣纳维组成的议会控制着，他们之中的每位都对叙利亚有着自己的野心。然而NASIL的残党依旧在暗中窃窃私语，酝酿着再次出击；他们的密谋无疑是个威胁，随时都有可能将根基本就不稳的民族国政府一举推翻。"

 SWE_Tage_Erlander_TNO: "塔格·埃兰德"
 POLITICS_TAGE_ERLANDER_DESC:0 "1945年，瑞典首相佩尔·阿尔宾·汉森从斯德哥尔摩的火车上踱步下来，突然昏倒在地、溘然长逝。汉森给瑞典留下的遗产不可谓不庞大。在他担任政府首脑的这段时期内，瑞典民族的生存境况得到了极大改善，直到他去世的那一刻，这样的趋势似乎也不会停止。但出乎意料的是，社会民主党和瑞典的命运落到了教育部长塔格·埃兰德的身上。他将在这混沌无度的时代接过瑞典的火炬。往日欧洲已经不再：德意志的新秩序澄清玉宇，瑞典是如今唯一的一个不受德国直接管辖的斯堪的纳维亚国家。尽管欧洲战场已经迎来终局，但如此的苟且偷安绝不可能维持太久。为避免被占领的命运，埃兰德对德国开放了瑞典的贸易，与德国合作。这一决定很快变成了人民党集中攻击社会民主党的论点，人民党也随之采取了明确的亲美立场。\n\n从那时起，埃兰德就证明了自己的确是汉森的得意门生。他虽然不如汉森那样魅力非凡，但这位首相的政策还是使他广受欢迎。在40年代末和50年代，他推动了全民健康保险、扩大养老金支出和儿童保健扩大化，而这些只是改革的一部分。多亏了瑞典只有一支小规模的军队，同时与德国贸易带来了惊人的利润，瑞典完全可以承担这样的开支。\n\n然而，瑞典的一切并非一帆风顺。埃兰德比谁都清楚德国人对瑞典打着什么算盘，而国内的反对派也知晓这一点。未来的几年将会证明，所谓的“人民家园”到底值不值得。"

 IRE_sean_lemass_TNO:0 "肖恩·弗朗西斯·勒马斯"
 POLITICS_Sean_Lemass_desc:0 "说肖恩·弗朗西斯·勒马斯爱爱尔兰，未免显得有些轻描淡写了。自1916年那场声震寰宇的反英起义以来，他就一直勤勤恳恳，为国家安全与繁荣发展殚精竭虑。最终，他的贡献为世人所认可，埃蒙·德·瓦莱拉退休后对其登上总理之位予以支持。勒马斯由此跻身爱尔兰政坛的最前列，但却发觉国家的状况已是一发不可收拾。\n\n上任不久，经济崩溃、北郡叛乱和地位不稳等种种问题接踵而至。他曾力促德瓦莱拉与德国联手，意图收复北爱，然此举的长远影响却令他夜不能寐，因为此时的爱尔兰愈发仰承柏林的鼻息。在任总理的每一刻，勒马斯都痛苦地意识到，或许他只能缓解国家的颓势，难以彻底逆转。尽管他对国家的未来持悲观态度，但勒马斯仍坚守阵地，他所做的一切，维护了爱尔兰的领土与政制，值得我们高声称赞。\n\n然而，若是勒马斯不能拯救国家于水火，他的所有成就都将烟消云散。虽然这项任务的难度随着反对派统一党的力量和北方各郡发生的恐怖袭击事件的数量而剧增，但并非没有可能。若是能打破重围、令国家重振雄风，勒马斯定能永载史册，与开国先贤齐名。但要是失败了，那他就得为国家陪葬。"

 ICE_olafur_thors_TNO: "奥拉维尔·索尔斯"

 FAR_Erlendur_Patursson: "埃伦迪尔·帕蒂尔松"
 POLITICS_Erlendur_Patursson_DESC: "埃伦迪尔·帕蒂尔松正坐在他位于托尔斯港的狭窄办公室里，趁着和本党同志与同盟盟友的两次会议之间的空闲时光，他眺望着窗外，一望无垠的大海正泛起点点金光，拖网渔船正驶向更远方的海洋。这让他想起了他正争取的那件事物。\n\n帕蒂尔松的政治生命与他领导渔民联盟的事业相始终。在这项工作期间，他亲眼见证了OFN政策的失败，看到了美国人是怎么巧妙安排，把渔业和那些有限资源的利用权以及军事行动计划都联系在一起的。\n\n帕蒂尔松是民族主义政治家乔安尼斯·帕蒂尔松的儿子，在政治上素来活跃。这个认识推动他组建了自己的政党，也就是共和党。在共和党中，他尽力让自己的担忧转化成恰当的政策。他与新老盟友共同擘画左翼的法罗群岛的愿景，要从OFN中挣脱出来，并准备好为人民而奋斗，实现这个目标。\n\n新总统埃伦迪尔·帕蒂尔松已做好准备去实现这个愿景。他知道理想很丰满，但他已经准备好去争取OFN愿意给的哪怕一点点东西。只要能帮助法罗群岛的渔民们，让他做什么都行——他是始终如一的。"











