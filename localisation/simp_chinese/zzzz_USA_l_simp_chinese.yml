 USA_harry_s_truman: "哈里·杜鲁门"
 POLITICS_HARRY_S_TRUMAN_DESC: "哈里·S·杜鲁门（1884—1972），第33任美国总统，民主党“正统朗主义”的奠基人。这位早年曾力挺休伊·朗的密苏里人，在1948年大选中将朗的激进民粹“合宪化”，开创了要塞凯恩斯主义。面对诺曼底惨败后欧陆尽赤的地缘危机，杜鲁门带领合众国平稳渡过“三年核真空期”；一方面推行福利托底以维系后方士气，另一方面在赤潮的压力下维护住了仅存的西方阵营，是正式拉开“美利坚堡垒民主”时代的第一舵手。"
