l_simp_chinese:
 la_menagerie_de_versailles: "西法的右翼动物园"
 la_menagerie_de_versailles_desc: "塞纳河的铁幕将所有左翼隔绝在外，使得西法陷入了畸形的内部倾轧。在这个没有左翼的国度里，神权保皇派嘲讽法西斯工团是下流暴民，天主教改良派在暗中与流亡的资本家勾结，而法西斯民兵则用枪托在街头收缴选票。九个动物在凡尔赛的兽笼里互相猜忌，每一项政令都必须在密室中经历数月的扯皮与讹诈。"
 les_cicatrices_dalger: "阿尔及利亚惨胜的余震"
 les_cicatrices_dalger_desc: "戴高乐的残部最终在1950年被赶出了阿尔及尔港，但这场胜利吞噬了我们战后初期仅存的元气。为了将那个拒绝闭嘴的将军逼向萨赫勒，我们耗尽了维希时期留下的全部外汇和弹药储备。更致命的是，北非的法国定居者（黑脚）将这场内战视为凡尔赛欠他们的血债，而当地原住民的眼神则日益冰冷。地中海暂时平息了，但海底埋藏的火药桶随时可能再次引爆。"
 letat_de_siege_de_laval: "赖伐尔的最后围城"
 letat_de_siege_de_laval_desc: "支撑这个政权的从来不是崇高的信条，而是一个九十五岁老人的心跳。随着贝当元帅的病榻日渐冰冷，赖伐尔知道他的免罪券正在过期。达南德的黑色警察在午夜的街巷里急促穿行，阿尔卑斯山的收容所里塞满了曾经的同僚与自由派议员。整个国家在刺刀下屏住了呼吸，但就连国防部的魏刚元帅都拒绝接听总理府的调兵电话——这道最后的戒严令，正是这位老政客权力的绝唱。"
 linstitutionnalisation_de_la_revolution_nationale: "国民革命法典化"
 linstitutionnalisation_de_la_revolution_nationale_desc: "德拉巴泰特与伊索尔尼用最精密的法律语言，完成了对1789年大革命遗产的彻底清算。在这部以“家庭、工作、祖国”为基石的宪法下，劳资纠纷被强制整合进国家法团的齿轮中，工会被剥离了政治毒牙，罢工被定性为对民族的叛国。教会在教室中恢复了讲坛，土地重新成为法兰西灵魂的锚点。尽管专制而冰冷，但它确实为这个千疮百孔的残存国家换取了残酷的生产纪律与动员秩序。"
 les_fers_des_accords_de_paris: "巴黎协定的枷锁"
 les_fers_des_accords_de_paris_desc: "1947年由皮埃尔·赖伐尔在巴黎签署的条约，名义上是一张免死金牌，实则是一份凡尔赛式的城下之盟。英美宪兵监督着我们军营里的每一支步枪：军队人数被限制，科研工作被叫停。我们是西方世界的东部门犬，但主人却连项圈上的链条都不愿放松分毫。"
 fra_petain.1.t: "一位英雄离开了他心爱的国家"
 fra_petain.1.d: "悲伤的消息刚刚传来，并登上了所有报纸的头版。老元帅，祖国的救星，凡尔登的英雄，法兰西的解放者，菲利普·贝当，在今天早上于睡梦中平静地去世了。他的妻子欧仁妮·贝当和他的私人牧师让·罗丹在身边陪伴着他，度过了他的临终时刻，直到最后一息，元帅都是一个狂热的天主教徒。\n\n我国政府已计划为其举行国葬，在我们的非官方国歌《大元帅，我来了！》的歌声中，我国的全体政治与军事人物都将出席葬礼，政府业已下令举行为期一周的全国哀悼。\n\n然而，贝当的死亡并不意味着民族革命的终结，在总理赖伐尔的提议下，忠诚而有才干的马克西姆·魏刚将军被国民议会宣布为法兰西国家元首，他随后发誓要继续工作并尽最大努力尊重元帅的遗产。"
 fra_petain.1.a: "大元帅，谢谢你！"
 fra_petain.1.a_tt: "马克西姆·魏刚将接过临时国家元首之职。"
