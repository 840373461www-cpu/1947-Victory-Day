l_simp_chinese:
 fra_petain.1.t: "一位英雄离开了他心爱的国家"
 fra_petain.1.d: "悲伤的消息刚刚传来，并登上了所有报纸的头版。老元帅，祖国的救星，凡尔登的英雄，法兰西的解放者，菲利普·贝当，在今天早上于睡梦中平静地去世了。他的妻子欧仁妮·贝当和他的私人牧师让·罗丹在身边陪伴着他，度过了他的临终时刻，直到最后一息，元帅都是一个狂热的天主教徒。\n\n我国政府已计划为其举行国葬，在我们的非官方国歌《大元帅，我来了！》的歌声中，我国的全体政治与军事人物都将出席葬礼，政府业已下令举行为期一周的全国哀悼。\n\n然而，贝当的死亡并不意味着民族革命的终结，在总理赖伐尔的提议下，忠诚而有才干的马克西姆·魏刚将军被国民议会宣布为法兰西国家元首，他随后发誓要继续工作并尽最大努力尊重元帅的遗产。"
 fra_petain.1.a: "大元帅，谢谢你！"
 fra_petain.1.a_tt: "马克西姆·魏刚将接过临时国家元首之职。"
