l_simp_chinese:
 berlin_international: "柏林国际成员国"
 berlin_international_desc: "1949年五一劳动节在柏林弗里德里希区敲响重建的钟声以来，作为第一、二、三国际继承者的“共产国际（重建）”——或者它更为人知悉的名字“柏林国际”——成为了横跨欧亚大陆的多边社会主义协调中枢。从巴黎塞纳河东岸的公社街垒，到鲁尔区的重工高炉，再到白雪皑皑的札幌船台，各国兄弟党在尊重彼此近代工业传统与无产阶级斗争特殊性的前提下平等议事。在资产阶级眼中，这是‘从坟墓中爬出的赤色幽灵’；但在亿万翻身劳工眼中，它是人类文明迈向大同的最高议事厅。"
 infor_member: "国际工人武装力量成员国"
 infor_member_desc: "如果说“柏林国际”是联合全球无产阶级政党的政治中枢，那么作为其直属常设防务机构的“国际工人武装力量”（INFOR），便是保卫胜利果实的钢铁拳头。不同于向全球所有马克思主义政党敞开大门的党际代表大会，该军事同盟严格由已夺取国家政权、实现社会主义执政的主权国家共同组建，虽然名义上各成员国地位平等，但苏联毫无疑问是INFOR的实际主导者，并由其协调各国的军工规划，至少目前，各国对此并无意见。无论如何，依托柏林国际常设军事委员会的统筹协调，各成员国打破了传统民族国家的国防壁垒，实现了一体化整合。它将各国分散的武装力量熔铸为一支受国际主义原则共同指导的联合大军——凡有社会主义红旗升起并执掌国政之地，皆受全体工人阶级武装力量的共同誓约庇护。"
