 marxism_leninism: "Marxism-Leninism"
 marxism_leninism_noun: "Marxism-Leninism"
 marxism_leninism_subtype: "Marxism-Leninism"
 marxism_leninism_subtype_desc: "As the sword-bearer of the Eurasian Red continent, Marxism-Leninism upholds the dictatorship of the proletariat under vanguard leadership and planned production under public ownership. With the Red Army watering its horses on the Seine and sweeping across East Asia, this doctrine is no longer a subversive fringe current but a vast imperial order spanning two oceans. It vows to bury the crumbling old world of capitalism through socialised industry and revolutionary discipline."
