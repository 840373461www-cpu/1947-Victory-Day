l_english:
 marxism_leninism: "Marxism-Leninism"
 communism_subtype_desc: "As the sword-bearer of the Eurasian Red continent, Marxism-Leninism upholds the dictatorship of the proletariat under vanguard leadership and planned production under public ownership. With the Red Army watering its horses on the Seine and sweeping across East Asia, this doctrine is no longer a subversive fringe current but a vast imperial order spanning two oceans. It vows to bury the crumbling old world of capitalism through socialised industry and revolutionary discipline."
 communism_desc: "Revolutionary"
 radical_socialist_subtype: "Radical Socialism"
 radical_socialist_subtype_desc: "Radical Socialism gathers the various pan-left revolutionary forces outside the Leninist vanguard line. Whether syndicalist direct action, anarchic self-rule of workers and peasants, or the anti-imperialist and anti-colonial national movements of Asia, Africa and Latin America that wield class liberation as their weapon, they all strike at the existing order with a radical wall-breaking stance. It demands the shattering of transnational capital and comprador warlords, rejects step-by-step parliamentary compromise, and places the total liberation of the nation and the labouring masses in tempestuous direct struggle."
 radical_socialist_desc: "Revolutionary"
 reformist_socialist_subtype: "Reformist Socialism"
 reformist_socialist_subtype_desc: "Reformist Socialism bids farewell to bloody revolution and class struggle, seeking a road to socialism within representative rule of law and a constitutional framework. Whether advancing reform from the parliamentary rostrum or regulating the market under mixed ownership, it strives to reconcile social justice with individual liberty. It sees itself as the rational bridge between radical fanaticism and oligarchic exploitation, seeking to gently reshape a secular socialist society of equality and dignity through ballots, law and public welfare."
 reformist_socialist_desc: "Reformist"
 social_democrat_subtype: "Social Democracy"
 social_democrat_subtype_desc: "Social Democracy keeps to the reformist road, grounded within constitutional democracy and the capitalist framework. It does not seek to abolish private property, but tames capital through independent trade unions, progressive taxation and a welfare network from cradle to grave. Squeezed between Cold War rearmament and popular demands, it insists on labour-capital co-governance and social compromise, seeking to sustain a fragile humanitarian balance between the efficient output of the free market and the decent dignity of the masses."
 social_democrat_desc: "Reformist"
 social_liberal_subtype: "Social Liberalism"
 social_liberal_subtype_desc: "Social Liberalism inherits Enlightenment reason and the dignity of common law, proposing to build institutional guardrails of justice above the free market. It stresses the inviolability of civil rights, judicial equality and freedom of speech, holding that the state should guarantee equality of opportunity through limited redistribution. Facing extremist tides at home and abroad, it defends procedural rule of law and the baseline of human rights, convinced that only by preserving individual dignity and an open society can the republic keep its civilisational soul in the storm."
 social_liberal_desc: "Liberal"
 market_liberal_subtype: "Market Liberalism"
 market_liberal_subtype_desc: "Market Liberalism treats private property, market circulation and spontaneous order as the core pillars of civilisation. It resolutely opposes the state's excessive wartime controls and high-tax welfare, advocating free trade, hard currency and self-healing mechanisms under small government. It believes the efficiency of the invisible hand far surpasses state direction, and guards against any expansion of power in the name of 'national security' or 'social equality', seeing free enterprise as the cornerstone against the state Leviathan."
 market_liberal_desc: "Liberal"
 social_conservative_subtype: "Social Conservatism"
 social_conservative_subtype_desc: "Social Conservatism treats traditional ethics, religious custom and the primacy of the family as the anchor of society. It is wary of the street struggles and cultural deconstruction of the radical left, yet also reserved about the unbridled expansion of transnational capital. It advocates maintaining social discipline and local self-government within a constitutional framework, fusing a limited market, traditional authority and order maintenance, convinced that only on the moral bedrock of historical sedimentation can the social organism resist the tearing forces of Cold War turmoil."
 social_conservative_desc: "Conservative"
 national_populist_subtype: "National Populism"
 national_populist_subtype_desc: "Born of Huey Long's 'Share Our Wealth' vision and the American populist sentiment of the Great Depression, National Populism is the crystallisation of that era's ruins. It proclaims that 'every man a king', trading iron-fisted taxation, super-scale infrastructure and cradle-to-grave welfare for the loyalty of workers and farmers, while raising high a fortress against the red tide abroad. It is at once the holy sword of the common people against oligarchs and the populist current that crushes constitutional procedure to crown a secular Leviathan."
 national_populist_desc: "Populist"
 military_republicanism_subtype: "Military Republicanism"
 military_republicanism_subtype_desc: "Springing from the California aerospace corridor and the Pentagon's staff sanctums, Military Republicanism holds that 'technological superiority is the shield of liberty'. It pursues a distinctive dual-market system: the civilian consumer sphere keeps market competition and low-tax vitality, while strategic defence industry is wholly directed by the Pentagon. It forges a free market of supply-side tax cuts to feed the fortress, and builds absolute security through a national military-corporate complex, maintaining a cold balance between free capital and total war preparation."
 military_republicanism_desc: "Hawkish"
 authoritarian_democrat_subtype: "Authoritarian Democracy"
 authoritarian_democrat_subtype_desc: "Authoritarian Democracy preserves the shell of universal suffrage and parliament, yet is in substance tightly controlled by strongman cliques and security bureaucrats. It manipulates constituencies and suppresses dissent through administrative privilege, remaking representative government into a tool for legitimising rule. Facing internal and external crises, it claims extraordinary times must yield to absolute order, maintaining controlled constitutionalism and capitalist vitality while holding the state's iron grip."
 authoritarian_democrat_desc: "Authoritarian"
 paternal_autocrat_subtype: "Paternal Autocracy"
 paternal_autocrat_subtype_desc: "Paternal Autocracy wholly discards the red tape of representative democracy, viewing the state as a great family in need of an iron-fisted father's shelter. The regime runs on professional military police, old internal-affairs bureaucratic networks and chartered oligarchs, enshrining top-down order, loyalty and obedience as the highest dogma. It regards all independent political movements as immature riots, adjudicating social disputes by naked administrative fiat and entrusting the fate of all subjects to the personal will of a strongman leader."
 paternal_autocrat_desc: "Autocratic"
 monarchism_subtype: "Monarchism"
 monarchism_subtype_desc: "Monarchism regards royal authority and classical patriarchal law as the ultimate anchor of civilised order. Facing the depredations of the red storm and the betrayal of modern republics, it keeps faith with divine right, blood legitimacy and the oath between sovereign and subject. It denounces the Bolshevik regicide and disdains the mediocrity and turmoil of mass democracy, vowing to guard the last throne amid the Cold War storm with ancient law and royal edict."
 monarchism_desc: "Monarchist"
 theocracy_subtype: "Theocracy"
 theocracy_subtype_desc: "Theocracy holds that secular sovereignty must submit to the supreme divine oracle. In an apocalyptic atmosphere of nuclear cloud and atheistic red tide, it reframes the Cold War as a final holy war between light and darkness. Whether a doomsday survival commune of the Bible Belt or an ancient sect's church-state regime, it demands that society and thought be governed by harsh religious discipline, seeing firm faith as the only true ark against external annihilation."
 theocracy_desc: "Clerical"
 corporatism_subtype: "Corporatism"
 corporatism_subtype_desc: "Corporatism seeks to abolish class struggle and disorderly capital competition entirely, remaking the state as an organic whole whose parts cooperate like a human body. It outlaws independent unions and free hiring, forcibly integrating labour, capital and agriculture into vertically organised guilds supervised by the state. The regime imposes labour-capital cooperation by administrative arbitration and enforces directive production quotas and price controls, seeing society as a uniform war-preparation workshop and subordinating the entire economy to the primacy of national interest."
 corporatism_desc: "Corporatist"
 third_positionism_subtype: "Third Positionism"
 third_positionism_subtype_desc: "Third Positionism straddles the traditional divide of far left and far right, hating both the atheistic Bolsheviks and transnational finance capitalism. It advocates transcendental nationalism, a radical anti-imperialist stance and fierce anti-materialism, exalting pure class cohesion, national sacredness and armed martyrdom. From extremist Imperial Way officers and blackshirt stormtroopers to the fanatical national warriors of the third world, it seeks a 'third way' outside the icy iron curtain of the red and white blocs through blood, violence and pre-modern romantic fervour."
 third_positionism_desc: "Ultranationalist"
 fascism_subtype: "Fascism"
 fascism_subtype_desc: "Fascism enshrines the supreme authority of the nation-state and all-out external aggression as its creed. It wholly negates liberal constitutionalism and class politics, demanding the total conversion of society into a highly centralised total-war machine. Under absolute obedience to a fanatical leader, it imposes harsh quasi-wartime controls and ideological purification, melting civil rights entirely into the state's discipline of survival, convinced that only iron blood, violence and pre-emptive military expansion can win final victory in the jungle law of the Cold War."
 fascism_desc: "Fascist"
 national_socialism_subtype: "National Socialism"
 national_socialism_subtype_desc: "National Socialism pushed extreme racial eugenics and blood-purity doctrine to the fanatical summit of political theology. It tramples universal human civilisation and juridical order, interpreting history crudely as a ruthless zero-sum struggle for racial living space. With the destruction of the Third Reich in the fires of Berlin, this ideology was proscribed after the war as the absolute common enemy of mankind. Its remnants withdraw into shadowy transnational underground networks and armed hardliners, still dreaming wildly of racial cleansing and apocalyptic revenge."
 national_socialism_desc: "National Socialist"
