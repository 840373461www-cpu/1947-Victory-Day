 VICTORY_DAY_1947_DESC: "Four years have passed since the Second World War ended. The European cataclysm is over, and everything east of the Seine has been dyed red. The debacle in Normandy forced America back to the Western Hemisphere, forging a deeply fortified bastion of democracy; the Red Army waters its horses on the Rhine and dominates the heart of Eurasia. Two Frances gaze at each other across the river, and de Gaulle in West Africa still refuses to bow.\n\nIn the Far East, the scales of civil war tilt toward Nanjing: the Nationalist government seems poised for victory, yet undercurrents churn within. And the shattered Japanese archipelago has become the eye of the storm - South Japan has declared a dictatorship, while North Japan vows to liberate the whole. The unilateral peace at San Francisco severed the illusion of peace; beneath a nuclear shadow the fuse on the islands hisses, and civil war is one spark away."
